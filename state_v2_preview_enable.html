<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskPoints V2 Preview Opt-In</title>
  <style>
    html,body{background:#0b0d10;color:#e5e7eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;min-height:100%}
    body{display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
    main{max-width:560px;width:100%;border:1px solid rgba(148,163,184,.25);border-radius:16px;padding:24px;background:#111827}
    h1{font-size:1.25rem;margin:0 0 12px}p{line-height:1.5;color:#cbd5e1}code{color:#a7f3d0}.ok{color:#86efac}.bad{color:#fca5a5}
  </style>
</head>
<body>
<main>
  <h1>TaskPoints V2 Dark Mirror</h1>
  <p id="status">Checking this deployment…</p>
</main>
<script>
(() => {
  'use strict';
  const KEY = 'taskpoints_state_v2_dark_mode_v1';
  const status = document.getElementById('status');
  const hostname = String(location.hostname || '').toLowerCase();
  const productionHosts = new Set(['taskpoints.pages.dev', 'www.taskpoints.pages.dev']);

  if (productionHosts.has(hostname)) {
    try { localStorage.removeItem(KEY); } catch (_) {}
    status.className = 'bad';
    status.textContent = 'V2 dark mirroring is blocked on the production TaskPoints hostname. Nothing was enabled.';
    return;
  }

  if (!hostname.endsWith('.taskpoints.pages.dev') && hostname !== 'localhost' && hostname !== '127.0.0.1') {
    status.className = 'bad';
    status.textContent = 'This opt-in page only enables V2 on a TaskPoints branch preview or local development origin.';
    return;
  }

  try {
    localStorage.setItem(KEY, '1');
    status.className = 'ok';
    status.innerHTML = 'V2 dark mirroring is enabled for <code>' + hostname.replace(/[<>&]/g, '') + '</code>. Returning to Home…';
    setTimeout(() => location.replace('/'), 500);
  } catch (error) {
    status.className = 'bad';
    status.textContent = 'Could not enable the preview flag: ' + String(error?.message || error);
  }
})();
</script>
</body>
</html>
