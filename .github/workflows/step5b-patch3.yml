name: step5b-patch3
on:
  push:
    branches: [agent/step5b-save-pipeline-trace]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5b-save-pipeline-trace
      - name: Apply and validate Step 5B diagnostics
        shell: bash
        run: |
          python tools/step5b_patch.py
          node --check scoring_core.js
          node --check performance_diagnostics.js
          git diff --check
          grep -q 'savePipeline.compressStorageString' scoring_core.js
          grep -q 'browser.confirm' performance_diagnostics.js
          grep -q 'interaction.click.toNextPaint' performance_diagnostics.js
      - name: Commit diagnostic patch
        shell: bash
        run: |
          rm -f .github/workflows/step5b-patch.yml .github/workflows/step5b-patch2.yml .github/workflows/step5b-patch3.yml tools/step5b_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Trace interaction save pipeline'
          git push origin HEAD:agent/step5b-save-pipeline-trace
