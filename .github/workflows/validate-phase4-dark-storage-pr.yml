name: Validate Phase 4 dark storage PR

on:
  pull_request:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Materialize implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-phase4-dark-storage.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/phase4_payload.b64 <<'PAYLOAD'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\nPAYLOAD\n', start)
          Path('/tmp/phase4_payload.b64').write_text(source[start:end] + '\n', encoding='utf-8')
          PY
          base64 -d /tmp/phase4_payload.b64 > /tmp/phase4_payload.tar.gz
          tar -xzf /tmp/phase4_payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          path = Path('phase4_storage_coordinator.js')
          source = path.read_text(encoding='utf-8')
          start = source.index('  function installStorageHooks() {')
          end = source.index('\n\n  core.PHASE4_STORAGE_MODE_KEY', start)
          replacement = '''  function installStorageHooks() {
            const storage = global.localStorage;
            if (!storage) return;

            try {
              if (!storage.__taskPointsPhase4InstanceHookInstalled && typeof storage.setItem === 'function') {
                const originalSet = storage.setItem.bind(storage);
                const originalRemove = typeof storage.removeItem === 'function' ? storage.removeItem.bind(storage) : null;
                const wrappedSet = function phase4SetItem(key, value) {
                  const result = originalSet(key, value);
                  if (String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
                  return result;
                };
                const wrappedRemove = originalRemove ? function phase4RemoveItem(key) {
                  const result = originalRemove(key);
                  if (String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
                  return result;
                } : null;
                storage.setItem = wrappedSet;
                if (wrappedRemove) storage.removeItem = wrappedRemove;
                if (storage.setItem === wrappedSet) {
                  Object.defineProperty(storage, '__taskPointsPhase4InstanceHookInstalled', { value: true, configurable: true });
                  return;
                }
              }
            } catch (_) {}

            const StorageCtor = global.Storage;
            if (!StorageCtor?.prototype?.setItem) return;
            const prototype = StorageCtor.prototype;
            if (!prototype.__taskPointsPhase4OriginalSetItem) {
              const originalSet = prototype.setItem;
              Object.defineProperty(prototype, '__taskPointsPhase4OriginalSetItem', { value: originalSet, configurable: true });
              prototype.setItem = function phase4SetItem(key, value) {
                const result = originalSet.call(this, key, value);
                if (this === global.localStorage && String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
                return result;
              };
            }
            if (prototype.removeItem && !prototype.__taskPointsPhase4OriginalRemoveItem) {
              const originalRemove = prototype.removeItem;
              Object.defineProperty(prototype, '__taskPointsPhase4OriginalRemoveItem', { value: originalRemove, configurable: true });
              prototype.removeItem = function phase4RemoveItem(key) {
                const result = originalRemove.call(this, key);
                if (this === global.localStorage && String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
                return result;
              };
            }
          }'''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

          old = "assert.equal(response.headers.get('x-taskpoints-phase'), '3-read-path');"
          new = "assert.equal(response.headers.get('x-taskpoints-phase'), '4-indexeddb-primary-capable');"
          for test_path in [Path('tests/phase3_navigation_worker.test.js'), Path('tests/phase3_worker.test.js')]:
            test_source = test_path.read_text(encoding='utf-8')
            if old not in test_source:
              raise SystemExit(f'Missing expected Phase 3 success assertion in {test_path}')
            test_path.write_text(test_source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run Phase 4 contracts
        id: contracts
        shell: bash
        run: |
          set +e
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js > phase4-contract.log 2>&1
          code=$?
          cat phase4-contract.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload contract log
        uses: actions/upload-artifact@v4
        with:
          name: phase4-contract-log
          path: phase4-contract.log
      - name: Require Phase 4 contracts
        if: steps.contracts.outputs.exit_code != '0'
        run: exit 1
      - name: Run full suite
        id: full_suite
        shell: bash
        run: |
          set +e
          npm test > full-suite.log 2>&1
          code=$?
          tail -n 200 full-suite.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload full-suite log
        uses: actions/upload-artifact@v4
        with:
          name: phase4-full-suite-log
          path: full-suite.log
      - name: Require full suite
        if: steps.full_suite.outputs.exit_code != '0'
        run: exit 1
