name: Validate Phase 4 dark storage PR

on:
  pull_request:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Materialize implementation payload
        shell: bash
        run: |
          awk '/^PAYLOAD$/{marker++; next} marker==1{print} marker==2{exit}' .github/workflows/apply-phase4-dark-storage.yml > /tmp/phase4_payload.b64
          base64 -d /tmp/phase4_payload.b64 > /tmp/phase4_payload.tar.gz
          tar -xzf /tmp/phase4_payload.tar.gz -C .
      - name: Run Phase 4 contracts
        run: node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js
      - name: Run full suite
        run: npm test
