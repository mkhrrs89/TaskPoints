name: Validate Phase 4 dark storage PR

on:
  pull_request:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Materialize implementation payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-phase4-dark-storage.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/phase4_payload.b64 <<'PAYLOAD'\n"
          start = source.index(marker) + len(marker)
          end = source.index('\nPAYLOAD\n', start)
          Path('/tmp/phase4_payload.b64').write_text(source[start:end] + '\n', encoding='utf-8')
          PY
          base64 -d /tmp/phase4_payload.b64 > /tmp/phase4_payload.tar.gz
          tar -xzf /tmp/phase4_payload.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          path = Path('phase4_storage_coordinator.js')
          source = path.read_text(encoding='utf-8')
          source = source.replace('this === global.localStorage && ', '')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Run Phase 4 contracts
        id: contracts
        shell: bash
        run: |
          set +e
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js > phase4-contract.log 2>&1
          code=$?
          cat phase4-contract.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload contract log
        uses: actions/upload-artifact@v4
        with:
          name: phase4-contract-log
          path: phase4-contract.log
      - name: Require Phase 4 contracts
        if: steps.contracts.outputs.exit_code != '0'
        run: exit 1
      - name: Run full suite
        run: npm test
