name: step5e-verify
on:
  push:
    branches: [agent/step5e-task-action-fast-paths]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5e-task-action-fast-paths
      - name: Run Step 5E tests
        run: |
          node --check task_mutation_journal.js
          node --test tests/task_mutation_journal_contract.test.js tests/task_action_fast_paths.test.js
          git diff --check
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/step5e-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Step 5E verification workflow'
          git push origin HEAD:agent/step5e-task-action-fast-paths
