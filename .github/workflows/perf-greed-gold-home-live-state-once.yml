name: Perf Greed Gold Home Live State Once

on:
  push:
    branches:
      - perf/greed-gold-home-live-state-20260915
    paths:
      - '.github/workflows/perf-greed-gold-home-live-state-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/greed-gold-home-live-state-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply Greed Gold live-state fast path
        run: python scripts/apply_greed_gold_home_live_state.py
      - name: Run focused Gold and Home contracts
        run: >-
          node --test
          tests/greed_gold_home_live_state_fast_path.test.js
          tests/greed_gold_economy.test.js
          tests/home_live_state_bridge_contract.test.js
          tests/home_scoreboard_rank_gold.test.js
          tests/home_scoreboard_season3_scope.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greed_gold_economy.js tests/greed_gold_home_live_state_fast_path.test.js
          git commit -m "Reuse Home live state for Greed Gold displays"
          git push origin HEAD:perf/greed-gold-home-live-state-20260915
