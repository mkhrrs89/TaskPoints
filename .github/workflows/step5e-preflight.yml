name: step5e-preflight
on:
  push:
    branches: [agent/step5e-task-action-fast-paths]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5e-task-action-fast-paths
      - name: Add task journal preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          def once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 target, found {count}')
              s = s.replace(old, new, 1)
          once(
              "function persistTaskActionMutation(task, action){",
              """function assertTaskActionMutationWritable(){
          try {
            TaskPointsCore?.assertTaskMutationJournalWritable?.();
            return true;
          } catch (error) {
            console.warn('Task action paused because its durable journal is unavailable.', error);
            try { alert(error?.message || 'This task action is temporarily unavailable.'); } catch (_) {}
            return false;
          }
          }

          function persistTaskActionMutation(task, action){""",
              'journal preflight helper'
          )
          once(
              """function bumpTaskOneDay(id){
            const t = state.tasks.find(x => x.id === id);
            if (!t) return;""",
              """function bumpTaskOneDay(id){
            const t = state.tasks.find(x => x.id === id);
            if (!t || !assertTaskActionMutationWritable()) return;""",
              '+1 day preflight'
          )
          once(
              """function saveTaskEdit(id,card){
            const t=state.tasks.find(x=>x.id===id); if(!t) return;""",
              """function saveTaskEdit(id,card){
            const t=state.tasks.find(x=>x.id===id); if(!t || !assertTaskActionMutationWritable()) return;""",
              'edit save preflight'
          )
          once(
              """function wontDoMain(id){
            const t=state.tasks.find(x=>x.id===id); if(!t) return;""",
              """function wontDoMain(id){
            const t=state.tasks.find(x=>x.id===id); if(!t || !assertTaskActionMutationWritable()) return;""",
              "Won't Do preflight"
          )
          for needle in (
              'function assertTaskActionMutationWritable()',
              "persistTaskActionMutation(t, 'edit-save')",
              "persistTaskActionMutation(t, 'bump-one-day')",
              "persistTaskActionMutation(t, 'wont-do')",
          ):
              if s.count(needle) != 1:
                  raise SystemExit(f'expected one {needle!r}')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check task_mutation_journal.js
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/step5e-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preflight task action journal writes'
          git push origin HEAD:agent/step5e-task-action-fast-paths
