name: State Runtime V2 Trace Ownership Once

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
    paths:
      - '.github/workflows/state-runtime-v2-trace-ownership-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/state-runtime-v2-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply V2 trace ownership evidence gate
        run: python scripts/apply_v2_trace_ownership_evidence.py
      - name: Run focused trace, ownership, and safety contracts
        run: >-
          node --test
          tests/state_runtime_v2_trace_review_contract.test.js
          tests/state_runtime_v2_trace_review_page_contract.test.js
          tests/state_runtime_v2_live_review_contract.test.js
          tests/state_runtime_v2_hot_snapshot_device_evidence_contract.test.js
          tests/state_runtime_v2_pilot_compatibility_boundary_contract.test.js
          tests/state_runtime_v2_pilot_parity_scope_contract.test.js
          tests/state_runtime_v2_habit_edit_contract.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Commit trace ownership evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_runtime_v2_trace_review.js tests/state_runtime_v2_trace_review_contract.test.js
          git commit -m "Require V2 pilot ownership evidence in device traces"
          git push origin HEAD:arch/state-runtime-v2-plan
