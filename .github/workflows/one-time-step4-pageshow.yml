name: One-time Step 4 pageshow optimization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-pageshow:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/skip-initial-pageshow-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply the exact pageshow change
        shell: python
        run: |
          from pathlib import Path
          import difflib

          path = Path("index.html")
          original = path.read_text(encoding="utf-8")

          old = """window.addEventListener('pageshow', () => {
            refreshMainPageFromStorage();
          });"""

          new = """let hasCompletedInitialPageShow = false;

          window.addEventListener('pageshow', (event) => {
            if (!hasCompletedInitialPageShow) {
              hasCompletedInitialPageShow = true;

              if (event.persisted) {
                refreshMainPageFromStorage();
              }

              return;
            }

            refreshMainPageFromStorage();
          });"""

          if original.count(old) != 1:
            raise SystemExit(f"Expected exactly one original pageshow handler; found {original.count(old)}")
          if "let hasCompletedInitialPageShow = false;" in original:
            raise SystemExit("Initial pageshow guard already exists")

          updated = original.replace(old, new, 1)
          if updated.count(new) != 1:
            raise SystemExit("Updated pageshow handler validation failed")

          diff = list(difflib.unified_diff(
              original.splitlines(),
              updated.splitlines(),
              fromfile="index.html",
              tofile="index.html",
              lineterm="",
          ))
          removed = [line for line in diff if line.startswith('-') and not line.startswith('---')]
          added = [line for line in diff if line.startswith('+') and not line.startswith('+++')]
          if len(removed) != 3 or len(added) != 15:
            raise SystemExit(f"Unexpected diff size: {len(removed)} removed, {len(added)} added")

          path.write_text(updated, encoding="utf-8")

      - name: Remove this one-time workflow
        run: rm .github/workflows/one-time-step4-pageshow.yml

      - name: Commit the verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-step4-pageshow.yml
          git diff --cached --check
          git commit -m "Skip initial pageshow storage refresh"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
