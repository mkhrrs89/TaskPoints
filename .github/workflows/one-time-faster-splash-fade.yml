name: One-time faster splash fade

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-index:
    if: github.head_ref == 'automation/faster-splash-fade' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Shorten splash fade
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_transition = "      transition: opacity 260ms ease;"
          new_transition = "      transition: opacity 140ms ease;"
          old_removal = "  setTimeout(() => splash.remove(), 320);"
          new_removal = "  setTimeout(() => splash.remove(), 160);"

          old_counts = (text.count(old_transition), text.count(old_removal))
          new_counts = (text.count(new_transition), text.count(new_removal))

          if old_counts == (1, 1) and new_counts == (0, 0):
              text = text.replace(old_transition, new_transition, 1)
              text = text.replace(old_removal, new_removal, 1)
              path.write_text(text, encoding="utf-8")
          elif old_counts == (0, 0) and new_counts == (1, 1):
              print("Splash fade patch is already present.")
          else:
              raise SystemExit(
                  "Unexpected splash timing state: "
                  f"old_transition={old_counts[0]}, old_removal={old_counts[1]}, "
                  f"new_transition={new_counts[0]}, new_removal={new_counts[1]}"
              )

      - name: Verify exact scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          assert text.count("      transition: opacity 140ms ease;") == 1
          assert "      transition: opacity 260ms ease;" not in text
          assert text.count("  setTimeout(() => splash.remove(), 160);") == 1
          assert "  setTimeout(() => splash.remove(), 320);" not in text
          assert text.count("}, 180);") >= 2
          assert "  await new Promise(r => setTimeout(r, 80));" in text
          PY

          if ! git diff --quiet -- index.html; then
            test "$(git diff --numstat -- index.html)" = $'2\t2\tindex.html'
            git diff --check
            git diff --unified=5 -- index.html
          fi

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten startup splash fade"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
