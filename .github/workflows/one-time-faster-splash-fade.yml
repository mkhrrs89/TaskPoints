name: One-time splash fade cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'automation/faster-splash-fade' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Verify patched app code
        shell: python
        run: |
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          assert text.count("      transition: opacity 140ms ease;") == 1
          assert "      transition: opacity 260ms ease;" not in text
          assert text.count("  setTimeout(() => splash.remove(), 160);") == 1
          assert "  setTimeout(() => splash.remove(), 320);" not in text
          assert text.count("}, 180);") >= 2
          assert "  await new Promise(r => setTimeout(r, 80));" in text

      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-faster-splash-fade.yml
          git commit -m "Remove one-time splash fade workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
