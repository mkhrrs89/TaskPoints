name: Temporary Storage Comment Cleanup

on:
  push:
    branches:
      - 'fix/atomic-storage-replacement-20260914'
    paths:
      - '.github/workflows/temporary-storage-comment-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-storage-replacement-20260914
          fetch-depth: 0
      - name: Replace stale remove-first comment
        run: python -c "from pathlib import Path; p=Path('settings.html'); s=p.read_text(); old='      // Important: remove-first write. iPhone may not have enough temp room to overwrite\\n      // a large string with a smaller value. Do not route this manual rescue through\\n      // the normal app save/merge path; only change the raw storage representation.\\n'; new='      // Replace in place so a failed iPhone storage write cannot delete the authoritative snapshot first.\\n      // Keep this manual optimization on the raw representation only; the data-loss guard remains active.\\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))"
      - name: Run focused storage safety contracts
        run: >-
          node --test
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
          tests/phase2_reset_hook.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase5b_deferred_mirror_contract.test.js
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'TaskPoints Storage Safety Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-storage-comment-cleanup.yml
          git add settings.html
          git commit -m 'Clarify atomic storage optimizer safety'
          git push origin HEAD:fix/atomic-storage-replacement-20260914
