name: Address Home day and save review

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Fix lifecycle day rollover and save baselines
        run: python scripts/address_home_day_save_review.py

      - name: Run focused checks
        run: |
          node --check toolbar.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/home_revision_refresh_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Home across game-day changes"
          git pull --rebase origin fix/home-revision-aware-refresh
          git push
