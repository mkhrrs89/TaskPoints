name: Perf Critical Tasks Live State Once

on:
  push:
    branches:
      - perf/main-trace-read-churn-20260915
    paths:
      - '.github/workflows/perf-critical-tasks-live-state-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/main-trace-read-churn-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply patch
        run: python scripts/apply_perf_critical_tasks_live_state.py
      - name: Run focused contracts
        run: node --test tests/critical_tasks_home_live_state_contract.test.js tests/step5f_critical_tasks_state_handoff.test.js tests/step5g_critical_resize_layout_only.test.js tests/home_targeted_render_control.test.js tests/home_targeted_render_contract.test.js tests/step3c_home_read_hotpath.test.js tests/storage_atomic_replace_contract.test.js tests/storage_data_loss_fail_closed.test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js home_targeted_render_control.js tests/home_targeted_render_control.test.js tests/critical_tasks_home_live_state_contract.test.js
          git commit -m "Reuse Home live state for Critical Tasks refreshes"
          git push origin HEAD:perf/main-trace-read-churn-20260915
