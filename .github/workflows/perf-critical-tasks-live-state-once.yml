name: Perf Critical Tasks Live State Once

on:
  push:
    branches:
      - perf/main-trace-read-churn-20260915
    paths:
      - '.github/workflows/perf-critical-tasks-live-state-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/main-trace-read-churn-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply live-state handoff patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          toolbar = Path('toolbar.js')
          text = toolbar.read_text()
          old = """    updateCriticalTasksIsland();
    let criticalRefreshQueued = false;
    const queueCriticalRefresh = () => {
"""
          new = """    const updateCriticalTasksIslandFromBestState = () => {
      let liveState = null;
      try { liveState = window.TaskPointsHomeLiveState?.getState?.() || null; } catch (_) {}
      if (liveState && typeof liveState === 'object') {
        return updateCriticalTasksIsland(liveState);
      }
      return updateCriticalTasksIsland();
    };

    updateCriticalTasksIslandFromBestState();
    let criticalRefreshQueued = false;
    const queueCriticalRefresh = () => {
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Critical Tasks initial refresh block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_queue = """      requestAnimationFrame(() => {
        criticalRefreshQueued = false;
        updateCriticalTasksIsland();
      });
"""
          new_queue = """      requestAnimationFrame(() => {
        criticalRefreshQueued = false;
        updateCriticalTasksIslandFromBestState();
      });
"""
          if text.count(old_queue) != 1:
              raise SystemExit(f'Expected one Critical Tasks queued refresh block, found {text.count(old_queue)}')
          text = text.replace(old_queue, new_queue, 1)
          toolbar.write_text(text)

          targeted = Path('home_targeted_render_control.js')
          text = targeted.read_text()
          old = """          global.renderTasks();
          global.updateCriticalTasksIsland?.();
"""
          new = """          const liveState = global.TaskPointsHomeLiveState?.getState?.();
          global.renderTasks(liveState && typeof liveState === 'object' ? liveState : null);
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one targeted task refresh block, found {text.count(old)}')
          targeted.write_text(text.replace(old, new, 1))

          testfile = Path('tests/home_targeted_render_control.test.js')
          text = testfile.read_text()
          text = text.replace("""    criticalIsland: 0
  };

  const context = {
""", """    criticalIsland: 0,
    lastRenderTasksState: null
  };
  const homeLiveState = { tasks: [{ id: 'task-1' }] };

  const context = {
""", 1)
          text = text.replace("""    renderTasks: () => { calls.renderTasks += 1; },
    updateCriticalTasksIsland: () => { calls.criticalIsland += 1; },
""", """    TaskPointsHomeLiveState: { getState: () => homeLiveState },
    renderTasks: (stateInput = null) => {
      calls.renderTasks += 1;
      calls.lastRenderTasksState = stateInput;
      if (stateInput) calls.criticalIsland += 1;
    },
    updateCriticalTasksIsland: () => { calls.criticalIsland += 1; },
""", 1)
          needle = """  assert.equal(calls.renderTasks, 1);
  assert.equal(calls.renderToday, 1);
  assert.equal(calls.renderAll, 0);
  assert.equal(calls.criticalIsland, 1);
"""
          repl = """  assert.equal(calls.renderTasks, 1);
  assert.equal(calls.renderToday, 1);
  assert.equal(calls.renderAll, 0);
  assert.equal(calls.criticalIsland, 1);
  assert.deepEqual(calls.lastRenderTasksState, { tasks: [{ id: 'task-1' }] });
"""
          if text.count(needle) != 1:
              raise SystemExit('Targeted render assertion block drifted')
          testfile.write_text(text.replace(needle, repl, 1))

          contract = Path('tests/critical_tasks_home_live_state_contract.test.js')
          contract.write_text("""const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');

const toolbar = fs.readFileSync('toolbar.js', 'utf8');
const targeted = fs.readFileSync('home_targeted_render_control.js', 'utf8');

function between(source, startNeedle, endNeedle) {
  const start = source.indexOf(startNeedle);
  assert.notEqual(start, -1, `missing ${startNeedle}`);
  const end = source.indexOf(endNeedle, start + startNeedle.length);
  assert.notEqual(end, -1, `missing ${endNeedle}`);
  return source.slice(start, end);
}

test('Critical Tasks queued Home refresh prefers live state and preserves stored fallback', () => {
  const body = between(toolbar, 'function ensureCriticalTasksIsland', 'function getCriticalDueList');
  assert.match(body, /TaskPointsHomeLiveState\?\.getState\?\.\(\)/);
  assert.match(body, /updateCriticalTasksIsland\(liveState\)/);
  assert.match(body, /return updateCriticalTasksIsland\(\)/);
  assert.match(body, /updateCriticalTasksIslandFromBestState\(\)/);
});

test('targeted task refresh passes live Home state through renderTasks without a second island call', () => {
  assert.match(targeted, /TaskPointsHomeLiveState\?\.getState\?\.\(\)/);
  assert.match(targeted, /global\.renderTasks\(liveState && typeof liveState === 'object' \? liveState : null\)/);
  const start = targeted.indexOf('function targetedScheduleRender');
  const end = targeted.indexOf('function targetedAnimateTaskCompletion', start);
  const body = targeted.slice(start, end);
  assert.doesNotMatch(body, /global\.updateCriticalTasksIsland/);
});
""")
          PY
      - name: Run focused contracts
        run: >-
          node --test
          tests/critical_tasks_home_live_state_contract.test.js
          tests/step5f_critical_tasks_state_handoff.test.js
          tests/step5g_critical_resize_layout_only.test.js
          tests/home_targeted_render_control.test.js
          tests/home_targeted_render_contract.test.js
          tests/step3c_home_read_hotpath.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js home_targeted_render_control.js tests/home_targeted_render_control.test.js tests/critical_tasks_home_live_state_contract.test.js
          git commit -m "Reuse Home live state for Critical Tasks refreshes"
          git push origin HEAD:perf/main-trace-read-churn-20260915
