name: State Runtime V2 Real Browser Safety

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-runtime-v2-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-storage-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned Playwright without changing the package lock
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Run real-browser synthetic V2 storage safety scenarios three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "V2 storage safety independent browser run $attempt of 3"
            node tests/browser/run-v2-browser.mjs
          done
      - name: Exercise actual Home UI with synthetic V2 state twice
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "V2 Home UI independent browser run $attempt of 2"
            node tests/browser/run-v2-ui-browser.mjs
          done
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-browser-evidence
          path: |
            v2-browser-artifacts
            v2-ui-browser-artifacts
          if-no-files-found: warn
          retention-days: 7

  webkit-storage-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned Playwright without changing the package lock
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install WebKit and Linux system dependencies
        run: npx playwright install --with-deps webkit
      - name: Run synthetic V2 storage safety in WebKit twice
        shell: bash
        env:
          V2_BROWSER_ENGINE: webkit
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "V2 WebKit storage safety run $attempt of 2"
            node tests/browser/run-v2-browser.mjs
          done
      - name: Exercise real Home UI in WebKit iPhone-sized touch emulation twice
        if: success() || failure()
        shell: bash
        env:
          V2_BROWSER_ENGINE: webkit
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "V2 WebKit real Home UI run $attempt of 2"
            node tests/browser/run-v2-ui-browser.mjs
          done
      - name: Upload WebKit browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-webkit-browser-evidence
          path: |
            v2-browser-artifacts/webkit
            v2-ui-browser-artifacts/webkit
          if-no-files-found: warn
          retention-days: 7
