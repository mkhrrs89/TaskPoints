name: State Runtime V2 Real Browser Safety

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-runtime-v2-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-storage-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked app dependencies
        run: npm ci
      - name: Install pinned Playwright without changing the package lock
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Run real-browser synthetic V2 storage safety scenarios
        run: node tests/browser/run-v2-browser.mjs
      - name: Exercise actual Home UI with synthetic V2 state
        if: success() || failure()
        run: node tests/browser/run-v2-ui-browser.mjs
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-browser-evidence
          path: |
            v2-browser-artifacts
            v2-ui-browser-artifacts
          if-no-files-found: warn
          retention-days: 7
