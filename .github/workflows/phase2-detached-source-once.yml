name: Phase2 Detached Source Once
on:
  push:
    branches:
      - fix/phase2-detached-source-reuse-20260915
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase2-detached-source-reuse-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 tmp_patch_phase2_detached_source.py
      - name: Run focused Phase 2 and storage safety tests
        run: |
          node --test tests/phase2_dual_write.test.js
          node --test tests/save_pipeline_shared_work_contract.test.js
          node --test tests/storage_atomic_replace_contract.test.js
          node --test tests/storage_data_loss_fail_closed.test.js
          node --test tests/phase2_reset_hook.test.js
          node --test tests/phase2_authoritative_absence.test.js
      - name: Verify scope
        run: |
          git diff --check
          git diff -- phase2_dual_write.js tests/phase2_dual_write.test.js
      - name: Commit tested patch
        run: |
          rm tmp_patch_phase2_detached_source.py .github/workflows/phase2-detached-source-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reuse detached Phase 2 shadow source'
          git push
