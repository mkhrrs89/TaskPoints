name: State Runtime V2 Contracts

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Step 4 V2 performance contract
        run: node --test tests/state_runtime_v2_perf_contract.test.js

      - name: Run Step 4 V2 idle maintenance contract
        run: timeout --signal=TERM --kill-after=5s 30s node --test tests/state_runtime_v2_maintenance_idle_contract.test.js

      - name: Run V2 core storage contracts
        run: >-
          node --test
          tests/state_runtime_v2_atomic_contract.test.js
          tests/state_runtime_v2_compatibility_snapshot_contract.test.js
          tests/state_runtime_v2_contract.test.js
          tests/state_runtime_v2_dark_contract.test.js
          tests/state_runtime_v2_export_contract.test.js
          tests/state_runtime_v2_failure_isolation_contract.test.js
          tests/state_runtime_v2_generation_contract.test.js
          tests/state_runtime_v2_revision_conflict_contract.test.js
          tests/state_runtime_v2_wal_contract.test.js
          tests/state_runtime_v2_wal_bridge_contract.test.js

      - name: Run V2 Habit mutation contracts
        run: >-
          node --test
          tests/state_runtime_v2_habit_edit_contract.test.js
          tests/state_runtime_v2_habit_order_contract.test.js
          tests/state_runtime_v2_habit_presence_contract.test.js
          tests/state_runtime_v2_habit_preview_scenarios_contract.test.js

      - name: Run V2 lifecycle interruption contract
        run: node --test tests/state_runtime_v2_lifecycle_interruption_contract.test.js

      - name: Run V2 preview cleanup contract
        run: node --test tests/state_runtime_v2_preview_cleanup.test.js

      - name: Run V2 preview opt-in contract
        run: node --test tests/state_runtime_v2_preview_optin.test.js

      - name: Run V2 reload verification contract
        run: node --test tests/state_runtime_v2_reload_verification_contract.test.js

      - name: Run V2 rollout gate contract
        run: node --test tests/state_runtime_v2_rollout_gate_contract.test.js

      - name: Run V2 perf trace visibility contract
        run: node --test tests/perf_trace_v2_visibility_contract.test.js

      - name: Prepare live current-main baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/taskpoints-main
          git worktree add --detach /tmp/taskpoints-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/taskpoints-main/node_modules
          echo "V2 head: $(git rev-parse HEAD)"
          echo "Current main baseline: $(git -C /tmp/taskpoints-main rev-parse HEAD)"

      - name: Compare individual test failures with live current main
        id: individual_diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p v2-rollout-diagnostics/main-logs v2-rollout-diagnostics/v2-logs
          : > v2-rollout-diagnostics/main-failures.txt
          : > v2-rollout-diagnostics/v2-failures.txt
          : > v2-rollout-diagnostics/new-v2-regressions.txt
          : > v2-rollout-diagnostics/main-baseline-sha.txt
          git -C /tmp/taskpoints-main rev-parse HEAD > v2-rollout-diagnostics/main-baseline-sha.txt

          run_file() {
            local root="$1"
            local file="$2"
            local log_dir="$3"
            local output="$4"
            local safe_name="${file//\//__}"
            local log_file="$log_dir/${safe_name}.log"
            set +e
            (cd "$root" && timeout --signal=TERM --kill-after=5s 30s node --test "$file") >"$log_file" 2>&1
            local status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              printf 'HUNG:%s\n' "$file" >> "$output"
            elif [ "$status" -ne 0 ]; then
              printf 'FAILED:%s\n' "$file" >> "$output"
            fi
          }

          mapfile -d '' main_files < <(cd /tmp/taskpoints-main && find tests -type f -name '*.test.js' -print0 | sort -z)
          echo "Collecting live main baseline from ${#main_files[@]} test files"
          for file in "${main_files[@]}"; do
            run_file /tmp/taskpoints-main "$file" v2-rollout-diagnostics/main-logs v2-rollout-diagnostics/main-failures.txt
          done

          mapfile -d '' v2_files < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          echo "Checking ${#v2_files[@]} V2-branch test files"
          for file in "${v2_files[@]}"; do
            case "$file" in
              tests/state_runtime_v2*.test.js|tests/perf_trace_v2_visibility_contract.test.js)
                continue
                ;;
            esac
            run_file "$GITHUB_WORKSPACE" "$file" v2-rollout-diagnostics/v2-logs v2-rollout-diagnostics/v2-failures.txt
          done

          new_count=0
          while IFS= read -r signature; do
            [ -z "$signature" ] && continue
            if ! grep -Fxq "$signature" v2-rollout-diagnostics/main-failures.txt; then
              echo "NEW_V2_REGRESSION=$signature"
              printf '%s\n' "$signature" >> v2-rollout-diagnostics/new-v2-regressions.txt
              new_count=$((new_count + 1))
            fi
          done < v2-rollout-diagnostics/v2-failures.txt

          main_count=$(grep -c . v2-rollout-diagnostics/main-failures.txt || true)
          v2_count=$(grep -c . v2-rollout-diagnostics/v2-failures.txt || true)
          echo "main_baseline_failure_count=$main_count" >> "$GITHUB_OUTPUT"
          echo "v2_branch_failure_count=$v2_count" >> "$GITHUB_OUTPUT"
          echo "new_v2_regression_count=$new_count" >> "$GITHUB_OUTPUT"
          echo "Live current-main failures: $main_count"
          echo "V2 branch non-V2 failures: $v2_count"
          echo "New V2 regressions: $new_count"
          if [ "$new_count" -ne 0 ]; then
            echo "=== NEW V2 REGRESSIONS ==="
            cat v2-rollout-diagnostics/new-v2-regressions.txt
          fi

      - name: Upload V2 rollout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-runtime-v2-rollout-diagnostics
          path: v2-rollout-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Run full TaskPoints test suite as supplemental diagnostic
        id: full_suite
        continue-on-error: true
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 180s npm test

      - name: Report full-suite baseline status
        if: always()
        run: |
          echo "Full-suite outcome: ${{ steps.full_suite.outcome }}"
          echo "Live current-main baseline failures: ${{ steps.individual_diagnostics.outputs.main_baseline_failure_count }}"
          echo "V2 branch non-V2 failures: ${{ steps.individual_diagnostics.outputs.v2_branch_failure_count }}"
          echo "The rollout gate is decided by focused V2 contracts plus a live per-file comparison against current main."

      - name: Fail rollout gate on new V2 regressions
        if: steps.individual_diagnostics.outputs.new_v2_regression_count != '0'
        run: |
          echo "Found ${{ steps.individual_diagnostics.outputs.new_v2_regression_count }} V2 regression(s) beyond live current main."
          exit 1
