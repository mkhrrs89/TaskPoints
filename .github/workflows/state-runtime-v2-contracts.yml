name: State Runtime V2 Contracts

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run State Runtime V2 contract tests
        run: node --test tests/state_runtime_v2*.test.js tests/perf_trace_v2_visibility_contract.test.js

      - name: Diagnose individual TaskPoints test files against main baseline
        id: individual_diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p v2-rollout-diagnostics/logs
          : > v2-rollout-diagnostics/failures.txt
          : > v2-rollout-diagnostics/known-main-baseline-failures.txt
          : > v2-rollout-diagnostics/new-v2-regressions.txt
          mapfile -d '' files < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          echo "Found ${#files[@]} test files"
          known_count=0
          new_count=0

          for file in "${files[@]}"; do
            echo "=== TEST FILE: $file ==="
            safe_name="${file//\//__}"
            log_file="v2-rollout-diagnostics/logs/${safe_name}.log"
            set +e
            timeout --signal=TERM --kill-after=5s 30s node --test "$file" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            signature=""
            detail=""
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              signature="HUNG:$file"
              detail="$signature"
            elif [ "$status" -ne 0 ]; then
              signature="FAILED:$file"
              detail="$signature:$status"
            fi

            if [ -z "$signature" ]; then
              continue
            fi

            printf '%s\n' "$detail" >> v2-rollout-diagnostics/failures.txt
            if grep -Fxq "$signature" tests/state_runtime_v2_baseline_failures.txt; then
              echo "KNOWN_MAIN_BASELINE=$detail"
              printf '%s\n' "$detail" >> v2-rollout-diagnostics/known-main-baseline-failures.txt
              known_count=$((known_count + 1))
            else
              echo "NEW_V2_REGRESSION=$detail"
              printf '%s\n' "$detail" >> v2-rollout-diagnostics/new-v2-regressions.txt
              new_count=$((new_count + 1))
            fi
          done

          echo "known_main_baseline_count=$known_count" >> "$GITHUB_OUTPUT"
          echo "new_v2_regression_count=$new_count" >> "$GITHUB_OUTPUT"
          echo "Known current-main failures: $known_count"
          echo "New V2 regressions: $new_count"
          if [ "$new_count" -ne 0 ]; then
            echo "=== NEW V2 REGRESSIONS ==="
            cat v2-rollout-diagnostics/new-v2-regressions.txt
          fi

      - name: Upload V2 rollout diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-runtime-v2-rollout-diagnostics
          path: v2-rollout-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Run full TaskPoints test suite as supplemental diagnostic
        id: full_suite
        continue-on-error: true
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 180s npm test

      - name: Report full-suite baseline status
        if: always()
        run: |
          echo "Full-suite outcome: ${{ steps.full_suite.outcome }}"
          echo "The rollout gate is decided by V2 contracts plus per-file regression comparison against the recorded current-main baseline."

      - name: Fail rollout gate on new V2 regressions
        if: steps.individual_diagnostics.outputs.new_v2_regression_count != '0'
        run: |
          echo "Found ${{ steps.individual_diagnostics.outputs.new_v2_regression_count }} V2 regression(s) beyond the recorded current-main baseline."
          exit 1
