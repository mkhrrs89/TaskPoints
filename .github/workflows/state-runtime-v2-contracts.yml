name: State Runtime V2 Contracts

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run State Runtime V2 contract tests
        run: node --test tests/state_runtime_v2*.test.js tests/perf_trace_v2_visibility_contract.test.js

      - name: Diagnose individual TaskPoints test files
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' files < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          echo "Found ${#files[@]} test files"
          failures=()
          for file in "${files[@]}"; do
            echo "=== TEST FILE: $file ==="
            set +e
            timeout --signal=TERM --kill-after=5s 30s node --test "$file"
            status=$?
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "HUNG_TEST_FILE=$file"
              failures+=("HUNG:$file")
            elif [ "$status" -ne 0 ]; then
              echo "FAILED_TEST_FILE=$file STATUS=$status"
              failures+=("FAILED:$file:$status")
            fi
          done
          if [ "${#failures[@]}" -ne 0 ]; then
            echo "=== INDIVIDUAL TEST DIAGNOSTIC FAILURES ==="
            printf '%s\n' "${failures[@]}"
            exit 1
          fi

      - name: Run full TaskPoints test suite
        run: npm test
