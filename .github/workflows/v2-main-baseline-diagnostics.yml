name: V2 Main Baseline Diagnostics

on:
  push:
    branches:
      - tmp/v2-main-baseline-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Diagnose individual TaskPoints test files
        id: individual_diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p v2-main-baseline/logs
          : > v2-main-baseline/failures.txt
          mapfile -d '' files < <(find tests -type f -name '*.test.js' -print0 | sort -z)
          echo "Found ${#files[@]} test files"
          failures=()
          for file in "${files[@]}"; do
            echo "=== TEST FILE: $file ==="
            safe_name="${file//\//__}"
            log_file="v2-main-baseline/logs/${safe_name}.log"
            set +e
            timeout --signal=TERM --kill-after=5s 30s node --test "$file" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              failures+=("HUNG:$file")
              printf 'HUNG:%s\n' "$file" >> v2-main-baseline/failures.txt
            elif [ "$status" -ne 0 ]; then
              failures+=("FAILED:$file:$status")
              printf 'FAILED:%s:%s\n' "$file" "$status" >> v2-main-baseline/failures.txt
            fi
          done
          if [ "${#failures[@]}" -ne 0 ]; then
            printf '%s\n' "${failures[@]}"
            exit 1
          fi

      - name: Upload main baseline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-main-baseline-diagnostics
          path: v2-main-baseline
          if-no-files-found: warn
          retention-days: 7

      - name: Fail baseline diagnostic job if tests failed
        if: steps.individual_diagnostics.outcome == 'failure'
        run: exit 1
