name: Step 5E apply

on:
  push:
    branches:
      - agent/step5e-task-action-fast-paths

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5e-task-action-fast-paths
          fetch-depth: 0

      - name: Apply Step 5E patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "function editTask(id){ editingTaskId = id; renderTasks(); }",
              """function editTask(id){
            const startedAt = performance.now();
            editingTaskId = id;
            renderTasks();
            try {
              window.TaskPointsPerf?.mark?.('taskAction.editOpenComplete', {
                taskId: id,
                durationMs: Math.round((performance.now() - startedAt) * 100) / 100
              });
            } catch (_) {}
          }""",
              'editTask instrumentation'
          )

          helper_anchor = "function bumpTaskOneDay(id){"
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'fast-path helper anchor: expected 1 match, found {text.count(helper_anchor)}')
          helper = """function persistTaskActionMutation(task, action){
            if (!task) return;
            if (TaskPointsCore?.journalTaskMutation) {
              TaskPointsCore.journalTaskMutation({ task });
              try { window.TaskPointsPerf?.mark?.('taskAction.journaled', { action, taskId: task.id }); } catch (_) {}
            } else {
              save();
            }
          }

          """
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          replace_once(
              """  t.updatedAtISO = new Date().toISOString();
            editingTaskId=null;
            save(); renderTasks();
            window.updateCriticalTasksIsland?.();
          }""",
              """  t.updatedAtISO = new Date().toISOString();
            editingTaskId=null;
            persistTaskActionMutation(t, 'edit-save');
            renderTasks();
            window.updateCriticalTasksIsland?.();
          }""",
              'edit save fast path'
          )

          replace_once(
              """  bumpOneDay(t);
            save();
            renderTasks();
            window.updateCriticalTasksIsland?.();
          }""",
              """  bumpOneDay(t);
            persistTaskActionMutation(t, 'bump-one-day');
            renderTasks();
            window.updateCriticalTasksIsland?.();
          }""",
              '+1 day fast path'
          )

          replace_once(
              """  }
            save(); renderTasks();
            window.updateCriticalTasksIsland?.();
          }

          function prefersReducedTaskMotion""",
              """  }
            persistTaskActionMutation(t, 'wont-do');
            renderTasks();
            window.updateCriticalTasksIsland?.();
          }

          function prefersReducedTaskMotion""",
              "Won't Do fast path"
          )

          path.write_text(text)

          checks = {
              'edit marker': "taskAction.editOpenComplete",
              'helper': "function persistTaskActionMutation(task, action)",
              'edit save': "persistTaskActionMutation(t, 'edit-save')",
              'bump': "persistTaskActionMutation(t, 'bump-one-day')",
              'wont do': "persistTaskActionMutation(t, 'wont-do')",
          }
          for label, needle in checks.items():
              if text.count(needle) != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence of {needle!r}')
          PY

      - name: Validate Step 5E
        shell: bash
        run: |
          node --check task_mutation_journal.js
          git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/step5e-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/step5e-apply.yml
          git commit -m "Defer task action snapshot compression"
          git push origin HEAD:agent/step5e-task-action-fast-paths
