name: Fix Season late-bound catch-up dates

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded Season date-window patch
        run: python scripts/fix_season_late_bound_dates.py

      - name: Run focused and related checks
        run: |
          node --check scoring_core.js
          node --test tests/season_late_bound_date_windows.test.js
          node --test tests/season_result_integrity_guard.test.js
          node --test tests/season_result_sync_regression.test.js
          node --test tests/season2_playin_recovery.test.js
          node --test tests/cal_log_bonus.test.js
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scoring_core.js tests/season_late_bound_date_windows.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Use active Season dates for late-bound catch-up"
          git push
