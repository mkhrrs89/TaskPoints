name: One-time immediate Matrix boot patch

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/immediate-matrix-boot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out guarded feature branch
        uses: actions/checkout@v4
        with:
          ref: automation/immediate-matrix-boot
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Start Matrix animation before app initialization
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          splash_marker = '''<div id="bootSplash" class="bootSplash" aria-hidden="true">
            <div id="matrixTitle" class="matrixTitle" role="img" aria-label="TASKPOINTS"></div>
          </div>
          '''

          early_boot = '''
          <script id="tp-early-matrix-bootstrap">
          (function startEarlyMatrixBoot(){
            const splash = document.getElementById("bootSplash");
            const titleEl = document.getElementById("matrixTitle");
            const shouldPlayBoot = document.documentElement.classList.contains("tp-boot-pending");
            const word = "TASKPOINTS";
            const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+?@";
            let finished = false;
            let skipRequested = false;
            let finishTimer = null;
            let skipCleanup = null;
            let resolveFinished;

            window.__tpMatrixFinished = false;
            window.__tpMatrixFinishedPromise = new Promise(resolve => {
              resolveFinished = resolve;
            });
            window.__tpBootAnimStarted = true;

            const finish = () => {
              if (finished) return;
              finished = true;
              if (finishTimer !== null) clearTimeout(finishTimer);
              if (typeof skipCleanup === "function") skipCleanup();
              window.__tpMatrixFinished = true;
              try { performance.mark("tp-matrix-finished"); } catch (e) {}
              resolveFinished?.();
              window.dispatchEvent(new Event("tp:matrixFinished"));
            };

            if (!splash || !titleEl){
              finish();
              return;
            }

            if (!shouldPlayBoot){
              finish();
              splash.remove();
              return;
            }

            document.body.classList.add("booting");
            try { performance.mark("tp-matrix-started"); } catch (e) {}

            const requestSkip = () => {
              if (skipRequested || finished) return;
              skipRequested = true;
              finish();
            };
            splash.addEventListener("pointerdown", requestSkip, { passive: true });
            splash.addEventListener("click", requestSkip, { passive: true });
            skipCleanup = () => {
              splash.removeEventListener("pointerdown", requestSkip);
              splash.removeEventListener("click", requestSkip);
            };

            if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
              titleEl.textContent = word;
              finishTimer = setTimeout(finish, 180);
              return;
            }

            const randomGlyph = () => glyphs[(Math.random() * glyphs.length) | 0];
            const spans = [];
            titleEl.innerHTML = "";
            for (const finalChar of word){
              const span = document.createElement("span");
              span.className = "matrixChar";
              span.dataset.final = finalChar;
              span.textContent = randomGlyph();
              titleEl.appendChild(span);
              spans.push(span);
            }

            const decodeOne = (span, finalChar) => new Promise(resolve => {
              const start = performance.now();
              const interval = setInterval(() => {
                if (skipRequested){
                  clearInterval(interval);
                  resolve();
                  return;
                }
                span.textContent = randomGlyph();
                if (performance.now() - start >= 210){
                  clearInterval(interval);
                  span.textContent = finalChar;
                  span.classList.add("locked");
                  resolve();
                }
              }, 20);
            });

            (async () => {
              for (const span of spans){
                if (skipRequested) return;
                await decodeOne(span, span.dataset.final);
              }
              if (skipRequested) return;
              await new Promise(resolve => setTimeout(resolve, 80));
              if (skipRequested) return;
              finishTimer = setTimeout(finish, 180);
            })();
          })();
          </script>
          '''

          old_boot_wrapper = '''(function(){

            function finishBoot(){
          '''
          new_boot_wrapper = '''(function(){
            let bootFinished = false;

            function finishBoot(){
              if (bootFinished) return;
              bootFinished = true;
          '''

          old_wait = '''  // Wait for matrix animation to finish
            window.addEventListener("tp:matrixFinished", finishBoot);

            // failsafe in case event never fires
            setTimeout(finishBoot, 4000);
          '''
          new_wait = '''  // The early bootstrap may finish before this late app-ready gate exists.
            if (window.__tpMatrixFinished){
              finishBoot();
            } else {
              window.addEventListener("tp:matrixFinished", finishBoot, { once: true });
              const matrixFinishedPromise = window.__tpMatrixFinishedPromise;
              if (matrixFinishedPromise && typeof matrixFinishedPromise.then === "function"){
                matrixFinishedPromise.then(finishBoot);
              }
            }

            // failsafe in case the bootstrap cannot complete
            setTimeout(finishBoot, 4000);
          '''

          already_patched = 'id="tp-early-matrix-bootstrap"' in text
          if not already_patched:
            assert text.count(splash_marker) == 1, 'Expected exactly one splash marker'
            assert text.count(old_boot_wrapper) == 1, 'Expected exactly one boot wrapper'
            assert text.count(old_wait) == 1, 'Expected exactly one old Matrix wait block'
            text = text.replace(splash_marker, splash_marker + early_boot, 1)
            text = text.replace(old_boot_wrapper, new_boot_wrapper, 1)
            text = text.replace(old_wait, new_wait, 1)
            path.write_text(text, encoding='utf-8')

          trigger = Path('.github/automation-triggers/immediate-matrix-boot.txt')
          if trigger.exists():
            trigger.unlink()

          verified = path.read_text(encoding='utf-8')
          assert verified.count('id="tp-early-matrix-bootstrap"') == 1
          assert verified.count('window.__tpMatrixFinishedPromise = new Promise') == 1
          assert verified.count('performance.mark("tp-matrix-started")') == 1
          assert verified.count('let bootFinished = false;') == 1
          assert verified.count('window.addEventListener("tp:matrixFinished", finishBoot, { once: true });') == 1
          assert verified.count('setTimeout(finishBoot, 4000);') == 1
          assert verified.count('runMatrixBootAnim();') == 1
          assert '<script src="scoring_core.js"></script>' in verified

      - name: Verify and commit the guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Guarded patch is already applied."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|.github/automation-triggers/immediate-matrix-boot.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          if ! printf '%s\n' "${changed[@]}" | grep -qx 'index.html'; then
            echo "index.html was not changed as expected."
            exit 1
          fi
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html .github/automation-triggers/immediate-matrix-boot.txt
          git commit -m "Start Matrix animation immediately"
          git push origin HEAD:automation/immediate-matrix-boot
