name: Apply Step 3D Phase 5C patch

on:
  push:
    branches:
      - agent/step3d-navigation-maintenance

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Temporarily apply Step 3D Phase 5C patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step3d-navigation-maintenance
      - name: Patch Phase 5C scheduling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('phase5b_deferred_mirror.js')
          text = path.read_text()

          old_vars = """  let pending = null;\n  let running = false;\n  let tail = Promise.resolve(false);\n"""
          new_vars = """  let pending = null;\n  let running = false;\n  let scheduled = false;\n  let activeRaw = null;\n  let tail = Promise.resolve(false);\n"""

          old_queue = """  async function run() {\n    try {\n      while (pending !== null) {\n        const raw = pending;\n        pending = null;\n        await mirror(raw);\n      }\n      return true;\n    } finally { running = false; }\n  }\n  function flush() {\n    if (running) return tail.then(() => pending !== null ? flush() : true);\n    if (pending === null) return tail;\n    running = true;\n    tail = Promise.resolve().then(run).catch(() => false);\n    return tail;\n  }\n  function queue(raw) {\n    const value = String(raw || '');\n    if (!value || get(KEY) !== value) return false;\n    pending = value;\n    status({ phase5cLastStatus: 'queued', phase5cQueuedAtISO: new Date().toISOString(), phase5cPendingWrite: true, phase5cLastError: null });\n    if (typeof global.queueMicrotask === 'function') global.queueMicrotask(flush);\n    else Promise.resolve().then(flush);\n    return true;\n  }\n"""
          new_queue = """  async function run() {\n    try {\n      if (pending === null) return true;\n      const raw = pending;\n      pending = null;\n      activeRaw = raw;\n      await mirror(raw);\n      return true;\n    } finally {\n      activeRaw = null;\n      running = false;\n      if (pending !== null) scheduleFlush();\n    }\n  }\n  function flush() {\n    scheduled = false;\n    if (running) return tail.then(() => pending !== null ? flush() : true);\n    if (pending === null) return tail;\n    running = true;\n    tail = Promise.resolve().then(run).catch(() => false);\n    return tail;\n  }\n  function scheduleFlush() {\n    if (scheduled || running || pending === null) return false;\n    scheduled = true;\n    const execute = () => {\n      scheduled = false;\n      return pending === null ? true : flush();\n    };\n    const launch = () => {\n      if (pending === null) { scheduled = false; return; }\n      if (typeof core.whenStorageMaintenanceQuiet === 'function') {\n        Promise.resolve(core.whenStorageMaintenanceQuiet(execute, { source: 'phase5c_verified_secondary' }))\n          .catch(() => { scheduled = false; });\n        return;\n      }\n      if (typeof global.requestIdleCallback === 'function') {\n        global.requestIdleCallback(execute, { timeout: 12000 });\n      } else {\n        global.setTimeout?.(execute, 2500);\n      }\n    };\n    if (typeof global.setTimeout === 'function') global.setTimeout(launch, 0);\n    else Promise.resolve().then(launch);\n    return true;\n  }\n  function queue(raw) {\n    const value = String(raw || '');\n    if (!value || get(KEY) !== value) return false;\n    if (pending === value || activeRaw === value) return true;\n    const existing = json(get(DIAG), {}) || {};\n    const alreadyVerified = existing.phase5cLastStatus === 'passed_verification'\n      && existing.phase5cMirrorsCurrentSave === true\n      && existing.phase5cLastVerifiedRawHash === hash(value)\n      && journalCount() === 0;\n    if (alreadyVerified) return false;\n    pending = value;\n    status({\n      phase5cLastStatus: 'queued_waiting_for_idle',\n      phase5cQueuedAtISO: new Date().toISOString(),\n      phase5cMirrorsCurrentSave: false,\n      phase5cPendingWrite: true,\n      phase5cLastError: null\n    });\n    scheduleFlush();\n    return true;\n  }\n"""

          for old, new, label in [
              (old_vars, new_vars, 'state variables'),
              (old_queue, new_queue, 'queue scheduler'),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected Phase 5C {label} block not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit Phase 5C patch
        run: |
          git config user.name "mkhrrs89"
          git config user.email "47932065+mkhrrs89@users.noreply.github.com"
          git add phase5b_deferred_mirror.js
          git commit -m "Defer verified secondary writes until idle"
          git push origin HEAD:agent/step3d-navigation-maintenance
