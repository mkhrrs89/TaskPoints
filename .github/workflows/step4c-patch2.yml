name: step4c-patch2
on:
  push:
    branches: [agent/step4c-skip-duplicate-gamehub-boot]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step4c-skip-duplicate-gamehub-boot
      - name: Skip duplicate Game Hub boot render
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gamehub.html')
          s = p.read_text()
          old = '''    currentState = state;\n    renderGameHubFromState(state, { allowPersist: false });\n    scheduleGameHubBoot();\n  }\n\n  $('refreshGameHub')?.addEventListener('click', () => scheduleRender(renderAll));'''
          new = '''    currentState = state;\n    renderGameHubFromState(state, { allowPersist: false });\n    // The initial path already completed the same read-only synchronization that\n    // runGameHubBoot() would repeat. Mark boot complete so the dashboard is not\n    // synchronously rebuilt a second time during startup.\n    gameHubBootStarted = true;\n    gameHubBootFinished = true;\n  }\n\n  $('refreshGameHub')?.addEventListener('click', () => scheduleRender(renderAll));'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one initial-render target, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'gameHubBootStarted = true;' gamehub.html
          grep -q 'gameHubBootFinished = true;' gamehub.html
          git diff --check
      - name: Run focused structural checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('gamehub.html').read_text()
          initial = s[s.index('function renderInitialGameHub()'):s.index("$('refreshGameHub')?.addEventListener")]
          assert 'syncStateForDisplayOnly(loadState()' in initial
          assert 'renderGameHubFromState(state, { allowPersist: false });' in initial
          assert 'scheduleGameHubBoot();' not in initial
          assert 'gameHubBootStarted = true;' in initial
          assert 'gameHubBootFinished = true;' in initial
          # Keep the existing refresh path and deferred function available; only the
          # redundant startup scheduling call is bypassed.
          assert "$('refreshGameHub')?.addEventListener('click', () => scheduleRender(renderAll));" in s
          assert 'function runGameHubBoot()' in s
          assert 'function scheduleGameHubBoot()' in s
          PY
      - name: Commit final Step 4C patch
        shell: bash
        run: |
          rm -f .github/workflows/step4c-patch2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamehub.html .github/workflows/step4c-patch2.yml
          git commit -m 'Skip duplicate Game Hub startup render'
          git push origin HEAD:agent/step4c-skip-duplicate-gamehub-boot
