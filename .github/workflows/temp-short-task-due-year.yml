name: Temporary Short Task Due Year

on:
  push:
    branches:
      - agent/short-task-due-year

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/short-task-due-year
          fetch-depth: 0

      - name: Shorten task-card due year
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'index.html';
          let source = fs.readFileSync(file, 'utf8');
          const oldLine = '    parts.push(niceDate(dueDate));';
          const newLine = '    parts.push(niceDate(dueDate).replace(/\\b(\\d{4})\\b/, (_, year) => `’${year.slice(-2)}`));';
          const matches = source.split(oldLine).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one task due-date formatter call, found ${matches}`);
          source = source.replace(oldLine, newLine);
          fs.writeFileSync(file, source);
          NODE

      - name: Verify compact year formatting
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('index.html', 'utf8');
          const expected = 'parts.push(niceDate(dueDate).replace(/\\b(\\d{4})\\b/, (_, year) => `’${year.slice(-2)}`));';
          if (!source.includes(expected)) throw new Error('Compact task due-date formatter is missing');
          const sample = 'Sep 1, 2026'.replace(/\b(\d{4})\b/, (_, year) => `’${year.slice(-2)}`);
          if (sample !== 'Sep 1, ’26') throw new Error(`Unexpected compact sample: ${sample}`);
          NODE

      - name: Run task regression tests
        run: node --test tests/task_action_fast_paths.test.js tests/step5h_task_card_expand_state_handoff.test.js

      - name: Commit verified tweak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten task due-date years"
          git push origin HEAD:agent/short-task-due-year
