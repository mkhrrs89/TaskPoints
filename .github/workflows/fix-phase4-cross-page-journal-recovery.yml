name: Fix Phase 4 cross-page journal recovery

on:
  pull_request:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-dark-storage
          fetch-depth: 0

      - name: Apply recovery fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('phase4_storage_coordinator.js')
          text = path.read_text(encoding='utf-8')

          old = """  let sequence = 0;
  let verifiedPrimaryCache = null;
"""
          new = """  let sequence = 0;
  let verifiedPrimaryCache = null;
  let journalRecoveryTimer = null;
  let journalRecoveryChecks = 0;
  let journalCompactionRequested = false;
  let deferredMirrorPending = false;
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function clearCaches() {
    verifiedPrimaryCache = null;
    try { core.clearPhase3ReadCache?.(); } catch (_) {}
    try { global.sessionStorage?.removeItem?.('taskpoints_phase4_verified_primary_cache_v1'); } catch (_) {}
    return true;
  }
"""
          new = """  function clearCaches() {
    verifiedPrimaryCache = null;
    try { core.clearPhase3ReadCache?.(); } catch (_) {}
    try { global.sessionStorage?.removeItem?.('taskpoints_phase4_verified_primary_cache_v1'); } catch (_) {}
    return true;
  }
  function stopJournalRecovery() {
    if (journalRecoveryTimer != null) clearTimeout(journalRecoveryTimer);
    journalRecoveryTimer = null;
    journalRecoveryChecks = 0;
    journalCompactionRequested = false;
    deferredMirrorPending = false;
  }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    if (next === 'off') clearCaches();
    writeDiagnostics({ configuredMode: next, effectiveSource: 'localStorage', lastFallbackReason: null });
    return next;
"""
          new = """    if (next === 'off') {
      clearCaches();
      stopJournalRecovery();
    }
    writeDiagnostics({ configuredMode: next, effectiveSource: 'localStorage', lastFallbackReason: null });
    if (next !== 'off') resumeDeferredWriteIfNeeded();
    return next;
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function queueAfterJournalCleared() {
    if (getMode() === 'off') return;
    if (journalCount() > 0) return;
    if (safeGet(core.STORAGE_KEY) === null) return;
    queueWrite({ reason: 'habit_journal_cleared' });
  }
"""
          new = """  function requestJournalCompaction() {
    if (journalCompactionRequested || journalCount() <= 0) return;
    if (typeof core.schedulePendingHabitDeltaCompaction !== 'function') return;
    const raw = safeGet(core.STORAGE_KEY);
    if (raw === null) return;
    try {
      const state = core.parseTaskPointsStorageJson(raw, {}) || {};
      journalCompactionRequested = true;
      core.schedulePendingHabitDeltaCompaction(state, {
        storageKey: core.STORAGE_KEY,
        delayMs: 0
      });
    } catch (_) {
      journalCompactionRequested = false;
    }
  }

  function scheduleJournalRecovery() {
    if (getMode() === 'off') return;
    deferredMirrorPending = true;
    requestJournalCompaction();
    if (journalRecoveryTimer != null) return;

    const check = () => {
      journalRecoveryTimer = null;
      if (getMode() === 'off') { stopJournalRecovery(); return; }
      if (journalCount() > 0) {
        journalRecoveryChecks += 1;
        requestJournalCompaction();
        if (journalRecoveryChecks < 40) journalRecoveryTimer = setTimeout(check, 250);
        return;
      }
      journalRecoveryChecks = 0;
      journalCompactionRequested = false;
      if (!deferredMirrorPending || safeGet(core.STORAGE_KEY) === null) return;
      deferredMirrorPending = false;
      queueWrite({ reason: 'habit_journal_cleared', journalAlreadyChecked: true });
    };

    journalRecoveryTimer = setTimeout(check, 100);
  }

  function recordJournalDeferred() {
    clearCaches();
    const previous = readDiagnostics();
    const firstForRecovery = !deferredMirrorPending;
    deferredMirrorPending = true;
    const result = writeDiagnostics({
      effectiveSource: 'localStorage',
      lastFallbackAt: nowIso(),
      lastFallbackReason: 'pending_habit_journal',
      deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + (firstForRecovery ? 1 : 0),
      resetTombstone: false
    });
    scheduleJournalRecovery();
    return result;
  }

  function queueAfterJournalCleared() {
    if (getMode() === 'off') return;
    scheduleJournalRecovery();
  }

  function resumeDeferredWriteIfNeeded() {
    if (getMode() === 'off' || safeGet(core.STORAGE_KEY) === null) return;
    const diagnostics = readDiagnostics();
    if (journalCount() > 0) {
      deferredMirrorPending = true;
      scheduleJournalRecovery();
      return;
    }
    if (diagnostics.lastFallbackReason === 'pending_habit_journal'
      || (Number(diagnostics.latestQueuedSequence) || 0) > (Number(diagnostics.latestPassedSequence) || 0)) {
      deferredMirrorPending = true;
      scheduleJournalRecovery();
    }
  }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    const pendingJournalCount = journalCount();
    if (pendingJournalCount > 0) {
      clearCaches();
      const previous = readDiagnostics();
      return writeDiagnostics({
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: 'pending_habit_journal',
        deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + 1,
        resetTombstone: false
      });
    }
"""
          new = """    const pendingJournalCount = journalCount();
    if (pendingJournalCount > 0) return recordJournalDeferred();
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      return writeDiagnostics({
        configuredMode: getMode(),
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: reason,
        verificationFailuresTotal: (Number(previous.verificationFailuresTotal) || 0) + (deferred ? 0 : 1),
        deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + (deferred ? 1 : 0),
        resetTombstone: false
      });
"""
          new = """      const result = writeDiagnostics({
        configuredMode: getMode(),
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: reason,
        verificationFailuresTotal: (Number(previous.verificationFailuresTotal) || 0) + (deferred ? 0 : 1),
        deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + (deferred ? 1 : 0),
        resetTombstone: false
      });
      if (reason === 'pending_habit_journal') scheduleJournalRecovery();
      return result;
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function queueWrite(options = {}) {
    if (getMode() === 'off' && options.force !== true) return Promise.resolve({ status: 'off' });
    const writeSequence = nextSequence();
"""
          new = """  function queueWrite(options = {}) {
    if (getMode() === 'off' && options.force !== true) return Promise.resolve({ status: 'off' });
    if (options.journalAlreadyChecked !== true && journalCount() > 0) {
      return Promise.resolve(recordJournalDeferred());
    }
    const writeSequence = nextSequence();
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  installStorageHooks();
  writeDiagnostics({ configuredMode: getMode(), effectiveSource: 'localStorage', pendingWrites: 0 });
})(typeof window !== 'undefined' ? window : globalThis);
"""
          new = """  installStorageHooks();
  writeDiagnostics({ configuredMode: getMode(), effectiveSource: 'localStorage', pendingWrites: 0 });
  resumeDeferredWriteIfNeeded();
})(typeof window !== 'undefined' ? window : globalThis);
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          tests = Path('tests/phase4_storage_contract.test.js')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
            "async function install({ mode, journal = [], diagnostics = null, indexedDB = createFakeIndexedDb() } = {}) {",
            "async function install({ mode, journal = [], diagnostics = null, storedState = null, autoCompactJournal = false, indexedDB = createFakeIndexedDb() } = {}) {",
            1
          )
          text = text.replace(
            "    ...(diagnostics ? { [DIAGNOSTICS_KEY]: JSON.stringify(diagnostics) } : {})\n  });",
            "    ...(diagnostics ? { [DIAGNOSTICS_KEY]: JSON.stringify(diagnostics) } : {}),\n    ...(storedState ? { [STORAGE_KEY]: JSON.stringify(storedState) } : {})\n  });",
            1
          )
          text = text.replace(
            "  let phase3ClearCalls = 0;\n  const core = {",
            "  let phase3ClearCalls = 0;\n  let journalCompactionCalls = 0;\n  const core = {",
            1
          )
          text = text.replace(
            "    clearPhase3ReadCache() { phase3ClearCalls += 1; return true; }\n  };",
            "    clearPhase3ReadCache() { phase3ClearCalls += 1; return true; },\n    schedulePendingHabitDeltaCompaction() {\n      journalCompactionCalls += 1;\n      if (autoCompactJournal) setTimeout(() => localStorage.setItem(JOURNAL_KEY, '[]'), 0);\n    }\n  };",
            1
          )
          text = text.replace(
            "  return { core, localStorage, indexedDB, db: indexedDB._db(SHADOW_DB), phase3ClearCalls: () => phase3ClearCalls };",
            "  return { core, localStorage, indexedDB, db: indexedDB._db(SHADOW_DB), phase3ClearCalls: () => phase3ClearCalls, journalCompactionCalls: () => journalCompactionCalls };",
            1
          )
          text = text.replace(
            "  assert.notEqual(status.latestQueuedSequence, status.latestPassedSequence);\n  assert.equal(status.lastFallbackReason, 'pending_habit_journal');",
            "  assert.equal(status.latestQueuedSequence, status.latestPassedSequence);\n  assert.equal(status.lastFallbackReason, 'pending_habit_journal');",
            1
          )
          append = r'''

test('a new page resumes a durable pending journal, compacts it, and closes the sequence gap', async () => {
  const harness = await install({
    mode: 'verify_primary_writes',
    journal: [{ id: 'habit:h1:2026-07-24', habitId: 'h1', dayKey: '2026-07-24', source: 'habit' }],
    diagnostics: {
      latestQueuedSequence: 22,
      latestPassedSequence: 17,
      lastFallbackReason: 'pending_habit_journal',
      verificationFailuresTotal: 10,
      deferredWritesTotal: 11
    },
    storedState: fixture(16),
    autoCompactJournal: true
  });

  await new Promise((resolve) => setTimeout(resolve, 30));
  await harness.core.flushPhase4PrimaryWrites();
  const status = harness.core.getPhase4StorageStatus();
  assert.equal(harness.journalCompactionCalls() > 0, true);
  assert.equal(status.latestQueuedSequence, status.latestPassedSequence, JSON.stringify(status));
  assert.equal(status.latestPassedSequence > 22, true, JSON.stringify(status));
  assert.equal(status.lastFallbackReason, null);
  assert.equal(status.verificationFailuresTotal, 10);
});
'''
          if "a new page resumes a durable pending journal" not in text:
            text += append
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Validate contracts and full suite
        shell: bash
        run: |
          node --check phase4_storage_coordinator.js
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js
          npm test

      - name: Commit clean final fix
        shell: bash
        run: |
          rm .github/workflows/fix-phase4-cross-page-journal-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js tests/phase4_storage_contract.test.js .github/workflows/fix-phase4-cross-page-journal-recovery.yml
          git diff --cached --check
          git commit -m "Fix Phase 4 cross-page journal recovery"
          git push origin HEAD:codex/phase-4-dark-storage
