name: One-time overlay Matrix reveal

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/overlay-matrix-reveal' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/overlay-matrix-reveal
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: python3 .github/scripts/one_time_overlay_matrix_reveal.py
      - run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|.github/scripts/one_time_overlay_matrix_reveal.py|.github/automation-triggers/overlay-matrix-reveal.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | grep -qx index.html
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html .github/scripts/one_time_overlay_matrix_reveal.py .github/automation-triggers/overlay-matrix-reveal.txt
          git commit -m "Use overlay Matrix reveal"
          git push origin HEAD:automation/overlay-matrix-reveal
