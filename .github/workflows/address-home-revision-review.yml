name: Address Home revision review

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Chain revision tracking through storage bridge
        shell: python
        run: |
          from pathlib import Path
          import re

          toolbar_path = Path('toolbar.js')
          toolbar = toolbar_path.read_text(encoding='utf-8')

          revision_block = '''(function installTaskPointsStateRevision(global) {
            if (global.TaskPointsStateRevision) return;

            const storage = global.localStorage;
            if (!storage) return;

            const REVISION_KEY = 'taskpoints_state_revision_v1';
            const TRACKED_KEYS = new Set([
              global.TaskPointsCore?.STORAGE_KEY || 'taskpoints_v1',
              global.TaskPointsCore?.PENDING_HABIT_DELTAS_KEY || 'taskpoints_pending_habit_deltas_v1',
              'tp_projects_v1'
            ]);
            const baseSetItem = storage.setItem.bind(storage);
            let sequence = 0;

            const read = () => {
              try { return storage.getItem(REVISION_KEY) || ''; }
              catch (_) { return ''; }
            };

            const createRevision = () => {
              sequence += 1;
              return `${Date.now().toString(36)}-${sequence.toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
            };

            const publishRevision = (reason = 'state-write', emitEvent = true) => {
              const revision = createRevision();
              try {
                baseSetItem(REVISION_KEY, revision);
              } catch (_) {
                return read();
              }
              if (emitEvent && typeof global.dispatchEvent === 'function' && typeof global.CustomEvent === 'function') {
                global.dispatchEvent(new global.CustomEvent('taskpoints:state-revision', {
                  detail: { revision, reason }
                }));
              }
              return revision;
            };

            global.TaskPointsStateRevision = {
              installed: true,
              hookInstalled: false,
              key: REVISION_KEY,
              trackedKeys: Array.from(TRACKED_KEYS),
              shouldTrack: (key) => TRACKED_KEYS.has(String(key)),
              read,
              bump: publishRevision,
              ensure: () => read() || publishRevision('bootstrap', false),
              markHookInstalled() { this.hookInstalled = true; }
            };
            global.TaskPointsStateRevision.ensure();
          })(window);'''

          pattern = re.compile(
            r"\(function installTaskPointsStateRevision\(global\) \{.*?\n\}\)\(window\);(?=\n\nconst scheduleRender)",
            re.DOTALL
          )
          toolbar, replacements = pattern.subn(revision_block, toolbar, count=1)
          if replacements != 1:
            raise SystemExit(f'Expected one revision installer block; found {replacements}')

          set_old = '''    const result = originalSetItem.apply(this, arguments);
              if (this === window.localStorage) {
                const nextValue = String(value);
                dispatchChange({ key: normalizedKey, oldValue, newValue: nextValue });
              }
              return result;'''
          set_new = '''    const result = originalSetItem.apply(this, arguments);
              if (this === window.localStorage) {
                const nextValue = String(value);
                dispatchChange({ key: normalizedKey, oldValue, newValue: nextValue });
                const revision = window.TaskPointsStateRevision;
                if (oldValue !== nextValue && revision?.shouldTrack?.(normalizedKey)) {
                  revision.bump(`set:${normalizedKey}`);
                }
              }
              return result;'''

          remove_old = '''    const result = originalRemoveItem.apply(this, arguments);
              if (this === window.localStorage) {
                dispatchChange({ key: normalizedKey, oldValue, newValue: null });
              }
              return result;'''
          remove_new = '''    const result = originalRemoveItem.apply(this, arguments);
              if (this === window.localStorage) {
                dispatchChange({ key: normalizedKey, oldValue, newValue: null });
                const revision = window.TaskPointsStateRevision;
                if (oldValue !== null && revision?.shouldTrack?.(normalizedKey)) {
                  revision.bump(`remove:${normalizedKey}`);
                }
              }
              return result;'''

          clear_old = '''    const result = originalClear.apply(this, arguments);
              if (this === window.localStorage) {
                dispatchChange({ key: null, oldValue: null, newValue: null });
              }
              return result;'''
          clear_new = '''    const result = originalClear.apply(this, arguments);
              if (this === window.localStorage) {
                dispatchChange({ key: null, oldValue: null, newValue: null });
                window.TaskPointsStateRevision?.bump?.('clear');
              }
              return result;'''

          for label, old, new in (
            ('setItem bridge', set_old, set_new),
            ('removeItem bridge', remove_old, remove_new),
            ('clear bridge', clear_old, clear_new),
          ):
            if new in toolbar:
              continue
            if toolbar.count(old) != 1:
              raise SystemExit(f'Expected one {label} block; found {toolbar.count(old)}')
            toolbar = toolbar.replace(old, new, 1)

          installed_old = '''  window.__tpToolbarStorageBridgeInstalled = true;
          }'''
          installed_new = '''  window.TaskPointsStateRevision?.markHookInstalled?.();
            window.__tpToolbarStorageBridgeInstalled = true;
          }'''
          if installed_new not in toolbar:
            if toolbar.count(installed_old) != 1:
              raise SystemExit('Expected one storage bridge completion marker')
            toolbar = toolbar.replace(installed_old, installed_new, 1)

          forbidden = [
            'storage.setItem = wrappedSetItem',
            'storage.removeItem = wrappedRemoveItem',
            'storage.clear = wrappedClear',
            'installOnStorageObject',
            'installOnStoragePrototype'
          ]
          for item in forbidden:
            if item in toolbar:
              raise SystemExit(f'Revision hook still shadows storage methods: {item}')

          toolbar_path.write_text(toolbar, encoding='utf-8')

          test_path = Path('tests/home_revision_refresh_contract.test.js')
          test_path.write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const root = path.resolve(__dirname, '..');
          const toolbar = fs.readFileSync(path.join(root, 'toolbar.js'), 'utf8');
          const home = fs.readFileSync(path.join(root, 'index.html'), 'utf8');

          function extractFunction(source, signature) {
            const start = source.indexOf(signature);
            assert.notEqual(start, -1, `missing ${signature}`);
            const braceStart = source.indexOf('{', start);
            let depth = 0;
            for (let index = braceStart; index < source.length; index += 1) {
              if (source[index] === '{') depth += 1;
              else if (source[index] === '}') {
                depth -= 1;
                if (depth === 0) return source.slice(start, index + 1);
              }
            }
            throw new Error(`unterminated ${signature}`);
          }

          function createStorageRuntime() {
            class FakeStorage {
              constructor() {
                this.values = new Map();
                this.failRevisionWrites = false;
              }
              getItem(key) {
                const normalized = String(key);
                return this.values.has(normalized) ? this.values.get(normalized) : null;
              }
              setItem(key, value) {
                const normalized = String(key);
                if (normalized === 'taskpoints_state_revision_v1' && this.failRevisionWrites) {
                  throw new Error('quota');
                }
                this.values.set(normalized, String(value));
              }
              removeItem(key) { this.values.delete(String(key)); }
              clear() { this.values.clear(); }
            }

            class FakeCustomEvent {
              constructor(type, init = {}) {
                this.type = type;
                this.detail = init.detail;
              }
            }

            const localStorage = new FakeStorage();
            const events = [];
            const window = {
              Storage: FakeStorage,
              localStorage,
              CustomEvent: FakeCustomEvent,
              dispatchEvent(event) { events.push(event); return true; }
            };
            const context = {
              window,
              CustomEvent: FakeCustomEvent,
              console,
              Date,
              Math,
              String,
              Set,
              Array,
              Object,
              Error
            };

            const revisionStart = toolbar.indexOf('(function installTaskPointsStateRevision(global) {');
            const revisionEnd = toolbar.indexOf('})(window);', revisionStart) + '})(window);'.length;
            assert.ok(revisionStart >= 0 && revisionEnd > revisionStart, 'missing revision installer');
            const revisionSource = toolbar.slice(revisionStart, revisionEnd);
            const bridgeSource = extractFunction(toolbar, 'function installToolbarStorageBridge()');
            vm.runInNewContext(`${revisionSource}\n${bridgeSource}\ninstallToolbarStorageBridge();`, context);

            return { window, localStorage, events };
          }

          test('revision stamping stays inside the existing storage-change bridge', () => {
            assert.doesNotMatch(toolbar, /storage\.setItem = wrappedSetItem/);
            assert.doesNotMatch(toolbar, /storage\.removeItem = wrappedRemoveItem/);
            assert.doesNotMatch(toolbar, /storage\.clear = wrappedClear/);
            assert.match(toolbar, /function installToolbarStorageBridge\(\)/);
            assert.match(toolbar, /revision\?\.shouldTrack\?\.\(normalizedKey\)/);
            assert.match(toolbar, /markHookInstalled/);

            const { window, localStorage, events } = createStorageRuntime();
            assert.equal(Object.hasOwn(localStorage, 'setItem'), false);
            assert.equal(window.TaskPointsStateRevision.hookInstalled, true);

            const priorRevision = window.TaskPointsStateRevision.read();
            localStorage.setItem('taskpoints_v1', 'state-one');
            assert.equal(localStorage.getItem('taskpoints_v1'), 'state-one');
            assert.notEqual(window.TaskPointsStateRevision.read(), priorRevision);
            assert.equal(events.filter((event) => event.type === 'tp:local-storage-change').length, 1);
            assert.equal(events[0].detail.key, 'taskpoints_v1');
          });

          test('revision stamp failure never fails an authoritative storage write', () => {
            const { window, localStorage, events } = createStorageRuntime();
            const priorRevision = window.TaskPointsStateRevision.read();
            localStorage.failRevisionWrites = true;

            assert.doesNotThrow(() => localStorage.setItem('taskpoints_v1', 'state-two'));
            assert.equal(localStorage.getItem('taskpoints_v1'), 'state-two');
            assert.equal(window.TaskPointsStateRevision.read(), priorRevision);
            assert.equal(events.filter((event) => event.type === 'tp:local-storage-change').length, 1);
          });

          test('Home skips lifecycle reloads when its loaded revision is current', () => {
            assert.match(home, /let loadedStateRevision = '';/);
            assert.match(home, /function readHomeStateRevision\(\)/);
            assert.match(home, /function refreshMainPageIfChanged\(reason = 'lifecycle'\)/);
            assert.match(home, /currentRevision === loadedStateRevision/);
            assert.match(home, /refreshMainPageIfChanged\('initial-bfcache-pageshow'\)/);
            assert.match(home, /refreshMainPageIfChanged\('pageshow'\)/);
            assert.match(home, /refreshMainPageIfChanged\('visibilitychange'\)/);
          });

          test('Home updates its revision after initial load, saves, and real refreshes', () => {
            const marks = home.match(/markHomeStateRevisionCurrent\(\);/g) || [];
            assert.ok(marks.length >= 3, `expected at least 3 revision baseline updates, found ${marks.length}`);
            assert.match(home, /state = syncStateWithMatchups\(state\);\s*markHomeStateRevisionCurrent\(\);\s*renderHabitWeekLabels/);
            assert.match(home, /finally \{\s*markHomeStateRevisionCurrent\(\);\s*\}/);
            assert.match(home, /scheduleRender\(renderAll\);\s*markHomeStateRevisionCurrent\(\);\s*return true;/);
          });
          ''', encoding='utf-8')

      - name: Run focused checks
        run: |
          node --check toolbar.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js tests/home_revision_refresh_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Preserve toolbar storage bridge"
          git push
