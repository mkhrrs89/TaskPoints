name: Validate Phase 4 final branch

on:
  push:
    branches:
      - codex/phase-4-dark-storage

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-dark-storage
          fetch-depth: 0

      - name: Run Phase 4 contracts and full suite
        shell: bash
        run: |
          node --check phase4_storage_coordinator.js
          node --check phase4_primary_read_path.js
          node --check phase4_cache_guard.js
          node --check phase4_diagnostics.js
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js tests/phase4_journal_recovery_contract.test.js
          npm test

      - name: Remove temporary validation files
        shell: bash
        run: |
          rm .github/workflows/validate-phase4-final.yml
          rm -f .github/phase4-final-validation-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-phase4-final.yml .github/phase4-final-validation-trigger.txt
          git commit -m "Remove temporary Phase 4 validator"
          git push origin HEAD:codex/phase-4-dark-storage
