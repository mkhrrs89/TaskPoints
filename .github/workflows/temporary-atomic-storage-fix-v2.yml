name: Temporary Atomic Storage Fix v2

on:
  push:
    branches:
      - 'fix/atomic-storage-replacement-20260914'
    paths:
      - '.github/workflows/temporary-atomic-storage-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-storage-replacement-20260914
          fetch-depth: 0

      - name: Remove delete-before-replace behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('scoring_core.js')
          core = core_path.read_text()
          pattern = re.compile(r"  function safeReplaceTaskPointsStorage\(storageKey, serializedCandidate\) \{.*?\n  \}\n\n  function runPendingInteractiveRecompress", re.S)
          replacement = """  function safeReplaceTaskPointsStorage(storageKey, serializedCandidate) {
            // Never delete the authoritative snapshot before its replacement is durable.
            // A direct setItem replacement fails closed: if the write throws, the old
            // taskpoints_v1 value is still physically present.
            localStorage.setItem(storageKey, serializedCandidate);
          }

          function runPendingInteractiveRecompress"""
          core, count = pattern.subn(replacement, core)
          if count != 1:
              raise SystemExit(f'Expected one safeReplaceTaskPointsStorage implementation, found {count}')
          core_path.write_text(core)

          settings_path = Path('settings.html')
          settings = settings_path.read_text()
          replacements = [
              (r'(?P<i>[ \t]*)localStorage\.removeItem\(storageKey\);\n(?P=i)localStorage\.setItem\(storageKey, plan\.chosenRaw\);', 'plan.chosenRaw'),
              (r'(?P<i>[ \t]*)localStorage\.removeItem\(storageKey\);\n(?P=i)localStorage\.setItem\(storageKey, oldRaw\);', 'oldRaw'),
          ]
          for raw_pattern, value in replacements:
              rx = re.compile(raw_pattern)
              settings, count = rx.subn(lambda m, v=value: f"{m.group('i')}localStorage.setItem(storageKey, {v});", settings)
              if count != 1:
                  raise SystemExit(f'Expected one settings remove-before-set path for {value}, found {count}')
          settings_path.write_text(settings)

          Path('tests/storage_atomic_replace_contract.test.js').write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join(__dirname, '..');
          const core = fs.readFileSync(path.join(root, 'scoring_core.js'), 'utf8');
          const settings = fs.readFileSync(path.join(root, 'settings.html'), 'utf8');

          function getSafeReplaceSource() {
            const start = core.indexOf('function safeReplaceTaskPointsStorage');
            const end = core.indexOf('\n  function runPendingInteractiveRecompress', start);
            assert.ok(start >= 0 && end > start);
            return core.slice(start, end);
          }

          function buildSafeReplace(storage) {
            const source = getSafeReplaceSource();
            return Function('localStorage', `${source}; return safeReplaceTaskPointsStorage;`)(storage);
          }

          test('normal replacement never physically removes the authoritative key first', () => {
            assert.doesNotMatch(getSafeReplaceSource(), /removeItem\s*\(/);
            const rows = new Map([['taskpoints_v1', 'large old state']]);
            let removals = 0;
            const storage = {
              getItem: key => rows.get(String(key)) ?? null,
              setItem: (key, value) => rows.set(String(key), String(value)),
              removeItem: key => { removals += 1; rows.delete(String(key)); }
            };
            buildSafeReplace(storage)('taskpoints_v1', 'small');
            assert.equal(rows.get('taskpoints_v1'), 'small');
            assert.equal(removals, 0);
          });

          test('failed replacement leaves the old raw physically present', () => {
            const oldRaw = 'old authoritative state';
            const rows = new Map([['taskpoints_v1', oldRaw]]);
            let removals = 0;
            const storage = {
              getItem: key => rows.get(String(key)) ?? null,
              setItem(key, value) {
                if (String(value) === 'candidate') throw new Error('simulated storage failure');
                rows.set(String(key), String(value));
              },
              removeItem: key => { removals += 1; rows.delete(String(key)); }
            };
            assert.throws(() => buildSafeReplace(storage)('taskpoints_v1', 'candidate'), /simulated storage failure/);
            assert.equal(rows.get('taskpoints_v1'), oldRaw);
            assert.equal(removals, 0);
          });

          test('Settings optimizer and rollback never delete before replacing', () => {
            assert.doesNotMatch(settings, /localStorage\.removeItem\(storageKey\);\s*localStorage\.setItem\(storageKey, plan\.chosenRaw\)/);
            assert.doesNotMatch(settings, /localStorage\.removeItem\(storageKey\);\s*localStorage\.setItem\(storageKey, oldRaw\)/);
          });
          '''.replace(/\n          /g, '\n').trimStart());
          PY

      - name: Run focused storage safety suite
        run: >-
          node --test
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
          tests/phase2_reset_hook.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase5b_deferred_mirror_contract.test.js

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'TaskPoints Storage Safety Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-atomic-storage-fix.yml .github/workflows/temporary-atomic-storage-fix-v2.yml
          git add scoring_core.js settings.html tests/storage_atomic_replace_contract.test.js
          git commit -m 'Make authoritative storage replacement atomic'
          git push origin HEAD:fix/atomic-storage-replacement-20260914
