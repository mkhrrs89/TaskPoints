name: One-time early Matrix DOM-ready handoff fix

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/immediate-matrix-boot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out guarded feature branch
        uses: actions/checkout@v4
        with:
          ref: automation/immediate-matrix-boot
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Coordinate early boot with DOM ready
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''document.addEventListener('DOMContentLoaded', () => {
            const shouldPlayBoot = !hasSeenBootThisSession();

            if (shouldPlayBoot){
              document.body.classList.add('booting');
              markBootSeenThisSession();
              runMatrixBootAnim();
            } else {
          '''

          new = '''document.addEventListener('DOMContentLoaded', () => {
            const earlyBootPromise = window.__tpMatrixFinishedPromise;
            const shouldPlayBoot = !hasSeenBootThisSession();

            if (earlyBootPromise && typeof earlyBootPromise.then === "function"){
              markBootSeenThisSession();
              if (!window.__tpMatrixFinished) document.body.classList.add('booting');
              earlyBootPromise.then(() => {
                if (typeof bootAnimDoneResolve === "function") bootAnimDoneResolve();
              });
            } else if (shouldPlayBoot){
              document.body.classList.add('booting');
              markBootSeenThisSession();
              runMatrixBootAnim();
            } else {
          '''

          if old in text:
            assert text.count(old) == 1, 'Expected exactly one legacy DOM-ready boot block'
            text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')

          trigger = Path('.github/automation-triggers/immediate-matrix-dom-ready.txt')
          if trigger.exists():
            trigger.unlink()

          verified = path.read_text(encoding='utf-8')
          assert verified.count('id="tp-early-matrix-bootstrap"') == 1
          assert old not in verified
          assert verified.count('const earlyBootPromise = window.__tpMatrixFinishedPromise;') == 1
          assert verified.count('if (!window.__tpMatrixFinished) document.body.classList.add(\'booting\');') == 1
          assert verified.count('} else if (shouldPlayBoot){') == 1
          assert verified.count('runMatrixBootAnim();') == 1
          assert verified.count('let bootFinished = false;') == 1

      - name: Verify and commit the guarded handoff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Guarded handoff is already applied."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|.github/automation-triggers/immediate-matrix-dom-ready.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          if ! printf '%s\n' "${changed[@]}" | grep -qx 'index.html'; then
            echo "index.html was not changed as expected."
            exit 1
          fi
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html .github/automation-triggers/immediate-matrix-dom-ready.txt
          git commit -m "Coordinate early Matrix boot with DOM ready"
          git push origin HEAD:automation/immediate-matrix-boot
