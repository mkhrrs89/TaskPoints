name: Validate Phase 4 snapshot branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/phase4-single-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase4-single-snapshot
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply branch-contained patch
        id: patch
        continue-on-error: true
        run: |
          python3 - <<'PY' > phase4-patch.log 2>&1
          from pathlib import Path
          workflow = Path('.github/workflows/phase4-single-snapshot.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'phase4_snapshot_patch.py', 'exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase4-snapshot-patch-log
          path: phase4-patch.log
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: |
          cat phase4-patch.log
          exit 1
      - name: Validate complete repository
        run: |
          npm test
          node --check phase4_storage_coordinator.js
          node --check phase4_primary_read_path.js
      - name: Commit validated branch
        run: |
          rm .github/workflows/phase4-single-snapshot.yml
          rm -f .phase4-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js tests/phase4_storage_contract.test.js .github/workflows/phase4-single-snapshot.yml .phase4-trigger
          git commit -m "Store Phase 4 as one verified snapshot"
          git push origin HEAD:codex/phase4-single-snapshot
