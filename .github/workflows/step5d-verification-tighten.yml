name: step5d-verification-tighten
on:
  push:
    branches:
      - agent/step5d-longer-compaction-quiet
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5d-longer-compaction-quiet
      - name: Tighten verification
        run: python scripts/step5d_verification_tighten.py
      - name: Run focused tests
        run: |
          node --check task_mutation_journal.js
          node --test tests/task_mutation_journal_contract.test.js
          git diff --check
      - name: Commit clean verification tightening
        run: |
          rm scripts/step5d_verification_tighten.py
          rm .github/workflows/step5d-verification-tighten.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add task_mutation_journal.js scripts/step5d_verification_tighten.py .github/workflows/step5d-verification-tighten.yml
          git commit -m 'Tighten task journal persistence verification'
          git push origin HEAD:agent/step5d-longer-compaction-quiet
