name: One-time faster stylesheet load

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace render-blocking stylesheet tags
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '''  <link rel="stylesheet" href="assets/tailwind.css">

<link rel="stylesheet" href="styles.css">'''
          new = '''  <link rel="preload" href="assets/tailwind.css" as="style">
  <link rel="preload" href="styles.css" as="style">

  <link rel="stylesheet" href="assets/tailwind.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'">

  <noscript>
    <link rel="stylesheet" href="assets/tailwind.css">
    <link rel="stylesheet" href="styles.css">
  </noscript>'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one stylesheet block, found {count}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify exact scope
        shell: bash
        run: |
          grep -F '<link rel="preload" href="assets/tailwind.css" as="style">' index.html
          grep -F '<link rel="preload" href="styles.css" as="style">' index.html
          grep -F 'media="print" onload="this.media='"'"'all'"'"'"' index.html
          git diff --check

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/one-time-faster-css-load.yml
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/one-time-faster-css-load.yml
          git commit -m "Speed up initial stylesheet loading"
          git push origin HEAD:main
