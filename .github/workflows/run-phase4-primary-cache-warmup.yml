name: Run Phase 4 primary cache warmup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-primary-cache-warmup
          fetch-depth: 0

      - name: Apply primary cache warmup fix
        run: python .github/scripts/apply_phase4_primary_cache_warmup.py

      - name: Validate focused cache warmup contracts
        shell: bash
        run: |
          set -o pipefail
          {
            node --check phase3_session_codec.js
            node --check phase4_storage_coordinator.js
            node --check phase4_primary_read_path.js
            node --test tests/phase4_primary_cache_warmup_contract.test.js
          } 2>&1 | tee /tmp/phase4-primary-cache-focused.log

      - name: Upload focused failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-primary-cache-focused-log
          path: /tmp/phase4-primary-cache-focused.log

      - name: Validate complete Phase 4 and repository suites
        shell: bash
        run: |
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js tests/phase4_journal_recovery_contract.test.js tests/phase4_status_recovery_contract.test.js
          npm test

      - name: Commit clean fix
        shell: bash
        run: |
          rm .github/scripts/apply_phase4_primary_cache_warmup.py
          rm .github/workflows/run-phase4-primary-cache-warmup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3_session_codec.js phase4_storage_coordinator.js phase4_primary_read_path.js phase4_storage_status.html tests/phase4_primary_cache_warmup_contract.test.js .github/scripts/apply_phase4_primary_cache_warmup.py .github/workflows/run-phase4-primary-cache-warmup.yml
          git diff --cached --check
          git commit -m "Restore and warm Phase 4 primary cache"
          git push origin HEAD:codex/phase-4-primary-cache-warmup
