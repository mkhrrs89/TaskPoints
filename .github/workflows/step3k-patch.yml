name: step3k-patch
on:
  push:
    branches: [agent/step3k-defer-season-integrity-persist]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Run Step 3K patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step3k-defer-season-integrity-persist
      - name: Apply Step 3K and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('season_result_integrity_guard.js')
          s = p.read_text()
          marker = "  let saving = false;\n  let statAttempts = 0;\n"
          if marker not in s:
              raise SystemExit('state marker not found')
          s = s.replace(marker, marker + "  const LOAD_REPAIR_PERSIST_DELAY_MS = 14000;\n  let loadRepairPersistScheduled = false;\n  let pendingLoadRepairOptions = null;\n")
          load_block = """  if (original.loadAppState) c.loadAppState = function loadFixed(options = {}) {\n    const loaded = original.loadAppState(options);\n    const state = loaded?.state || loaded;\n    if (!state || typeof state !== 'object') return loaded;\n    const fixed = repair(state, options);\n    if (!fixed.changed) return loaded;\n    persist(fixed.state, fixed.diagnostics, options);\n    return loaded?.state ? { ...loaded, state: fixed.state, integrityRepair: fixed.diagnostics } : fixed.state;\n  };\n"""
          if load_block not in s:
              raise SystemExit('loadFixed block not found')
          helper = """  function markIntegrityPerf(name, detail = {}) {\n    try { g.TaskPointsPerf?.mark?.(name, detail); } catch (_) {}\n  }\n\n  function persistFreshLoadRepair(options = {}) {\n    if (!original.loadAppState) return false;\n    let loaded;\n    try {\n      loaded = original.loadAppState({ ...(options || {}), persistSync: false });\n    } catch (_) {\n      return false;\n    }\n    const state = loaded?.state || loaded;\n    if (!state || typeof state !== 'object') return false;\n    const fixed = repair(state, options);\n    if (!fixed.changed) {\n      markIntegrityPerf('seasonIntegrity.loadRepairNoLongerNeeded');\n      return false;\n    }\n    const persistOptions = { ...(options || {}) };\n    delete persistOptions.persistSync;\n    const saved = persist(fixed.state, fixed.diagnostics, persistOptions);\n    markIntegrityPerf('seasonIntegrity.loadRepairPersisted', { saved: Boolean(saved) });\n    return saved;\n  }\n\n  function scheduleLoadRepairPersist(options = {}) {\n    if (options.persistSync === false) return false;\n    pendingLoadRepairOptions = { ...(options || {}) };\n    if (loadRepairPersistScheduled) return true;\n    if (typeof g.setTimeout !== 'function') return false;\n    loadRepairPersistScheduled = true;\n    markIntegrityPerf('seasonIntegrity.loadRepairDeferred', { delayMs: LOAD_REPAIR_PERSIST_DELAY_MS });\n\n    const run = () => {\n      const latestOptions = pendingLoadRepairOptions || {};\n      pendingLoadRepairOptions = null;\n      loadRepairPersistScheduled = false;\n      return persistFreshLoadRepair(latestOptions);\n    };\n    const enterQuietGate = () => {\n      const gate = c.whenStorageMaintenanceQuiet;\n      if (typeof gate === 'function') {\n        Promise.resolve(gate(run, { reason: 'season_result_integrity_load_persist' }))\n          .catch(() => { loadRepairPersistScheduled = false; });\n        return;\n      }\n      if (typeof g.requestIdleCallback === 'function') {\n        g.requestIdleCallback(() => run(), { timeout: 5000 });\n        return;\n      }\n      g.setTimeout(run, 1000);\n    };\n    g.setTimeout(enterQuietGate, LOAD_REPAIR_PERSIST_DELAY_MS);\n    return true;\n  }\n\n"""
          new_load = """  if (original.loadAppState) c.loadAppState = function loadFixed(options = {}) {\n    const loaded = original.loadAppState(options);\n    const state = loaded?.state || loaded;\n    if (!state || typeof state !== 'object') return loaded;\n    const fixed = repair(state, options);\n    if (!fixed.changed) return loaded;\n    scheduleLoadRepairPersist(options);\n    return loaded?.state ? { ...loaded, state: fixed.state, integrityRepair: fixed.diagnostics } : fixed.state;\n  };\n"""
          s = s.replace(load_block, helper + new_load)
          p.write_text(s)

          Path('tests/step3k_season_integrity_deferred_persist.test.js').write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const source = fs.readFileSync(path.resolve(__dirname, '../season_result_integrity_guard.js'), 'utf8');

          test('ordinary load repair no longer synchronously persists a full snapshot', () => {
            const match = source.match(/if \(original\.loadAppState\) c\.loadAppState = function loadFixed[\s\S]*?\n  \};/);
            assert.ok(match, 'loadFixed wrapper should exist');
            assert.match(match[0], /scheduleLoadRepairPersist\(options\)/);
            assert.doesNotMatch(match[0], /persist\(fixed\.state/);
          });

          test('deferred persistence waits 14s, then uses the shared quiet gate', () => {
            assert.match(source, /const LOAD_REPAIR_PERSIST_DELAY_MS = 14000;/);
            assert.match(source, /g\.setTimeout\(enterQuietGate, LOAD_REPAIR_PERSIST_DELAY_MS\)/);
            assert.match(source, /const gate = c\.whenStorageMaintenanceQuiet;/);
            assert.match(source, /gate\(run, \{ reason: 'season_result_integrity_load_persist' \}\)/);
          });

          test('deferred persistence re-reads current state instead of saving a stale captured snapshot', () => {
            assert.match(source, /original\.loadAppState\(\{ \.\.\.\(options \|\| \{\}\), persistSync: false \}\)/);
            assert.match(source, /const fixed = repair\(state, options\);/);
            assert.match(source, /const saved = persist\(fixed\.state, fixed\.diagnostics, persistOptions\);/);
          });

          test('persistSync false still suppresses persistence and manual stored repair remains available', () => {
            assert.match(source, /if \(options\.persistSync === false\) return false;/);
            assert.match(source, /function repairStored\(\)/);
            assert.match(source, /repairAuthoritativeStoredState: repairStored/);
          });
          ''')
          PY
          node --check season_result_integrity_guard.js
          node --test tests/season_result_integrity_guard.test.js tests/step3k_season_integrity_deferred_persist.test.js
      - name: Commit final Step 3K patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/step3k-patch.yml STEP3K_TRIGGER.txt
          git add season_result_integrity_guard.js tests/step3k_season_integrity_deferred_persist.test.js
          git commit -m 'Defer season integrity persistence from ordinary reads'
          git push origin HEAD:agent/step3k-defer-season-integrity-persist
