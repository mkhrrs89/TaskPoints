name: Fix Phase 4 preview findings

on:
  push:
    branches:
      - codex/phase-4-dark-storage

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-dark-storage
          fetch-depth: 0

      - name: Apply regression tests and fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module_path = Path('phase4_storage_coordinator.js')
          text = module_path.read_text(encoding='utf-8')

          old = """      verificationFailuresTotal: Number(previous.verificationFailuresTotal) || 0,
      lastFallbackReason: previous.lastFallbackReason || null,
"""
          new = """      verificationFailuresTotal: Number(previous.verificationFailuresTotal) || 0,
      deferredWritesTotal: Number(previous.deferredWritesTotal) || 0,
      lastFallbackReason: previous.lastFallbackReason || null,
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    try { global.localStorage?.setItem?.(DIAGNOSTICS_KEY, JSON.stringify(next)); } catch (_) {}
    return next;
"""
          new = """    next.latestPassedSequence = Math.max(
      Number(previous.latestPassedSequence) || 0,
      Number(next.latestPassedSequence) || 0
    );
    next.latestQueuedSequence = Math.max(
      Number(previous.latestQueuedSequence) || 0,
      Number(previous.latestPassedSequence) || 0,
      Number(next.latestQueuedSequence) || 0,
      Number(next.latestPassedSequence) || 0
    );
    try { global.localStorage?.setItem?.(DIAGNOSTICS_KEY, JSON.stringify(next)); } catch (_) {}
    return next;
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function journalCount() {
    try { return Number(core.readPendingHabitDeltas?.().length) || 0; } catch (_) { return 1; }
  }

  async function performWrite(options = {}) {
"""
          new = """  function journalCount() {
    try { return Number(core.readPendingHabitDeltas?.().length) || 0; } catch (_) { return 1; }
  }

  function nextSequence() {
    const diagnostics = readDiagnostics();
    sequence = Math.max(
      sequence,
      Number(diagnostics.latestQueuedSequence) || 0,
      Number(diagnostics.latestPassedSequence) || 0
    ) + 1;
    return sequence;
  }

  function queueAfterJournalCleared() {
    if (getMode() === 'off') return;
    if (journalCount() > 0) return;
    if (safeGet(core.STORAGE_KEY) === null) return;
    queueWrite({ reason: 'habit_journal_cleared' });
  }

  async function performWrite(options = {}) {
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    if (pendingJournalCount > 0) {
      clearCaches();
      return writeDiagnostics({
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: 'pending_habit_journal',
        resetTombstone: false
      });
    }
"""
          new = """    if (pendingJournalCount > 0) {
      clearCaches();
      const previous = readDiagnostics();
      return writeDiagnostics({
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: 'pending_habit_journal',
        deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + 1,
        resetTombstone: false
      });
    }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      const previous = readDiagnostics();
      return writeDiagnostics({
        configuredMode: getMode(),
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: String(error?.message || error || 'phase4_write_failed'),
        verificationFailuresTotal: (Number(previous.verificationFailuresTotal) || 0) + 1,
        resetTombstone: false
      });
"""
          new = """      const previous = readDiagnostics();
      const reason = String(error?.message || error || 'phase4_write_failed');
      const deferred = new Set([
        'pending_habit_journal',
        'dual_write_pending',
        'mirror_changed_during_verification'
      ]).has(reason);
      return writeDiagnostics({
        configuredMode: getMode(),
        effectiveSource: 'localStorage',
        latestQueuedSequence: writeSequence,
        lastFallbackAt: nowIso(),
        lastFallbackReason: reason,
        verificationFailuresTotal: (Number(previous.verificationFailuresTotal) || 0) + (deferred ? 0 : 1),
        deferredWritesTotal: (Number(previous.deferredWritesTotal) || 0) + (deferred ? 1 : 0),
        resetTombstone: false
      });
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    const writeSequence = ++sequence;
"""
          new = """    const writeSequence = nextSequence();
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      verificationFailuresTotal: Number(diagnostics.verificationFailuresTotal) || 0,
      countsMatch: diagnostics.countsMatch === true,
"""
          new = """      verificationFailuresTotal: Number(diagnostics.verificationFailuresTotal) || 0,
      deferredWritesTotal: Number(diagnostics.deferredWritesTotal) || 0,
      countsMatch: diagnostics.countsMatch === true,
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      const wrappedSet = function phase4SetItem(key, value) {
        const result = originalSet(key, value);
        if (String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        return result;
      };
      const wrappedRemove = originalRemove ? function phase4RemoveItem(key) {
        const result = originalRemove(key);
        if (String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        return result;
      } : null;
"""
          new = """      const wrappedSet = function phase4SetItem(key, value) {
        const result = originalSet(key, value);
        const normalizedKey = String(key);
        if (normalizedKey === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        else if (normalizedKey === core.PENDING_HABIT_DELTAS_KEY) queueAfterJournalCleared();
        return result;
      };
      const wrappedRemove = originalRemove ? function phase4RemoveItem(key) {
        const result = originalRemove(key);
        const normalizedKey = String(key);
        if (normalizedKey === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        else if (normalizedKey === core.PENDING_HABIT_DELTAS_KEY) queueAfterJournalCleared();
        return result;
      } : null;
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    prototype.setItem = function phase4SetItem(key, value) {
      const result = originalSet.call(this, key, value);
      if (this === global.localStorage && String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
      return result;
    };
"""
          new = """    prototype.setItem = function phase4SetItem(key, value) {
      const result = originalSet.call(this, key, value);
      if (this === global.localStorage) {
        const normalizedKey = String(key);
        if (normalizedKey === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        else if (normalizedKey === core.PENDING_HABIT_DELTAS_KEY) queueAfterJournalCleared();
      }
      return result;
    };
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """    prototype.removeItem = function phase4RemoveItem(key) {
      const result = originalRemove.call(this, key);
      if (this === global.localStorage && String(key) === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
      return result;
    };
"""
          new = """    prototype.removeItem = function phase4RemoveItem(key) {
      const result = originalRemove.call(this, key);
      if (this === global.localStorage) {
        const normalizedKey = String(key);
        if (normalizedKey === core.STORAGE_KEY && getMode() !== 'off') queueWrite();
        else if (normalizedKey === core.PENDING_HABIT_DELTAS_KEY) queueAfterJournalCleared();
      }
      return result;
    };
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          module_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/phase4_storage_contract.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old = """const MODE_KEY = 'taskpoints_phase4_storage_mode_v1';
const SHADOW_DB = 'taskpoints_shadow_state_v1';
"""
          new = """const MODE_KEY = 'taskpoints_phase4_storage_mode_v1';
const DIAGNOSTICS_KEY = 'taskpoints_phase4_diagnostics_v1';
const SHADOW_DB = 'taskpoints_shadow_state_v1';
"""
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)

          old = """async function install({ mode, journal = [], indexedDB = createFakeIndexedDb() } = {}) {
"""
          new = """async function install({ mode, journal = [], diagnostics = null, indexedDB = createFakeIndexedDb() } = {}) {
"""
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)

          old = """    ...(mode == null ? {} : { [MODE_KEY]: mode }),
    ...(journal.length ? { [JOURNAL_KEY]: JSON.stringify(journal) } : {})
"""
          new = """    ...(mode == null ? {} : { [MODE_KEY]: mode }),
    ...(journal.length ? { [JOURNAL_KEY]: JSON.stringify(journal) } : {}),
    ...(diagnostics ? { [DIAGNOSTICS_KEY]: JSON.stringify(diagnostics) } : {})
"""
          assert tests.count(old) == 1
          tests = tests.replace(old, new, 1)

          tests += """

test('write sequences continue above persisted diagnostics after a page reload', async () => {
  const harness = await install({
    mode: 'verify_primary_writes',
    diagnostics: { latestQueuedSequence: 7, latestPassedSequence: 7 }
  });
  harness.localStorage.setItem(STORAGE_KEY, JSON.stringify(fixture(14)));
  await harness.core.flushPhase4PrimaryWrites();
  const status = harness.core.getPhase4StorageStatus();
  assert.equal(status.latestQueuedSequence > 7, true, JSON.stringify(status));
  assert.equal(status.latestPassedSequence, status.latestQueuedSequence);
});

test('clearing a pending habit journal automatically retries without adding a verification failure', async () => {
  const harness = await install({
    mode: 'verify_primary_writes',
    journal: [{ id: 'habit:h1:2026-07-24', habitId: 'h1', dayKey: '2026-07-24', source: 'habit' }]
  });
  harness.localStorage.setItem(STORAGE_KEY, JSON.stringify(fixture(15)));
  await harness.core.flushPhase4PrimaryWrites();
  const deferred = harness.core.getPhase4StorageStatus();
  assert.equal(deferred.lastFallbackReason, 'pending_habit_journal');
  const failuresBefore = deferred.verificationFailuresTotal;

  harness.localStorage.setItem(JOURNAL_KEY, '[]');
  await harness.core.flushPhase4PrimaryWrites();
  const recovered = harness.core.getPhase4StorageStatus();
  assert.equal(recovered.latestQueuedSequence, recovered.latestPassedSequence, JSON.stringify(recovered));
  assert.equal(recovered.lastFallbackReason, null);
  assert.equal(recovered.verificationFailuresTotal, failuresBefore);
  assert.equal(recovered.deferredWritesTotal > 0, true);
});
"""
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate Phase 4 contracts
        run: node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js

      - name: Validate full suite
        run: npm test

      - name: Commit final fix
        shell: bash
        run: |
          rm .github/workflows/fix-phase4-preview-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js tests/phase4_storage_contract.test.js .github/workflows/fix-phase4-preview-findings.yml
          git diff --cached --check
          git commit -m "Fix Phase 4 preview sequencing and habit retry"
          git push origin HEAD:codex/phase-4-dark-storage
