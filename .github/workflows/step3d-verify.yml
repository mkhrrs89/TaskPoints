name: Step 3D verification

on:
  push:
    branches:
      - agent/step3d-navigation-maintenance

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Step 3D focused tests
        run: >-
          node --test
          tests/step3d_navigation_maintenance.test.js
          tests/phase5c_verified_secondary_contract.test.js
          tests/step3a_storage_hot_path.test.js
          tests/verified_secondary_manual_recovery_contract.test.js
          tests/phase4_read_contract.test.js
          tests/phase4_lightweight_read_validation_contract.test.js
