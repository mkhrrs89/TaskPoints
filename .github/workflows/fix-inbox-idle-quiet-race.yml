name: Fix Inbox idle quiet-time race

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply quiet-time race fix
        run: python scripts/fix_inbox_idle_quiet_race.py

      - name: Run focused checks
        run: |
          node --test tests/inbox_first_paint_performance.test.js
          node --test tests/inbox_count_badge.test.js
          node --test tests/home_first_paint_maintenance.test.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox.html tests/inbox_first_paint_performance.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Recheck Inbox quiet time before populate"
          git push
