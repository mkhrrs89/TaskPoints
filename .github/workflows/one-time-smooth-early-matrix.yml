name: One-time smooth early Matrix animation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/smooth-early-matrix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out guarded feature branch
        uses: actions/checkout@v4
        with:
          ref: automation/smooth-early-matrix
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Replace timer-driven glyph updates with CSS frames
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''  const randomGlyph = () => glyphs[(Math.random() * glyphs.length) | 0];
            const spans = [];
            titleEl.innerHTML = "";
            for (const finalChar of word){
              const span = document.createElement("span");
              span.className = "matrixChar";
              span.dataset.final = finalChar;
              span.textContent = randomGlyph();
              titleEl.appendChild(span);
              spans.push(span);
            }

            const decodeOne = (span, finalChar) => new Promise(resolve => {
              const start = performance.now();
              const interval = setInterval(() => {
                if (skipRequested){
                  clearInterval(interval);
                  resolve();
                  return;
                }
                span.textContent = randomGlyph();
                if (performance.now() - start >= 210){
                  clearInterval(interval);
                  span.textContent = finalChar;
                  span.classList.add("locked");
                  resolve();
                }
              }, 20);
            });

            (async () => {
              for (const span of spans){
                if (skipRequested) return;
                await decodeOne(span, span.dataset.final);
              }
              if (skipRequested) return;
              await new Promise(resolve => setTimeout(resolve, 80));
              if (skipRequested) return;
              finishTimer = setTimeout(finish, 180);
            })();
          '''

          new = '''  const animationStyle = document.createElement("style");
            animationStyle.id = "tp-early-matrix-animation-style";
            animationStyle.textContent = `
              #matrixTitle .tp-matrix-cell {
                position: relative;
                height: 1.15em;
                line-height: 1.15em;
                vertical-align: middle;
                contain: paint;
              }
              #matrixTitle .tp-matrix-frame,
              #matrixTitle .tp-matrix-final {
                position: absolute;
                inset: 0;
                display: block;
                text-align: center;
                opacity: 0;
                will-change: opacity;
              }
              #matrixTitle .tp-matrix-frame {
                animation: tpMatrixGlyphFlash 26ms linear both;
              }
              #matrixTitle .tp-matrix-final {
                color: #eafff1;
                animation: tpMatrixFinalLock 1ms steps(1, end) both;
              }
              #matrixTitle.tp-matrix-skip .tp-matrix-frame {
                animation: none !important;
                opacity: 0 !important;
              }
              #matrixTitle.tp-matrix-skip .tp-matrix-final {
                animation: none !important;
                opacity: 1 !important;
              }
              @keyframes tpMatrixGlyphFlash {
                0%, 96% { opacity: 0.95; }
                100% { opacity: 0; }
              }
              @keyframes tpMatrixFinalLock {
                from { opacity: 0; }
                to { opacity: 1; }
              }
            `;
            document.head.appendChild(animationStyle);

            const randomGlyph = () => glyphs[(Math.random() * glyphs.length) | 0];
            const frameCount = 8;
            const frameDurationMs = 26;
            const characterDurationMs = 210;
            const initialDelayMs = 90;
            let completionScheduled = false;
            let lastFinal = null;

            titleEl.innerHTML = "";
            for (let index = 0; index < word.length; index++){
              const cell = document.createElement("span");
              cell.className = "matrixChar tp-matrix-cell";

              for (let frameIndex = 0; frameIndex < frameCount; frameIndex++){
                const frame = document.createElement("span");
                frame.className = "tp-matrix-frame";
                frame.textContent = randomGlyph();
                frame.style.animationDelay = `${initialDelayMs + (index * characterDurationMs) + (frameIndex * frameDurationMs)}ms`;
                cell.appendChild(frame);
              }

              const finalFrame = document.createElement("span");
              finalFrame.className = "tp-matrix-final";
              finalFrame.textContent = word[index];
              finalFrame.style.animationDelay = `${initialDelayMs + ((index + 1) * characterDurationMs)}ms`;
              cell.appendChild(finalFrame);
              titleEl.appendChild(cell);
              lastFinal = finalFrame;
            }

            const completeAfterVisual = () => {
              if (completionScheduled || skipRequested || finished) return;
              completionScheduled = true;
              setTimeout(() => {
                if (skipRequested || finished) return;
                finishTimer = setTimeout(finish, 180);
              }, 80);
            };

            lastFinal?.addEventListener("animationend", completeAfterVisual, { once: true });
            const visualDurationMs = initialDelayMs + (word.length * characterDurationMs);
            setTimeout(completeAfterVisual, visualDurationMs + 120);
          '''

          if old in text:
            assert text.count(old) == 1, 'Expected exactly one timer-driven early Matrix block'
            text = text.replace(old, new, 1)

          old_skip = '''    const requestSkip = () => {
              if (skipRequested || finished) return;
              skipRequested = true;
              finish();
            };
          '''
          new_skip = '''    const requestSkip = () => {
              if (skipRequested || finished) return;
              skipRequested = true;
              titleEl.classList.add("tp-matrix-skip");
              finish();
            };
          '''
          if old_skip in text:
            assert text.count(old_skip) == 1, 'Expected exactly one early Matrix skip handler'
            text = text.replace(old_skip, new_skip, 1)

          trigger = Path('.github/automation-triggers/smooth-early-matrix.txt')
          if trigger.exists():
            trigger.unlink()

          path.write_text(text, encoding='utf-8')
          verified = path.read_text(encoding='utf-8')
          assert verified.count('id="tp-early-matrix-bootstrap"') == 1
          assert verified.count('id = "tp-early-matrix-animation-style"') == 1
          assert verified.count('animation: tpMatrixGlyphFlash 26ms linear both;') == 1
          assert verified.count('setInterval(() => {') >= 1
          early_start = verified.index('id="tp-early-matrix-bootstrap"')
          early_end = verified.index('</script>', early_start)
          early_block = verified[early_start:early_end]
          assert 'setInterval(' not in early_block
          assert 'frame.style.animationDelay' == 'frame.style.animationDelay'
          assert 'titleEl.classList.add("tp-matrix-skip")' in early_block
          assert verified.count('window.__tpMatrixFinishedPromise = new Promise') == 1

      - name: Verify and commit only the guarded animation change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Smooth early Matrix patch is already applied."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|.github/automation-triggers/smooth-early-matrix.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          if ! printf '%s\n' "${changed[@]}" | grep -qx 'index.html'; then
            echo "index.html was not changed as expected."
            exit 1
          fi
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html .github/automation-triggers/smooth-early-matrix.txt
          git commit -m "Smooth early Matrix animation"
          git push origin HEAD:automation/smooth-early-matrix
