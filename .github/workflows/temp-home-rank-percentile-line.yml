name: Temporary Home Rank Percentile Line

on:
  push:
    branches:
      - agent/home-rank-percentile-line

permissions:
  contents: write

jobs:
  wire-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/home-rank-percentile-line
          fetch-depth: 0

      - name: Wire home rank percentile module
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'index.html';
          let source = fs.readFileSync(file, 'utf8');
          const needle = '<script src="scoring_core.js"></script>  ';
          const addition = needle + '\n<script src="home_rank_percentile_line.js"></script>';
          if (!source.includes(needle)) throw new Error('scoring_core script anchor not found');
          if (source.includes('home_rank_percentile_line.js')) throw new Error('rank percentile script already wired');
          source = source.replace(needle, addition);
          fs.writeFileSync(file, source);
          NODE

      - name: Verify focused home rank behavior
        run: |
          node --test tests/home_rank_percentile_line.test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('index.html', 'utf8');
          const matches = source.match(/<script src="home_rank_percentile_line\.js"><\/script>/g) || [];
          if (matches.length !== 1) throw new Error(`Expected one home rank script include, found ${matches.length}`);
          NODE

      - name: Commit verified home wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show dynamic rank percentile line on home"
          git push origin HEAD:agent/home-rank-percentile-line
