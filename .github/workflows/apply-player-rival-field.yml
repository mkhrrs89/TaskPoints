name: Apply player rival field

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded rival field patch
        run: python scripts/apply_player_rival_field.py

      - name: Run focused checks
        run: |
          node --test tests/player_rival_field_contract.test.js
          find tests -maxdepth 1 -type f \( -name '*player*test.js' -o -name 'game_*test.js' \) ! -name 'player_rival_field_contract.test.js' -print0 | xargs -0 -r node --test
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html tests/player_rival_field_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Add player rival dropdown"
          git push
