name: step4a-patch
on:
  push:
    branches:
      - agent/step4a-players-render-trace
    paths:
      - .github/workflows/step4a-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step4a-players-render-trace
      - name: Add Players render phase tracing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game.html')
          text = path.read_text()

          def rep(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected 1 match, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          rep(
          '''async function renderPlayers() {
  const container = $("playersList");
  if (!container) return;

  updateSortSelectUI();''',
          '''function beginPlayersPerfSpan(name, detail = {}) {
  const span = window.TaskPointsPerf?.span;
  return typeof span === "function" ? span(name, detail) : (() => {});
}

async function renderPlayers() {
  const container = $("playersList");
  if (!container) return;

  const finishRenderPerf = beginPlayersPerfSpan("game.renderPlayers", {
    players: Array.isArray(state.players) ? state.players.length : 0,
    completions: Array.isArray(state.completions) ? state.completions.length : 0,
    matchups: Array.isArray(state.matchups) ? state.matchups.length : 0,
    gameHistory: Array.isArray(state.gameHistory) ? state.gameHistory.length : 0
  });

  updateSortSelectUI();''')

          rep(
          '''  // --- compute your real TaskPoints score for today ---
  const todayPoints = computeTodayPoints();
  const youStats = calcYouStats();
  const historyStats = buildPlayerHistoryStats();''',
          '''  // --- compute your real TaskPoints score for today ---
  const finishTodayPointsPerf = beginPlayersPerfSpan("game.renderPlayers.computeTodayPoints");
  const todayPoints = computeTodayPoints();
  finishTodayPointsPerf();

  const finishYouStatsPerf = beginPlayersPerfSpan("game.renderPlayers.calcYouStats");
  const youStats = calcYouStats();
  finishYouStatsPerf();

  const finishHistoryStatsPerf = beginPlayersPerfSpan("game.renderPlayers.buildPlayerHistoryStats");
  const historyStats = buildPlayerHistoryStats();
  finishHistoryStatsPerf({ playerStats: historyStats?.size || 0 });''')

          rep(
          '''const canonicalRankingRows = window.TaskPointsCore?.computeCanonicalRankings
  ? TaskPointsCore.computeCanonicalRankings(state)
  : [];''',
          '''const finishCanonicalRankingsPerf = beginPlayersPerfSpan("game.renderPlayers.computeCanonicalRankings");
const canonicalRankingRows = window.TaskPointsCore?.computeCanonicalRankings
  ? TaskPointsCore.computeCanonicalRankings(state)
  : [];
finishCanonicalRankingsPerf({ rows: canonicalRankingRows.length });''')

          rep(
          '''  const sortedPlayers = players.slice().sort(comparePlayers);

  const appendPlayerCard = (p, targetContainer) => {''',
          '''  const finishSortPerf = beginPlayersPerfSpan("game.renderPlayers.sort");
  const sortedPlayers = players.slice().sort(comparePlayers);
  finishSortPerf({ players: sortedPlayers.length });

  const appendPlayerCard = (p, targetContainer) => {''')

          rep(
          '''  if (groupActivePlayers) {
    const activePlayers = sortedPlayers.filter((p) => (p.isYou ? true : isPlayerActive(p)));''',
          '''  const finishDomBuildPerf = beginPlayersPerfSpan("game.renderPlayers.domBuild", {
    players: sortedPlayers.length,
    grouped: groupActivePlayers,
    viewMode
  });

  if (groupActivePlayers) {
    const activePlayers = sortedPlayers.filter((p) => (p.isYou ? true : isPlayerActive(p)));''')

          rep(
          '''  } else {
    sortedPlayers.forEach((p) => appendPlayerCard(p, container));
  }

  container.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", handlePlayerAction);
  });
  wirePlayerColorEditors(container);
  syncPlayerEditorModalState();

}''',
          '''  } else {
    sortedPlayers.forEach((p) => appendPlayerCard(p, container));
  }
  finishDomBuildPerf({ childCount: container.children.length });

  const finishWirePerf = beginPlayersPerfSpan("game.renderPlayers.wireControls");
  container.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", handlePlayerAction);
  });
  wirePlayerColorEditors(container);
  syncPlayerEditorModalState();
  finishWirePerf();
  finishRenderPerf({ players: sortedPlayers.length, unresolvedImages: unresolvedImageIds.length });

}''')

          path.write_text(text)
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('game.html').read_text()
          required = [
              'game.renderPlayers"',
              'game.renderPlayers.computeTodayPoints',
              'game.renderPlayers.calcYouStats',
              'game.renderPlayers.buildPlayerHistoryStats',
              'game.renderPlayers.computeCanonicalRankings',
              'game.renderPlayers.sort',
              'game.renderPlayers.domBuild',
              'game.renderPlayers.wireControls'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'missing markers: {missing}')
          PY
          git diff --check
      - name: Commit final Step 4A diagnostic patch
        shell: bash
        run: |
          rm .github/workflows/step4a-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html .github/workflows/step4a-patch.yml
          git commit -m "Trace Players initial render phases"
          git push origin HEAD:agent/step4a-players-render-trace
