name: Temporary Atomic Storage Contract Check

on:
  push:
    branches:
      - 'fix/atomic-storage-replacement-20260914'
    paths:
      - '.github/workflows/temporary-atomic-storage-contract-check.yml'

permissions:
  contents: read

jobs:
  focused-storage-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-storage-replacement-20260914
      - name: Run atomic replacement and storage safety contracts
        run: >-
          node --test
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
          tests/phase2_reset_hook.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase5b_deferred_mirror_contract.test.js
