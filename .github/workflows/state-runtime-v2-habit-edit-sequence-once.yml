name: State Runtime V2 Habit Edit Pilot Sequence Once

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
    paths:
      - '.github/workflows/state-runtime-v2-habit-edit-sequence-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/state-runtime-v2-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply V2 Habit edit pilot sequence fix
        run: python scripts/apply_v2_habit_edit_pilot_sequence_fix.py
      - name: Run focused Habit edit and pilot ownership contracts
        run: >-
          node --test
          tests/state_runtime_v2_habit_edit_contract.test.js
          tests/state_runtime_v2_pilot_compatibility_boundary_contract.test.js
          tests/state_runtime_v2_pilot_parity_scope_contract.test.js
          tests/state_runtime_v2_compatibility_snapshot_contract.test.js
          tests/state_runtime_v2_atomic_contract.test.js
          tests/state_runtime_v2_failure_isolation_contract.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_runtime_v2.js
          git commit -m "Keep Habit edit sequences inside the V2 pilot"
          git push origin HEAD:arch/state-runtime-v2-plan
