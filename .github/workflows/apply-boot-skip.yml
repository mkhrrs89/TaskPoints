name: Apply boot animation skip

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded boot skip patch
        run: python scripts/apply_boot_skip.py

      - name: Run focused checks
        run: |
          node --test tests/boot_animation_skip_contract.test.js
          node --test tests/home_first_paint_maintenance.test.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/boot_animation_skip_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Allow skipping the opening animation"
          git push
