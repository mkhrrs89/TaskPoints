name: Apply Phase 4 write recovery hotfix

on:
  push:
    branches:
      - codex/phase-4-write-recovery-hotfix

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-write-recovery-hotfix
          fetch-depth: 0

      - name: Apply hotfix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('phase4_storage_coordinator.js')
          text = path.read_text(encoding='utf-8')

          old = """  let queueTail = Promise.resolve();
  let pendingCount = 0;
  let sequence = 0;
  let verifiedPrimaryCache = null;
"""
          new = """  let queueTail = Promise.resolve();
  let pendingCount = 0;
  let sequence = 0;
  let verifiedPrimaryCache = null;
  let writeLoopRunning = false;
  let requestedWriteRevision = 0;
  let latestWriteOptions = {};
  const MAX_RETRYABLE_ATTEMPTS = 2;
  const RETRY_BASE_DELAY_MS = 250;
  const TRANSACTION_TIMEOUT_MS = 20000;
  const RETRYABLE_WRITE_REASONS = new Set([
    'indexeddb_request_failed',
    'indexeddb_request_timeout',
    'indexeddb_transaction_aborted',
    'indexeddb_transaction_timeout',
    'indexeddb_open_failed',
    'indexeddb_open_blocked',
    'indexeddb_open_timeout',
    'TransactionInactiveError',
    'UnknownError',
    'AbortError'
  ]);
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function safeGet(key) {
    try { return global.localStorage?.getItem?.(key) ?? null; } catch (_) { return null; }
  }
"""
          new = """  function safeGet(key) {
    try { return global.localStorage?.getItem?.(key) ?? null; } catch (_) { return null; }
  }
  function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
  function storageError(code, cause = null) {
    const error = new Error(code);
    error.code = code;
    error.cause = cause || null;
    return error;
  }
  function normalizedErrorReason(error) {
    const code = String(error?.code || '').trim();
    if (code) return code;
    const name = String(error?.name || '').trim();
    if (name && name !== 'Error') return name;
    return String(error?.message || error || 'phase4_write_failed');
  }
  function isRetryableWriteReason(reason) {
    return RETRYABLE_WRITE_REASONS.has(String(reason || ''));
  }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function requestPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('IndexedDB request failed'));
    });
  }
  function transactionPromise(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onabort = () => reject(tx.error || new Error('IndexedDB transaction aborted'));
      tx.onerror = () => reject(tx.error || new Error('IndexedDB transaction failed'));
    });
  }
"""
          new = """  function requestPromise(request) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        callback(value);
      };
      const timer = setTimeout(() => finish(reject, storageError('indexeddb_request_timeout')), TRANSACTION_TIMEOUT_MS);
      request.onsuccess = () => finish(resolve, request.result);
      request.onerror = () => finish(reject, storageError('indexeddb_request_failed', request.error));
    });
  }
  function transactionPromise(tx) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        callback(value);
      };
      const timer = setTimeout(() => {
        try { tx.abort?.(); } catch (_) {}
        finish(reject, storageError('indexeddb_transaction_timeout', tx.error));
      }, TRANSACTION_TIMEOUT_MS);
      tx.oncomplete = () => finish(resolve);
      tx.onabort = () => finish(reject, storageError('indexeddb_transaction_aborted', tx.error));
      // A request error bubbles through the transaction before Safari reports
      // abort/complete. Wait for the terminal event instead of failing early.
      tx.onerror = () => undefined;
    });
  }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function openShadowDb(indexedDb = global.indexedDB) {
    if (!indexedDb) return Promise.reject(new Error('indexeddb_unavailable'));
    return new Promise((resolve, reject) => {
      const request = indexedDb.open(core.SHADOW_MIGRATION_DB_NAME, core.SHADOW_MIGRATION_DB_VERSION || 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        [...ARRAY_STORES, 'collections'].forEach((name) => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'key' });
        });
        if (!db.objectStoreNames.contains('values')) db.createObjectStore('values', { keyPath: 'field' });
        if (!db.objectStoreNames.contains('metadata')) db.createObjectStore('metadata', { keyPath: 'id' });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error('shadow_db_open_failed'));
    });
  }
"""
          new = """  function openShadowDb(indexedDb = global.indexedDB) {
    if (!indexedDb) return Promise.reject(storageError('indexeddb_open_failed'));
    return new Promise((resolve, reject) => {
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        callback(value);
      };
      const timer = setTimeout(() => finish(reject, storageError('indexeddb_open_timeout')), TRANSACTION_TIMEOUT_MS);
      const request = indexedDb.open(core.SHADOW_MIGRATION_DB_NAME, core.SHADOW_MIGRATION_DB_VERSION || 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        [...ARRAY_STORES, 'collections'].forEach((name) => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'key' });
        });
        if (!db.objectStoreNames.contains('values')) db.createObjectStore('values', { keyPath: 'field' });
        if (!db.objectStoreNames.contains('metadata')) db.createObjectStore('metadata', { keyPath: 'id' });
      };
      request.onsuccess = () => finish(resolve, request.result);
      request.onerror = () => finish(reject, storageError('indexeddb_open_failed', request.error));
      request.onblocked = () => finish(reject, storageError('indexeddb_open_blocked'));
    });
  }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """      const previous = readDiagnostics();
      const reason = String(error?.message || error || 'phase4_write_failed');
      const deferred = new Set([
        'pending_habit_journal',
        'dual_write_pending',
        'mirror_changed_during_verification'
      ]).has(reason);
      return writeDiagnostics({
"""
          new = """      const previous = readDiagnostics();
      const reason = normalizedErrorReason(error);
      const retryAttempt = Number(options.retryAttempt) || 0;
      const willRetry = isRetryableWriteReason(reason) && retryAttempt < MAX_RETRYABLE_ATTEMPTS;
      const deferred = willRetry || new Set([
        'pending_habit_journal',
        'dual_write_pending',
        'mirror_changed_during_verification'
      ]).has(reason);
      return writeDiagnostics({
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = """  function queueWrite(options = {}) {
    if (getMode() === 'off' && options.force !== true) return Promise.resolve({ status: 'off' });
    const writeSequence = nextSequence();
    pendingCount += 1;
    writeDiagnostics({ latestQueuedSequence: writeSequence, pendingWrites: pendingCount });
    const operation = queueTail
      .catch(() => undefined)
      .then(() => performWrite({ ...options, sequence: writeSequence }))
      .finally(() => {
        pendingCount = Math.max(0, pendingCount - 1);
        writeDiagnostics({ pendingWrites: pendingCount });
      });
    queueTail = operation.then(() => undefined, () => undefined);
    return operation;
  }
  function flushWrites() { return queueTail.catch(() => undefined); }
"""
          new = """  async function runWriteLoop() {
    let retryAttempt = 0;
    try {
      while (getMode() !== 'off') {
        const targetRevision = requestedWriteRevision;
        const writeSequence = nextSequence();
        writeDiagnostics({ latestQueuedSequence: writeSequence, pendingWrites: 1 });
        const result = await performWrite({
          ...latestWriteOptions,
          sequence: writeSequence,
          retryAttempt
        });
        const reason = result?.lastFallbackReason || null;
        if (isRetryableWriteReason(reason) && retryAttempt < MAX_RETRYABLE_ATTEMPTS && getMode() !== 'off') {
          retryAttempt += 1;
          await delay(RETRY_BASE_DELAY_MS * retryAttempt);
          continue;
        }
        retryAttempt = 0;
        if (requestedWriteRevision === targetRevision) break;
      }
    } finally {
      pendingCount = 0;
      writeLoopRunning = false;
      writeDiagnostics({ pendingWrites: 0 });
    }
  }

  function queueWrite(options = {}) {
    if (getMode() === 'off' && options.force !== true) return Promise.resolve({ status: 'off' });
    requestedWriteRevision += 1;
    latestWriteOptions = { ...latestWriteOptions, ...options };
    if (writeLoopRunning) return queueTail;

    writeLoopRunning = true;
    pendingCount = 1;
    writeDiagnostics({ pendingWrites: 1 });
    queueTail = Promise.resolve()
      .then(runWriteLoop)
      .catch((error) => {
        const previous = readDiagnostics();
        writeDiagnostics({
          effectiveSource: 'localStorage',
          lastFallbackAt: nowIso(),
          lastFallbackReason: normalizedErrorReason(error),
          verificationFailuresTotal: (Number(previous.verificationFailuresTotal) || 0) + 1
        });
      });
    return queueTail;
  }
  function flushWrites() { return queueTail.catch(() => undefined); }
"""
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          status_path = Path('phase4_storage_status.html')
          status = status_path.read_text(encoding='utf-8')
          old = """    document.getElementById('refresh').addEventListener('click', render);
"""
          new = """    document.getElementById('refresh').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = 'Checking…';
      try {
        const core = window.TaskPointsCore;
        const status = core?.getPhase4StorageStatus?.() || {};
        const needsRecovery = status.configuredMode !== 'off' && (
          status.lastFallbackReason
          || Number(status.latestQueuedSequence || 0) > Number(status.latestPassedSequence || 0)
        );
        if (needsRecovery) {
          core?.resumePhase4DeferredWrite?.();
          core?.queuePhase4PrimaryWrite?.({ reason: 'manual_status_refresh' });
          await core?.flushPhase4PrimaryWrites?.();
        }
      } finally {
        render();
        button.disabled = false;
        button.textContent = originalText;
      }
    });
"""
          assert status.count(old) == 1
          status = status.replace(old, new, 1)
          status_path.write_text(status, encoding='utf-8')

          tests_path = Path('tests/phase4_storage_contract.test.js')
          tests = tests_path.read_text(encoding='utf-8')
          tests = tests.replace('  let failNextTransaction = false;', '  let failTransactionCount = 0;', 1)
          tests = tests.replace(
            """      if (failNextTransaction) {
        failNextTransaction = false;
        throw new Error('forced_transaction_failure');
      }
""",
            """      if (failTransactionCount > 0) {
        failTransactionCount -= 1;
        throw new Error('forced_transaction_failure');
      }
""",
            1
          )
          tests = tests.replace(
            '    failNextTransaction() { failNextTransaction = true; }',
            '    failNextTransaction(count = 1) { failTransactionCount += Math.max(1, Number(count) || 1); }',
            1
          )
          tests = tests.replace('  harness.indexedDB.failNextTransaction();', '  harness.indexedDB.failNextTransaction(5);', 1)
          append = r'''

test('a transient IndexedDB transaction failure retries and settles without a verification failure', async () => {
  const harness = await install({ mode: 'verify_primary_writes' });
  harness.indexedDB.failNextTransaction();
  harness.localStorage.setItem(STORAGE_KEY, JSON.stringify(fixture(17)));
  await harness.core.flushPhase4PrimaryWrites();

  const status = harness.core.getPhase4StorageStatus();
  assert.equal(status.latestQueuedSequence, status.latestPassedSequence, JSON.stringify(status));
  assert.equal(status.pendingWrites, 0);
  assert.equal(status.lastFallbackReason, null);
  assert.equal(status.verificationFailuresTotal, 0);
  assert.equal(status.deferredWritesTotal > 0, true);
});

test('a burst of mirror writes is coalesced into a small number of verified transactions', async () => {
  const harness = await install({ mode: 'verify_primary_writes' });
  for (let version = 20; version < 40; version += 1) {
    harness.localStorage.setItem(STORAGE_KEY, JSON.stringify(fixture(version)));
  }
  await harness.core.flushPhase4PrimaryWrites();

  const status = harness.core.getPhase4StorageStatus();
  assert.equal(status.latestQueuedSequence, status.latestPassedSequence, JSON.stringify(status));
  assert.equal(status.latestQueuedSequence <= 3, true, JSON.stringify(status));
  assert.equal(status.pendingWrites, 0);
  assert.equal(JSON.parse(harness.localStorage.getItem(STORAGE_KEY)).tasks[0].id, 'task-39');
});
'''
          if 'a transient IndexedDB transaction failure retries' not in tests:
            tests += append
          tests_path.write_text(tests, encoding='utf-8')

          ui_test = Path('tests/phase4_status_recovery_contract.test.js')
          ui_test.write_text(r'''const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

test('Phase 4 Refresh performs recovery rather than only repainting status', () => {
  const html = fs.readFileSync(path.join(__dirname, '..', 'phase4_storage_status.html'), 'utf8');
  assert.match(html, /manual_status_refresh/);
  assert.match(html, /flushPhase4PrimaryWrites/);
  assert.match(html, /Checking…/);
});
''', encoding='utf-8')
          PY

      - name: Validate hotfix
        shell: bash
        run: |
          node --check phase4_storage_coordinator.js
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js tests/phase4_journal_recovery_contract.test.js tests/phase4_status_recovery_contract.test.js
          npm test

      - name: Commit clean hotfix
        shell: bash
        run: |
          rm .github/workflows/apply-phase4-write-recovery-hotfix.yml
          rm -f .github/phase4-write-recovery-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js phase4_storage_status.html tests/phase4_storage_contract.test.js tests/phase4_status_recovery_contract.test.js .github/workflows/apply-phase4-write-recovery-hotfix.yml .github/phase4-write-recovery-trigger.txt
          git diff --cached --check
          git commit -m "Fix Phase 4 write recovery and coalescing"
          git push origin HEAD:codex/phase-4-write-recovery-hotfix
