name: Step 5B diagnostic patch

on:
  push:
    branches:
      - agent/step5b-save-pipeline-trace

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5b-save-pipeline-trace
          fetch-depth: 0

      - name: Add focused interaction diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('scoring_core.js')
          text = core.read_text()

          old = """  function packTaskPointsStorageState(state) {
    if (!state || typeof state !== 'object' || Array.isArray(state)) return state;
    const packed = { ...state };
"""
          new = """  function packTaskPointsStorageState(state) {
    if (!state || typeof state !== 'object' || Array.isArray(state)) return state;
    const perfEnd = global.TaskPointsPerf?.span?.('savePipeline.packTaskPointsStorageState', {
      completions: Array.isArray(state.completions) ? state.completions.length : 0,
      matchups: Array.isArray(state.matchups) ? state.matchups.length : 0,
      gameHistory: Array.isArray(state.gameHistory) ? state.gameHistory.length : 0,
      tasks: Array.isArray(state.tasks) ? state.tasks.length : 0
    });
    const packed = { ...state };
"""
          assert text.count(old) == 1, 'pack start target missing/ambiguous'
          text = text.replace(old, new, 1)

          old = """    return packed;
  }

  function unpackTaskPointsStorageState(rawState) {
"""
          new = """    perfEnd?.({ packedArrayCount: Object.keys(packedArrays).length, outcome: 'return' });
    return packed;
  }

  function unpackTaskPointsStorageState(rawState) {
"""
          assert text.count(old) == 1, 'pack end target missing/ambiguous'
          text = text.replace(old, new, 1)

          old = """  function compressStorageString(rawJson) {
    return TaskPointsLZString.compressToUTF16(String(rawJson || ''));
  }
"""
          new = """  function compressStorageString(rawJson) {
    const input = String(rawJson || '');
    const perfEnd = global.TaskPointsPerf?.span?.('savePipeline.compressStorageString', { inputLength: input.length });
    const output = TaskPointsLZString.compressToUTF16(input);
    perfEnd?.({ outputLength: output.length, outcome: 'return' });
    return output;
  }
"""
          assert text.count(old) == 1, 'compress target missing/ambiguous'
          text = text.replace(old, new, 1)

          old = """function buildOptimizedTaskPointsStorageRaw(state) {
  const packedState = packTaskPointsStorageState(state);
"""
          new = """function buildOptimizedTaskPointsStorageRaw(state) {
  const perfEnd = global.TaskPointsPerf?.span?.('savePipeline.buildOptimizedTaskPointsStorageRaw', {
    completions: Array.isArray(state?.completions) ? state.completions.length : 0,
    tasks: Array.isArray(state?.tasks) ? state.tasks.length : 0
  });
  const packedState = packTaskPointsStorageState(state);
"""
          assert text.count(old) == 1, 'build start target missing/ambiguous'
          text = text.replace(old, new, 1)

          old = """  return {
    packedState,
    packedRawJson,
    compressedWrapperRaw,
    chosenRaw,
    chosenEncoding: useCompressed
      ? TASKPOINTS_STORAGE_ENCODING_LZ16_PACKED_V1
      : (packedState?.__packedArrays ? 'packed-json' : 'plain-json'),
    packedRawChars: packedRawJson.length,
    compressedRawChars: compressedWrapperRaw.length,
    chosenChars: chosenRaw.length,
    chosenBytes: chosenRaw.length * 2
  };
}
"""
          new = """  const plan = {
    packedState,
    packedRawJson,
    compressedWrapperRaw,
    chosenRaw,
    chosenEncoding: useCompressed
      ? TASKPOINTS_STORAGE_ENCODING_LZ16_PACKED_V1
      : (packedState?.__packedArrays ? 'packed-json' : 'plain-json'),
    packedRawChars: packedRawJson.length,
    compressedRawChars: compressedWrapperRaw.length,
    chosenChars: chosenRaw.length,
    chosenBytes: chosenRaw.length * 2
  };
  perfEnd?.({
    packedRawChars: plan.packedRawChars,
    compressedRawChars: plan.compressedRawChars,
    chosenChars: plan.chosenChars,
    chosenEncoding: plan.chosenEncoding,
    outcome: 'return'
  });
  return plan;
}
"""
          assert text.count(old) == 1, 'build end target missing/ambiguous'
          text = text.replace(old, new, 1)
          core.write_text(text)

          perf = Path('performance_diagnostics.js')
          text = perf.read_text()
          old = "  const desc=t=>!t?'':`${String(t.tagName||'').toLowerCase()}${t.id?`#${t.id}`:''}`.slice(0,100);\n"
          new = """  const desc=t=>{if(!t)return '';const tag=String(t.tagName||'').toLowerCase(),id=t.id?`#${t.id}`:'',cls=String(t.className||'').trim().split(/\\s+/).filter(Boolean).slice(0,3).map(x=>`.${x}`).join(''),attrs=[];for(const a of['data-del-id','data-task-id','data-action','data-cat','data-datekey','aria-label','title']){const v=t.getAttribute?.(a);if(v)attrs.push(`[${a}=${String(v).slice(0,45)}]`)}const label=String(t.textContent||'').trim().replace(/\\s+/g,' ').slice(0,55);return `${tag}${id}${cls}${attrs.join('')}${label?` \\"${label}\\"`:''}`.slice(0,220)};
"""
          assert text.count(old) == 1, 'descriptor target missing/ambiguous'
          text = text.replace(old, new, 1)

          anchor = "  function pendingNav(){"
          insert = """  function dialogTrace(){if(typeof global.confirm!=='function'||global.confirm.__tpPerfWrapped)return;const orig=global.confirm.bind(global),w=function(message){const st=now();try{return orig(message)}finally{duration('browser.confirm',now()-st,{message:String(message||'').slice(0,120)})}};Object.defineProperty(w,'__tpPerfWrapped',{value:true});global.confirm=w}
  function clickPaintTrace(){const d=global.document;if(!d?.addEventListener)return;d.addEventListener('click',e=>{if(!relevant(e.target))return;const target=e.target?.closest?.('a,button,input,textarea,select,.scoreV2-cell,.habitDay')||e.target,label=desc(target),st=now();global.requestAnimationFrame?.(()=>duration('interaction.click.toNextPaint',now()-st,{target:label}))},true)}
"""
          assert text.count(anchor) == 1, 'pendingNav anchor missing/ambiguous'
          text = text.replace(anchor, insert + anchor, 1)

          old = "mark('trace.enabled',{path:page.path});pendingNav();storageTrace();jsonTrace();cloneTrace();idbTrace();interactions();observers();watchdog();navTiming();"
          new = "mark('trace.enabled',{path:page.path});pendingNav();storageTrace();jsonTrace();cloneTrace();idbTrace();interactions();dialogTrace();clickPaintTrace();observers();watchdog();navTiming();"
          assert text.count(old) == 1, 'startup hook target missing/ambiguous'
          text = text.replace(old, new, 1)
          perf.write_text(text)
          PY

      - name: Validate patch
        run: |
          node --check scoring_core.js
          node --check performance_diagnostics.js
          git diff --check
          grep -q "savePipeline.compressStorageString" scoring_core.js
          grep -q "browser.confirm" performance_diagnostics.js
          grep -q "interaction.click.toNextPaint" performance_diagnostics.js

      - name: Commit diagnostics and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/step5b-patch.yml
          git add scoring_core.js performance_diagnostics.js
          git commit -m "Trace interaction save pipeline"
          git push origin HEAD:agent/step5b-save-pipeline-trace
