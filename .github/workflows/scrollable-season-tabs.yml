name: Apply scrollable season tabs

on:
  push:
    branches:
      - feature/scrollable-season-tabs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scrollable-season-tabs
          fetch-depth: 0

      - name: Keep season tabs on one scrollable row
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'rankings.html': (
                  ".rankingsScopeTabs{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  flex-wrap:wrap;\n}",
                  ".rankingsScopeTabs{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  flex-wrap:nowrap;\n  width:100%;\n  overflow-x:auto;\n  overflow-y:hidden;\n  -webkit-overflow-scrolling:touch;\n}\n"
              ),
              'standings.html': (
                  ".standingsScopeTabs{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  flex-wrap:wrap;\n}",
                  ".standingsScopeTabs{\n  display:flex;\n  align-items:center;\n  gap:8px;\n  flex-wrap:nowrap;\n  width:100%;\n  overflow-x:auto;\n  overflow-y:hidden;\n  -webkit-overflow-scrolling:touch;\n}\n"
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: expected one scope-tab row block, found {text.count(old)}')
              text = text.replace(old, new)
              tab_class = '.rankingsScopeTab{' if filename == 'rankings.html' else '.standingsScopeTab{'
              marker = '  cursor:pointer;\n}'
              start = text.index(tab_class)
              end = text.index('}\n', start) + 2
              block = text[start:end]
              if marker not in block:
                  raise SystemExit(f'{filename}: tab button block marker missing')
              block = block.replace(marker, '  cursor:pointer;\n  flex:0 0 auto;\n  white-space:nowrap;\n}')
              text = text[:start] + block + text[end:]
              path.write_text(text)

          for filename, cls in [('rankings.html', 'rankingsScopeTabs'), ('standings.html', 'standingsScopeTabs')]:
              text = Path(filename).read_text()
              assert f'.{cls}' in text
              assert 'flex-wrap:nowrap;' in text
              assert 'overflow-x:auto;' in text
              assert '-webkit-overflow-scrolling:touch;' in text
              assert 'flex:0 0 auto;' in text
              assert 'white-space:nowrap;' in text
              assert 'flex-wrap:wrap;' not in text[text.index(f'.{cls}'):text.index(f'.{cls}') + 240]
          PY

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/scrollable-season-tabs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rankings.html standings.html .github/workflows/scrollable-season-tabs.yml
          git commit -m "Keep season tabs in one scrollable row"
          git push origin HEAD:feature/scrollable-season-tabs
