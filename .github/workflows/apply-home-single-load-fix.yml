name: Apply Home single-load fix

on:
  push:
    branches:
      - fix/home-single-initial-load
    paths:
      - .github/workflows/apply-home-single-load-fix.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Remove the redundant initial post-paint reload
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          original = path.read_text(encoding="utf-8")
          old = """// then do the heavier sync after paint / idle
          requestAnimationFrame(() => {
            const runPostPaintRefresh = () => {
              refreshMainPageFromStorage();
              if (window.TP_DEBUG_PERF) {
                const completions = Array.isArray(state?.completions) ? state.completions.length : 0;
                console.log(`[TP home boot] post-refresh completions=${completions}`);
              }
            };

            if (window.requestIdleCallback) {
              requestIdleCallback(runPostPaintRefresh, { timeout: 800 });
            } else {
              setTimeout(runPostPaintRefresh, 0);
            }
          });
          """
          matches = original.count(old)
          if matches == 0 and "runPostPaintRefresh" not in original:
              print("Home startup refresh block is already removed.")
          elif matches != 1:
              raise SystemExit(f"Expected exactly one current startup refresh block; found {matches}")
          else:
              updated = original.replace(old, "", 1)
              if "runPostPaintRefresh" in updated:
                  raise SystemExit("Safety check failed: startup refresh callback still exists")
              if "function refreshMainPageFromStorage" not in updated:
                  raise SystemExit("Safety check failed: refreshMainPageFromStorage must remain")
              if "maybeAutoSimToday()" not in updated:
                  raise SystemExit("Safety check failed: auto-simulation must remain")
              path.write_text(updated, encoding="utf-8")

      - name: Commit the focused change when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "Avoid duplicate Home startup reload"
          git push
