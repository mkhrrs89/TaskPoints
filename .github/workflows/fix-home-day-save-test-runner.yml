name: Fix Home day-save test runner

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Correct focused test harness
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/address-home-day-save-review.yml')
          text = path.read_text(encoding='utf-8')

          extractor_old = "            const braceStart = source.indexOf('{', start);"
          extractor_new = "            const closeParen = source.indexOf(')', start);\n            const braceStart = source.indexOf('{', closeParen);"
          if extractor_new not in text:
            if text.count(extractor_old) != 1:
              raise SystemExit('Expected one function extractor marker')
            text = text.replace(extractor_old, extractor_new, 1)

          runtime_old = '''              readHomeStateRevision() { return this.currentRevision; },
                        readHomeGameDayKey() { return this.currentGameDayKey; },
                        refreshMainPageFromStorage() { this.refreshCount += 1; return true; },'''
          runtime_new = '''              readHomeStateRevision() { return currentRevision; },
                        readHomeGameDayKey() { return currentGameDayKey; },
                        refreshMainPageFromStorage() { refreshCount += 1; return true; },'''
          if runtime_new not in text:
            if text.count(runtime_old) != 1:
              raise SystemExit('Expected one VM runtime marker')
            text = text.replace(runtime_old, runtime_new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit runner correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/address-home-day-save-review.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Home review test harness"
          git pull --rebase origin fix/home-revision-aware-refresh
          git push
