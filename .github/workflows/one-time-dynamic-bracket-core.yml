name: One-time dynamic bracket core

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'agent/build-a-bracket-page' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-a-bracket-page
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: python3 .github/scripts/patch_dynamic_bracket_core.py
      - run: |
          set -euo pipefail
          rm -f .github/scripts/patch_dynamic_bracket_core.py .github/automation-triggers/build-a-bracket.txt
          git diff --check
          node -c scoring_core.js
          node -c season_bracket_builder_core.js
          node -c season_bracket_builder.js
          node -c season_bracket_builder_entry.js
          node --test tests/season_bracket_builder.test.js
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- scoring_core.js .github/scripts/patch_dynamic_bracket_core.py .github/automation-triggers/build-a-bracket.txt
          git commit -m "Support dynamic Season brackets"
          git push origin HEAD:agent/build-a-bracket-page
