name: step3i-patch
on:
  push:
    branches:
      - agent/step3i-lightweight-upset-check
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step3i-lightweight-upset-check
      - name: Apply and test Step 3I
        run: |
          node .github/step3i-patch.js
          node --check season_series_upset_notifications.js
          node --test tests/season_series_upset_reconciliation_loop.test.js tests/step3h_upset_reconcile_quiet.test.js tests/step3i_upset_lightweight_passive.test.js
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season_series_upset_notifications.js tests/step3i_upset_lightweight_passive.test.js
          git rm .github/step3i-patch.js .github/workflows/step3i-patch.yml
          git commit -m "Make passive upset reconciliation lightweight"
          git push origin HEAD:agent/step3i-lightweight-upset-check
