name: Habit Guard Load Chain Once
on:
  push:
    branches:
      - fix/habit-guard-previous-read-fastpath-20260915
jobs:
  integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/habit-guard-previous-read-fastpath-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run load/save chain integration tests
        run: |
          node --test tests/phase3_read_path.test.js
          node --test tests/phase3_navigation_cache.test.js
          node --test tests/phase4_read_contract.test.js
          node --test tests/phase4_storage_contract.test.js
          node --test tests/phase5a_native_snapshot_contract.test.js
          node --test tests/home_indexeddb_first_boot_contract.test.js
          node --test tests/step3e_startup_storage.test.js
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/habit-guard-load-chain-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Confirm habit guard load-chain integration'
          git push
