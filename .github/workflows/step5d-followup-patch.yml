name: step5d-followup-patch
on:
  push:
    branches:
      - agent/step5d-longer-compaction-quiet
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5d-longer-compaction-quiet
      - name: Apply follow-up patch
        run: python scripts/step5d_followup_patch.py
      - name: Run focused tests
        run: |
          node --check task_mutation_journal.js
          node --test tests/task_mutation_journal_contract.test.js
          git diff --check
      - name: Commit clean Step 5D follow-up
        run: |
          rm scripts/step5d_followup_patch.py
          rm .github/workflows/step5d-followup-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add task_mutation_journal.js tests/task_mutation_journal_contract.test.js scripts/step5d_followup_patch.py .github/workflows/step5d-followup-patch.yml
          git commit -m 'Reset task compaction preflight on newer mutations'
          git push origin HEAD:agent/step5d-longer-compaction-quiet
