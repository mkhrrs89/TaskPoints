name: Perf Inbox Main Focused Once

on:
  push:
    branches:
      - perf/inbox-journal-write-churn-main-20260915
    paths:
      - '.github/workflows/perf-inbox-main-focused-once.yml'

jobs:
  focused-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/inbox-journal-write-churn-main-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run focused Inbox, Gold, and storage safety contracts
        run: >-
          node --test
          tests/inbox_mutation_journal_fast_path.test.js
          tests/inbox_population_fast_path.test.js
          tests/season_series_upset_reconciliation_loop.test.js
          tests/inbox_series_upset_notification.test.js
          tests/inbox_gold_theft_delivery_race.test.js
          tests/inbox_gold_theft_top50_notification.test.js
          tests/task_create_fast_path.test.js
          tests/greed_gold_home_live_state_fast_path.test.js
          tests/greed_gold_economy.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
