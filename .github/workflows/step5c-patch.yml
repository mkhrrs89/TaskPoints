name: step5c-patch
on:
  push:
    branches: [agent/step5c-task-mutation-journal]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5c-task-mutation-journal
      - name: Apply Step 5C patch
        run: python tools/step5c_patch.py
      - name: Run focused tests
        run: |
          node --check task_mutation_journal.js
          node --test tests/task_mutation_journal_contract.test.js
          git diff --check
      - name: Commit Step 5C
        run: |
          rm -f tools/step5c_patch.py .github/workflows/step5c-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Defer task mutation snapshot compression'
          git push origin HEAD:agent/step5c-task-mutation-journal
