name: State Runtime V2 Rollout Diagnostics

on:
  push:
    branches:
      - arch/state-runtime-v2-plan

permissions:
  contents: read

jobs:
  isolate-rollout-assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check live-main CI gate shape
        run: node --test --test-name-pattern="branch CI gates" tests/state_runtime_v2_rollout_gate_contract.test.js
      - name: Check default-off authority guard
        run: node --test --test-name-pattern="default-off and preview-only" tests/state_runtime_v2_rollout_gate_contract.test.js
      - name: Check production-host opt-in guard
        run: node --test --test-name-pattern="production hostnames" tests/state_runtime_v2_rollout_gate_contract.test.js
