name: Today Score Island Sync Patch
on:
  push:
    branches: [fix/today-score-island-sync-20260914]
    paths: [.github/workflows/temporary-today-score-island-sync-v2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-score-island-sync-20260914
          fetch-depth: 0
      - run: python .github/scripts/patch_today_score_island_sync.py
      - run: node --test tests/home_today_score_island_sync.test.js tests/home_scoreboard_rank_gold.test.js tests/home_scoreboard_season3_scope.test.js
      - run: |
          git config user.name "TaskPoints Score Sync Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temporary-today-score-island-sync.yml .github/workflows/temporary-today-score-island-sync-v2.yml .github/scripts/patch_today_score_island_sync.py
          git add index.html tests/home_today_score_island_sync.test.js
          git commit -m "Keep floating Today score synced with scoreboard"
          git push origin HEAD:fix/today-score-island-sync-20260914
