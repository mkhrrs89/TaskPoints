name: Step 3E toolbar maintenance patch

on:
  push:
    branches:
      - agent/step3e-startup-storage
    paths:
      - .github/workflows/step3e-toolbar-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step3e-startup-storage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Defer non-Home toolbar maintenance behind shared quiet gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('toolbar.js')
          source = path.read_text()
          pattern = re.compile(
              r"  if \(!isMainPagePathname\(window\.location\.pathname\)\) \{\s+run\(\);\s+return;\s+\}",
              re.MULTILINE,
          )
          new = """  if (!isMainPagePathname(window.location.pathname)) {
            const gate = window.TaskPointsCore?.whenStorageMaintenanceQuiet;
            if (typeof gate === 'function') {
              Promise.resolve(gate(run, { reason: 'toolbar_background_maintenance' }))
                .catch(() => window.setTimeout(run, 5000));
            } else {
              // Preserve eventual maintenance if the shared gate is unavailable.
              window.setTimeout(run, 5000);
            }
            return;
          }"""
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one immediate non-Home toolbar maintenance block, found {len(matches)}')
          path.write_text(pattern.sub(new, source, count=1))

          test = Path('tests/step3e_toolbar_maintenance_quiet.test.js')
          test.write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const source = fs.readFileSync(path.join(__dirname, '..', 'toolbar.js'), 'utf8');

          test('non-Home shared toolbar maintenance waits for the Step 3E quiet gate', () => {
            const start = source.indexOf('function scheduleTaskPointsToolbarMaintenance()');
            const end = source.indexOf('function initToolbarNow()', start);
            assert.ok(start >= 0 && end > start, 'toolbar maintenance scheduler should exist');
            const scheduler = source.slice(start, end);
            assert.match(scheduler, /if \(!isMainPagePathname\(window\.location\.pathname\)\)/);
            assert.match(scheduler, /TaskPointsCore\?\.whenStorageMaintenanceQuiet/);
            assert.match(scheduler, /gate\(run, \{ reason: 'toolbar_background_maintenance' \}\)/);
            assert.doesNotMatch(scheduler, /if \(!isMainPagePathname\(window\.location\.pathname\)\) \{\s*run\(\);/);
          });

          test('Home and Inbox retain their existing specialized maintenance scheduling', () => {
            const start = source.indexOf('function scheduleTaskPointsToolbarMaintenance()');
            const end = source.indexOf('function initToolbarNow()', start);
            const scheduler = source.slice(start, end);
            assert.match(scheduler, /scheduleTaskPointsInboxAuditAfterStartup\(\)/);
            assert.match(scheduler, /TaskPointsHomeIdleQueue\?\.enqueue/);
            assert.match(scheduler, /home-toolbar-maintenance/);
          });
          ''')
          PY
      - name: Check syntax and focused contracts
        run: |
          node --check toolbar.js
          node --test \
            tests/step3e_toolbar_maintenance_quiet.test.js \
            tests/inbox_first_paint_performance.test.js \
            tests/step3e_startup_storage.test.js \
            tests/step3d_navigation_maintenance.test.js
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js tests/step3e_toolbar_maintenance_quiet.test.js
          git diff --cached --check
          git commit -m "Defer shared toolbar maintenance until quiet"
          git push origin HEAD:agent/step3e-startup-storage
