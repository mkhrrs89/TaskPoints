  try {
    const saved = localStorage.getItem(STANDINGS_SCOPE_STORAGE_KEY);
    if (saved === "season1" || saved === "season2" || saved === "lifetime") return saved;
  } catch (e) {}

  return "season2";
})();''', '''const STANDINGS_SCOPE_STORAGE_KEY = "taskpoints_standings_scope_v1";
