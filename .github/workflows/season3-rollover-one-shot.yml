name: Apply Season 3 rollover patch

on:
  push:
    branches:
      - feature/season-3-rollover

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[season3-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/season-3-rollover
          fetch-depth: 0

      - name: Apply Season 3 rollover
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          # Standings: preserve all existing views, add Season 3, and bound Season 2.
          replace_once('standings.html', '''<div class="standingsScopeTabs mb-3" role="tablist" aria-label="Standings scope">
  <button type="button" class="standingsScopeTab" data-standings-scope="season2">Season 2</button>
  <button type="button" class="standingsScopeTab" data-standings-scope="lifetime">Lifetime</button>
  <button type="button" class="standingsScopeTab" data-standings-scope="season1">Season 1</button>
</div>''', '''<div class="standingsScopeTabs mb-3" role="tablist" aria-label="Standings scope">
  <button type="button" class="standingsScopeTab" data-standings-scope="season3">Season 3</button>
  <button type="button" class="standingsScopeTab" data-standings-scope="season2">Season 2</button>
  <button type="button" class="standingsScopeTab" data-standings-scope="lifetime">Lifetime</button>
  <button type="button" class="standingsScopeTab" data-standings-scope="season1">Season 1</button>
</div>''')

