name: Run Phase 4 cross-page journal recovery fix

on:
  push:
    branches:
      - codex/phase-4-dark-storage

permissions:
  contents: write

jobs:
  run-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-dark-storage
          fetch-depth: 0

      - name: Extract and apply embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-phase4-cross-page-journal-recovery.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_phase4_fix.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_phase4_fix.py

      - name: Validate contracts and full suite
        shell: bash
        run: |
          node --check phase4_storage_coordinator.js
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js
          npm test

      - name: Commit clean final fix
        shell: bash
        run: |
          rm .github/workflows/fix-phase4-cross-page-journal-recovery.yml
          rm .github/workflows/run-phase4-cross-page-journal-recovery.yml
          rm -f .github/phase4_cross_page_fix_trigger.txt .github/phase4_cross_page_fix_trigger_2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js tests/phase4_storage_contract.test.js .github/workflows/fix-phase4-cross-page-journal-recovery.yml .github/workflows/run-phase4-cross-page-journal-recovery.yml .github/phase4_cross_page_fix_trigger.txt .github/phase4_cross_page_fix_trigger_2.txt
          git diff --cached --check
          git commit -m "Fix Phase 4 cross-page journal recovery"
          git push origin HEAD:codex/phase-4-dark-storage
