name: Run Home revision refresh patch

# Updated to trigger the branch-local push workflow.
on:
  push:
    branches:
      - fix/home-revision-aware-refresh
    paths:
      - .github/workflows/run-home-revision-refresh.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded patch
        run: python scripts/apply_home_revision_refresh.py
      - name: Run focused checks
        run: |
          node --check toolbar.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js index.html tests/home_revision_refresh_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Skip unchanged Home lifecycle reloads"
          git push
