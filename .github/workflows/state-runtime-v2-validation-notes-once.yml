name: State Runtime V2 Validation Notes Once

on:
  push:
    branches:
      - arch/state-runtime-v2-plan
    paths:
      - '.github/workflows/state-runtime-v2-validation-notes-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch/state-runtime-v2-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Update preview validation notes
        run: python scripts/apply_v2_validation_ownership_notes.py
      - name: Reconfirm contracts cited by the notes
        run: >-
          node --test
          tests/state_runtime_v2_pilot_compatibility_boundary_contract.test.js
          tests/state_runtime_v2_pilot_parity_scope_contract.test.js
          tests/state_runtime_v2_habit_edit_contract.test.js
          tests/state_runtime_v2_trace_review_contract.test.js
          tests/state_runtime_v2_live_review_contract.test.js
          tests/state_runtime_v2_rollout_gate_contract.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Commit validation notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/state-runtime-v2-preview-validation.md
          git commit -m "Document V2 pilot ownership validation boundary"
          git push origin HEAD:arch/state-runtime-v2-plan
