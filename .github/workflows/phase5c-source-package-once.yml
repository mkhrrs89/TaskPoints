name: Phase5C Source Package Once
on:
  push:
    branches:
      - fix/phase5c-source-package-reuse-20260915
jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase5c-source-package-reuse-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 tmp_patch_phase5c_source_package.py
      - name: Run focused shared-save, Phase 5C, and safety tests
        run: |
          node --test tests/save_pipeline_shared_work_contract.test.js
          node --test tests/phase5c_verified_secondary_contract.test.js
          node --test tests/phase5c_cross_tab_contract.test.js
          node --test tests/phase5c_journal_retry_contract.test.js
          node --test tests/phase5c_navigation_status_contract.test.js
          node --test tests/phase5c_interrupted_and_removal_contract.test.js
          node --test tests/home_phase5c_long_quiet_contract.test.js
          node --test tests/home_indexeddb_first_boot_contract.test.js
          node --test tests/storage_atomic_replace_contract.test.js
          node --test tests/storage_data_loss_fail_closed.test.js
          node --test tests/phase2_reset_hook.test.js
      - name: Verify scope
        run: |
          git diff --check
          git diff -- save_pipeline_shared_work.js phase5b_deferred_mirror.js tests/save_pipeline_shared_work_contract.test.js tests/phase5c_verified_secondary_contract.test.js
      - name: Commit tested patch
        run: |
          rm tmp_patch_phase5c_source_package.py .github/workflows/phase5c-source-package-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reuse shared source package in Phase 5C verification'
          git push
