name: Temporary Today Score Island Sync

on:
  push:
    branches:
      - 'fix/today-score-island-sync-20260914'
    paths:
      - '.github/workflows/temporary-today-score-island-sync.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-score-island-sync-20260914
          fetch-depth: 0

      - name: Keep floating score cache in lockstep with the home scoreboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          old = """const updateTodayScoreIsland = (value) => {
  const islandValueEl = $('todayScoreIslandValue');
  if (islandValueEl) islandValueEl.textContent = value;
};
"""
          new = """const updateTodayScoreIsland = (value) => {
  const displayValue = (value == null || value === '') ? '—' : String(value);
  const islandValueEl = $('todayScoreIslandValue');
  if (islandValueEl) islandValueEl.textContent = displayValue;

  // toolbar.js uses this lightweight cache so the floating island can show the
  // latest Home score on every page. Keep the cache sourced from the exact same
  // already-rounded value rendered by the Home scoreboard; never let an older
  // cached value overwrite the live scoreboard value by 0.1 after startup/focus.
  try {
    const cacheKey = 'tpTodayScore';
    if (displayValue === '—') {
      if (localStorage.getItem(cacheKey) != null) localStorage.removeItem(cacheKey);
    } else if (localStorage.getItem(cacheKey) !== displayValue) {
      localStorage.setItem(cacheKey, displayValue);
    }
  } catch (_) {}
};
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one updateTodayScoreIsland implementation, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          test = Path('tests/home_today_score_island_sync.test.js')
          test.write_text(r'''const fs = require('node:fs');
const path = require('node:path');
const test = require('node:test');
const assert = require('node:assert/strict');
const vm = require('node:vm');

const ROOT = path.join(__dirname, '..');
const HOME = fs.readFileSync(path.join(ROOT, 'index.html'), 'utf8');
const TOOLBAR = fs.readFileSync(path.join(ROOT, 'toolbar.js'), 'utf8');

function extractArrowFunction(source, declaration) {
  const start = source.indexOf(declaration);
  assert.notEqual(start, -1, `expected ${declaration}`);
  const bodyStart = source.indexOf('{', start);
  let depth = 0;
  for (let i = bodyStart; i < source.length; i += 1) {
    if (source[i] === '{') depth += 1;
    if (source[i] === '}' && --depth === 0) {
      const semicolon = source.indexOf(';', i);
      return source.slice(start, semicolon + 1);
    }
  }
  throw new Error(`could not bound ${declaration}`);
}

test('Home scoreboard publishes the exact displayed score to the floating-island cache', () => {
  const source = extractArrowFunction(HOME, 'const updateTodayScoreIsland =');
  assert.match(source, /String\(value\)/);
  assert.match(source, /cacheKey = 'tpTodayScore'/);
  assert.match(source, /localStorage\.setItem\(cacheKey, displayValue\)/);
  assert.doesNotMatch(source, /toFixed\(/, 'cache writer must not independently round the already-formatted scoreboard value');

  const values = new Map([['tpTodayScore', '10.1']]);
  const localStorage = {
    getItem(key) { return values.has(String(key)) ? values.get(String(key)) : null; },
    setItem(key, value) { values.set(String(key), String(value)); },
    removeItem(key) { values.delete(String(key)); }
  };
  const scoreNode = { textContent: '' };
  const context = vm.createContext({
    localStorage,
    $: (id) => id === 'todayScoreIslandValue' ? scoreNode : null,
    String
  });
  vm.runInContext(`${source}; globalThis.updateScore = updateTodayScoreIsland;`, context);

  context.updateScore('10.2');
  assert.equal(scoreNode.textContent, '10.2');
  assert.equal(values.get('tpTodayScore'), '10.2');
});

test('Floating island reads the same tpTodayScore cache the Home scoreboard now publishes', () => {
  assert.match(TOOLBAR, /const key = 'tpTodayScore'/);
  assert.match(TOOLBAR, /localStorage\.getItem\(key\)/);
  assert.match(TOOLBAR, /valueEl\.textContent = \(v == null \|\| v === ''\) \? '—' : v/);
});

test('Home scoreboard passes its already-rounded displayed value into the shared island updater', () => {
  assert.match(HOME, /yourScoreEl\.textContent = safeYourScore\.toFixed\(1\);\s*updateTodayScoreIsland\(safeYourScore\.toFixed\(1\)\);/);
});
''')
          PY

      - name: Run focused score synchronization tests
        run: >-
          node --test
          tests/home_today_score_island_sync.test.js
          tests/home_scoreboard_rank_gold.test.js
          tests/home_scoreboard_season3_scope.test.js

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'TaskPoints Score Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-today-score-island-sync.yml
          git add index.html tests/home_today_score_island_sync.test.js
          git commit -m 'Keep floating Today score synced with scoreboard'
          git push origin HEAD:fix/today-score-island-sync-20260914
