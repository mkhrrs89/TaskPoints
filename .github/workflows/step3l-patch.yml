name: step3l-patch
on:
  push:
    branches: [agent/step3l-trace-canonical-write-caller]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step3l-trace-canonical-write-caller
      - name: Add canonical-write caller tracing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('performance_diagnostics.js')
          s = p.read_text()
          old = "  function storageTrace(){const p=global.Storage?.prototype;if(!p||p.__tpPerfStorageTracing)return;try{Object.defineProperty(p,'__tpPerfStorageTracing',{value:true,configurable:true})}catch(_){return}for(const n of['getItem','setItem','removeItem']){const orig=p[n];if(typeof orig!=='function')continue;p[n]=function(k,v){const st=now();try{return orig.apply(this,arguments)}finally{const ms=now()-st,key=String(k||''),importantWrite=n!=='getItem'&&tracked.has(key);if(!key.startsWith('tp_perf_trace_')&&(ms>=8||importantWrite))duration(`storage.${n}`,ms,{key,valueLength:n==='setItem'&&typeof v==='string'?v.length:null})}}}}\n"
          new = "  function storageWriteCaller(){try{const lines=String(new Error().stack||'').split('\\n').map(x=>String(x||'').trim()).filter(Boolean);const detail={};for(let i=0;i<Math.min(lines.length,7);i+=1)detail[`caller${i}`]=lines[i].slice(0,210);return detail}catch(_){return{}}}\n  function storageTrace(){const p=global.Storage?.prototype;if(!p||p.__tpPerfStorageTracing)return;try{Object.defineProperty(p,'__tpPerfStorageTracing',{value:true,configurable:true})}catch(_){return}for(const n of['getItem','setItem','removeItem']){const orig=p[n];if(typeof orig!=='function')continue;p[n]=function(k,v){const st=now();try{return orig.apply(this,arguments)}finally{const ms=now()-st,key=String(k||''),importantWrite=n!=='getItem'&&tracked.has(key),caller=importantWrite&&key==='taskpoints_v1'?storageWriteCaller():null;if(!key.startsWith('tp_perf_trace_')&&(ms>=8||importantWrite))duration(`storage.${n}`,ms,{key,valueLength:n==='setItem'&&typeof v==='string'?v.length:null,...(caller||{})})}}}}\n"
          if old not in s:
              raise SystemExit('storageTrace target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check performance_diagnostics.js
          git diff --check
      - name: Commit final Step 3L diagnostic patch
        shell: bash
        run: |
          rm .github/workflows/step3l-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performance_diagnostics.js .github/workflows/step3l-patch.yml
          git commit -m 'Trace canonical storage write callers'
          git push origin HEAD:agent/step3l-trace-canonical-write-caller
