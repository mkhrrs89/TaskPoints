name: One-time smooth Matrix minimal

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/smooth-early-matrix-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/smooth-early-matrix-v2
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: python3 .github/scripts/one_time_smooth_matrix.py
      - run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          for file in "${changed[@]}"; do
            case "$file" in
              index.html|.github/scripts/one_time_smooth_matrix.py|.github/automation-triggers/smooth-early-matrix*.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | grep -qx index.html
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- index.html .github/scripts/one_time_smooth_matrix.py .github/automation-triggers
          git commit -m "Smooth early Matrix animation"
          git push origin HEAD:automation/smooth-early-matrix-v2
