name: Apply Phase 4 contract tests

on:
  push:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      STORAGE_B64: 
      READ_B64: 
      WORKER_B64: 
    steps:
      - name: Check out contract branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-4-contract-tests
          fetch-depth: 0

      - name: Write contract tests
        shell: bash
        run: |
          mkdir -p tests
          printf '%s' "$STORAGE_B64" | base64 -d | gzip -d > tests/phase4_storage_contract.test.js
          printf '%s' "$READ_B64" | base64 -d | gzip -d > tests/phase4_read_contract.test.js
          printf '%s' "$WORKER_B64" | base64 -d | gzip -d > tests/phase4_worker_contract.test.js
          node --check tests/phase4_storage_contract.test.js
          node --check tests/phase4_read_contract.test.js
          node --check tests/phase4_worker_contract.test.js

      - name: Commit tests and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-phase4-contract-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js .github/workflows/apply-phase4-contract-tests.yml
          git diff --cached --check
          git commit -m "Add Phase 4 storage contract tests"
          git push origin HEAD:codex/phase-4-contract-tests
