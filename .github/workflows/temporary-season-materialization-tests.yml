name: Temporary Season Materialization Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fix-season-legacy-exhibition-materialization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out untouched main baseline
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create log directory
        run: mkdir -p test-logs
      - name: Run complete main-branch Node test suite
        id: fullsuite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-logs/main-baseline-full-node-suite.log
      - name: Upload baseline test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-materialization-main-baseline-log
          path: test-logs/*.log
          if-no-files-found: error
      - name: Report baseline result
        if: always() && steps.fullsuite.outcome != 'success'
        run: exit 1

# Temporary workflow; remove after the branch is verified.
