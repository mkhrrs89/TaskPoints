name: Temporary Season Materialization Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/fix-season-legacy-exhibition-materialization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create log directory
        run: mkdir -p test-logs
      - name: Run Season 2 recovery regression
        id: season2
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/season2_playin_recovery.test.js 2>&1 | tee test-logs/season2-playin-recovery.log
      - name: Run Season materialization guard regression
        id: guard
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/season_materialization_guard.test.js 2>&1 | tee test-logs/season-materialization-guard.log
      - name: Run complete Node test suite
        id: fullsuite
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-logs/full-node-suite.log
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: season-materialization-test-logs
          path: test-logs/*.log
          if-no-files-found: error
      - name: Report test failure
        if: always() && (steps.season2.outcome != 'success' || steps.guard.outcome != 'success' || steps.fullsuite.outcome != 'success')
        run: exit 1

# Temporary workflow; remove after the branch is verified.
