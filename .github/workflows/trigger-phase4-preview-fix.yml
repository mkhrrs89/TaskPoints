name: Trigger Phase 4 preview fix

on:
  pull_request:
    branches:
      - codex/phase-4-contract-tests

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-dark-storage
          fetch-depth: 0

      - name: Apply embedded fix
        shell: bash
        run: |
          sed -n "/^[[:space:]]*python - <<'PY'$/,/^[[:space:]]*PY$/p" .github/workflows/fix-phase4-preview-findings.yml \
            | sed '1d;$d;s/^          //' > /tmp/phase4-preview-fix.py
          python /tmp/phase4-preview-fix.py

      - name: Validate Phase 4 contracts
        run: node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js

      - name: Validate full suite
        run: npm test

      - name: Commit final fix
        shell: bash
        run: |
          rm .github/workflows/fix-phase4-preview-findings.yml
          rm .github/workflows/trigger-phase4-preview-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4_storage_coordinator.js tests/phase4_storage_contract.test.js .github/workflows/fix-phase4-preview-findings.yml .github/workflows/trigger-phase4-preview-fix.yml
          git diff --cached --check
          git commit -m "Fix Phase 4 preview sequencing and habit retry"
          git push origin HEAD:codex/phase-4-dark-storage
