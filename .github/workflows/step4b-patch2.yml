name: step4b-patch2
on:
  push:
    branches: [agent/step4b-gamehub-render-trace]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step4b-gamehub-render-trace
      - name: Add Game Hub phase tracing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gamehub.html')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected one target, found {s.count(old)}')
              s=s.replace(old,new,1)

          rep('''  function renderGameHubFromState(state, { allowPersist = true } = {}){\n    const { standings } = renderStandings(state);\n    renderBestWorstStats(state, standings);\n    renderRatingsLeaderboards(state, standings);\n    renderSurprisesBusts(state, standings);\n    renderTodaysMatchup(state, standings, { allowPersist });\n  }''', '''  function beginGameHubPerfSpan(name, detail = {}){\n    const span = window.TaskPointsPerf?.span;\n    return typeof span === 'function' ? span(name, detail) : (() => {});\n  }\n\n  function renderGameHubFromState(state, { allowPersist = true } = {}){\n    const finishAll = beginGameHubPerfSpan('gamehub.renderAllSections', {\n      players: Array.isArray(state?.players) ? state.players.length : 0,\n      completions: Array.isArray(state?.completions) ? state.completions.length : 0,\n      matchups: Array.isArray(state?.matchups) ? state.matchups.length : 0,\n      gameHistory: Array.isArray(state?.gameHistory) ? state.gameHistory.length : 0,\n      allowPersist\n    });\n    const finishStandings = beginGameHubPerfSpan('gamehub.renderStandings');\n    const { standings } = renderStandings(state);\n    finishStandings({ rows: standings?.length || 0 });\n    const finishBestWorst = beginGameHubPerfSpan('gamehub.renderBestWorstStats');\n    renderBestWorstStats(state, standings);\n    finishBestWorst();\n    const finishRatings = beginGameHubPerfSpan('gamehub.renderRatingsLeaderboards');\n    renderRatingsLeaderboards(state, standings);\n    finishRatings();\n    const finishSurprises = beginGameHubPerfSpan('gamehub.renderSurprisesBusts');\n    renderSurprisesBusts(state, standings);\n    finishSurprises();\n    const finishMatchup = beginGameHubPerfSpan('gamehub.renderTodaysMatchup');\n    renderTodaysMatchup(state, standings, { allowPersist });\n    finishMatchup();\n    finishAll({ rows: standings?.length || 0 });\n  }''', 'render sections')

          rep('''  function runGameHubBoot(){\n    if (gameHubBootStarted || gameHubBootFinished) return;\n    gameHubBootStarted = true;\n\n    // Boot must remain read-only to avoid unintended persistence/pruning on mobile.\n    const bootSync = syncStateForDisplayOnly(currentState || loadState(), { phase: 'deferred-boot' });''', '''  function runGameHubBoot(){\n    if (gameHubBootStarted || gameHubBootFinished) return;\n    gameHubBootStarted = true;\n    const finishBoot = beginGameHubPerfSpan('gamehub.deferredBoot');\n\n    // Boot must remain read-only to avoid unintended persistence/pruning on mobile.\n    const finishBootSync = beginGameHubPerfSpan('gamehub.deferredBoot.syncStateForDisplayOnly');\n    const bootSync = syncStateForDisplayOnly(currentState || loadState(), { phase: 'deferred-boot' });\n    finishBootSync({ changed: !!bootSync.changed });''', 'boot start')

          rep('''    currentState = state;\n    gameHubBootFinished = true;\n    renderGameHubFromState(state, { allowPersist: false });\n  }\n\n  function scheduleGameHubBoot(){''', '''    currentState = state;\n    gameHubBootFinished = true;\n    renderGameHubFromState(state, { allowPersist: false });\n    finishBoot({ changed: !!bootSync.changed });\n  }\n\n  function scheduleGameHubBoot(){''', 'boot end')

          rep('''  function renderInitialGameHub(){\n    const initialSync = syncStateForDisplayOnly(loadState(), { phase: 'initial-boot-render' });\n    const state = initialSync.state;''', '''  function renderInitialGameHub(){\n    const finishInitial = beginGameHubPerfSpan('gamehub.initialRender');\n    const finishLoad = beginGameHubPerfSpan('gamehub.initialRender.loadState');\n    const initialLoadedState = loadState();\n    finishLoad();\n    const finishInitialSync = beginGameHubPerfSpan('gamehub.initialRender.syncStateForDisplayOnly');\n    const initialSync = syncStateForDisplayOnly(initialLoadedState, { phase: 'initial-boot-render' });\n    finishInitialSync({ changed: !!initialSync.changed });\n    const state = initialSync.state;''', 'initial start')

          rep('''    currentState = state;\n    renderGameHubFromState(state, { allowPersist: false });\n    scheduleGameHubBoot();\n  }\n\n  $('refreshGameHub')?.addEventListener('click', () => scheduleRender(renderAll));''', '''    currentState = state;\n    renderGameHubFromState(state, { allowPersist: false });\n    scheduleGameHubBoot();\n    finishInitial({ changed: !!initialSync.changed });\n  }\n\n  $('refreshGameHub')?.addEventListener('click', () => scheduleRender(renderAll));''', 'initial end')

          p.write_text(s)
          PY
          grep -q 'gamehub.renderAllSections' gamehub.html
          grep -q 'gamehub.deferredBoot.syncStateForDisplayOnly' gamehub.html
          grep -q 'gamehub.initialRender.syncStateForDisplayOnly' gamehub.html
          git diff --check
      - name: Commit final Step 4B diagnostic patch
        shell: bash
        run: |
          rm -f .github/workflows/step4b-patch.yml .github/workflows/step4b-patch2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gamehub.html .github/workflows/step4b-patch.yml .github/workflows/step4b-patch2.yml
          git commit -m 'Trace Game Hub boot and render phases'
          git push origin HEAD:agent/step4b-gamehub-render-trace
