name: step5d-patch
on:
  push:
    branches:
      - agent/step5d-longer-compaction-quiet
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5d-longer-compaction-quiet
      - name: Apply Step 5D patch
        run: python scripts/step5d_patch.py
      - name: Run focused tests
        run: |
          node --check task_mutation_journal.js
          node --test tests/task_mutation_journal_contract.test.js
          git diff --check
      - name: Commit Step 5D
        run: |
          rm -f scripts/step5d_patch.py .github/workflows/step5d-patch.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Extend task compaction quiet window'
          git push origin HEAD:agent/step5d-longer-compaction-quiet
