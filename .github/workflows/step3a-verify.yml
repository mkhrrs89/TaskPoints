name: Step 3A verification

on:
  push:
    branches:
      - step-3a-storage-hot-path

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run focused Step 3A tests
        run: >-
          node --test
          tests/step3a_storage_hot_path.test.js
          tests/phase2_dual_write.test.js
          tests/phase5b_deferred_mirror_contract.test.js
          tests/performance_diagnostics.test.js
          tests/worker_versioned_core_bundle_contract.test.js
          tests/phase4_storage_contract.test.js
          tests/phase4_read_contract.test.js
          tests/phase4_primary_cache_warmup_contract.test.js
          tests/phase3_navigation_cache.test.js
          tests/phase5a_native_snapshot_contract.test.js
