name: Home Live State Read Churn Once

on:
  push:
    branches:
      - fix/home-live-state-read-churn-20260914
    paths:
      - '.github/workflows/home-live-state-read-churn-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-live-state-read-churn-20260914
          fetch-depth: 0

      - name: Apply live-state read patch
        run: python .github/scripts/apply_home_live_state_read_fix.py

      - name: Run focused Home read and safety contracts
        run: >-
          node --test
          tests/home_live_state_bridge_contract.test.js
          tests/recurring_task_done_today_ui_contract.test.js
          tests/home_season_slate_long_quiet_contract.test.js
          tests/home_featured_matchup_visibility.test.js
          tests/step3c_home_read_hotpath.test.js
          tests/diagnostics_asset_cache_versions.test.js
          tests/heavy_storage_serial_guard.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
          tests/home_revision_refresh_contract.test.js

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat

      - name: Commit tested patch
        run: |
          rm -f .github/scripts/apply_home_live_state_read_fix.py
          rm -f .github/workflows/home-live-state-read-churn-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reuse live Home state for UI-only readers"
          git push origin HEAD:fix/home-live-state-read-churn-20260914
