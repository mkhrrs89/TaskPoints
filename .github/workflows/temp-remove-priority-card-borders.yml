name: Temporary Remove Priority Card Borders

on:
  push:
    branches:
      - agent/remove-priority-card-borders

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-priority-card-borders
          fetch-depth: 0

      - name: Remove colored high and critical borders
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'styles.css';
          let source = fs.readFileSync(file, 'utf8');

          const replacements = [
            ['  border-color: rgba(248, 113, 113, 0.55) !important;', '  border-color: transparent !important;'],
            ['  border-color: rgba(251, 146, 60, 0.45) !important;', '  border-color: transparent !important;'],
          ];

          for (const [from, to] of replacements) {
            const matches = source.split(from).length - 1;
            if (matches !== 1) throw new Error(`Expected exactly one match for ${from}, found ${matches}`);
            source = source.replace(from, to);
          }

          if (!source.includes('.critical-card {') || !source.includes('.high-card {')) {
            throw new Error('Priority card gradient rules are missing');
          }
          fs.writeFileSync(file, source);
          NODE

      - name: Verify gradients remain and colored borders are gone
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('styles.css', 'utf8');
          const critical = source.slice(source.indexOf('.critical-card {'), source.indexOf('.critical-card {') + 350);
          const high = source.slice(source.indexOf('.high-card {'), source.indexOf('.high-card {') + 350);
          for (const [name, block] of [['critical', critical], ['high', high]]) {
            if (!block.includes('background: linear-gradient(')) throw new Error(`${name} gradient missing`);
            if (!block.includes('border-color: transparent !important;')) throw new Error(`${name} border not transparent`);
          }
          if (source.includes('border-color: rgba(248, 113, 113, 0.55) !important;')) throw new Error('Critical red border still present');
          if (source.includes('border-color: rgba(251, 146, 60, 0.45) !important;')) throw new Error('High orange border still present');
          NODE

      - name: Run task-card regression tests
        run: node --test tests/task_action_fast_paths.test.js tests/step5h_task_card_expand_state_handoff.test.js

      - name: Commit verified tweak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Remove colored priority card borders"
          git push origin HEAD:agent/remove-priority-card-borders
