name: Step 5F corrective patch v2

on:
  push:
    branches:
      - agent/step5f-post-action-read-cache

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/step5f-post-action-read-cache
          fetch-depth: 0

      - name: Apply corrective Step 5F patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          home_path = Path('index.html')
          home = home_path.read_text()
          reps = [
              ('function renderTasks(){', 'function renderTasks(stateInput = null){'),
              ("  persistTaskActionMutation(t, 'bump-one-day');\n  renderTasks();\n  window.updateCriticalTasksIsland?.(state);", "  persistTaskActionMutation(t, 'bump-one-day');\n  renderTasks(state);"),
              ("  persistTaskActionMutation(t, 'wont-do');\n  renderTasks();\n  window.updateCriticalTasksIsland?.(state);", "  persistTaskActionMutation(t, 'wont-do');\n  renderTasks(state);"),
              ("  persistTaskActionMutation(t, 'edit-save');\n  renderTasks();\n  window.updateCriticalTasksIsland?.(state);", "  persistTaskActionMutation(t, 'edit-save');\n  renderTasks(state);"),
              ("  container.appendChild(fragment);\n  initTaskListDelegation();\n  updateTaskActionSheetVisibility();\n  window.updateCriticalTasksIsland?.();\n}", "  container.appendChild(fragment);\n  initTaskListDelegation();\n  updateTaskActionSheetVisibility();\n  window.updateCriticalTasksIsland?.(stateInput);\n}"),
          ]
          for old, new in reps:
              n = home.count(old)
              if n != 1:
                  raise SystemExit(f'expected one Home match, found {n}: {old[:70]}')
              home = home.replace(old, new, 1)
          home_path.write_text(home)
          toolbar_path = Path('toolbar.js')
          toolbar = toolbar_path.read_text()
          old_state = "    const state = hasProvidedState ? stateInput : loadRawStateFallback();"
          new_state = "    let state;\n    let source = 'stored-state';\n    if (hasProvidedState) {\n      if (typeof window.TaskPointsCore?.applyPendingTaskMutations === 'function') {\n        state = window.TaskPointsCore.applyPendingTaskMutations(stateInput);\n        source = 'provided-state+journal';\n      } else {\n        state = stateInput;\n        source = 'provided-state';\n      }\n    } else {\n      state = loadRawStateFallback();\n    }"
          if toolbar.count(old_state) != 1:
              raise SystemExit('expected one toolbar state assignment')
          toolbar = toolbar.replace(old_state, new_state, 1)
          old_source = "        source: hasProvidedState ? 'provided-state' : 'stored-state',"
          if toolbar.count(old_source) != 1:
              raise SystemExit('expected one toolbar PERF source expression')
          toolbar = toolbar.replace(old_source, '        source,', 1)
          toolbar_path.write_text(toolbar)
          test_b64 = ''
          Path('tests/step5f_critical_tasks_state_handoff.test.js').write_bytes(base64.b64decode(test_b64))
          PY

      - name: Run Step 5F validation
        run: |
          node --check toolbar.js
          node --check task_mutation_journal.js
          node --test tests/task_action_fast_paths.test.js tests/task_mutation_journal_contract.test.js tests/step5f_critical_tasks_state_handoff.test.js
          git diff --check

      - name: Commit corrective patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git rm .github/workflows/step5f-corrective.yml .github/workflows/step5f-corrective-v2.yml
          git add index.html toolbar.js tests/step5f_critical_tasks_state_handoff.test.js
          git commit -m "Fix Step 5F duplicate critical state read"
          git push origin HEAD:agent/step5f-post-action-read-cache
