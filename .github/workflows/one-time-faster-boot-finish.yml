name: One-time faster boot finish

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-index:
    if: github.head_ref == 'automation/faster-boot-finish' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Shorten completed-title hold
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_timer_pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)tpBootFinishTimer = setTimeout\(\(\) => \{\n'
              r'(?P=indent)  finishMatrixBootNow\(\);\n'
              r'(?P=indent)\}, 1000\);$'
          )
          new_timer_pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)tpBootFinishTimer = setTimeout\(\(\) => \{\n'
              r'(?P=indent)  finishMatrixBootNow\(\);\n'
              r'(?P=indent)\}, 180\);$'
          )
          pause_old = '  await new Promise(r => setTimeout(r, 120));'
          pause_new = '  await new Promise(r => setTimeout(r, 80));'

          old_timer_count = len(old_timer_pattern.findall(text))
          new_timer_count = len(new_timer_pattern.findall(text))
          old_pause_count = text.count(pause_old)
          new_pause_count = text.count(pause_new)

          if (old_timer_count, old_pause_count) == (2, 1):
              text, replaced_timers = old_timer_pattern.subn(
                  lambda match: match.group(0).replace('1000', '180'),
                  text,
              )
              if replaced_timers != 2:
                  raise SystemExit(f"Expected two timer replacements, got {replaced_timers}")
              text = text.replace(pause_old, pause_new, 1)
              path.write_text(text, encoding="utf-8")
          elif (
              old_timer_count,
              old_pause_count,
              new_timer_count,
              new_pause_count,
          ) == (0, 0, 2, 1):
              print("Boot timing patch is already present.")
          else:
              raise SystemExit(
                  "Unexpected boot timing state: "
                  f"old_timers={old_timer_count}, old_pause={old_pause_count}, "
                  f"new_timers={new_timer_count}, new_pause={new_pause_count}"
              )

      - name: Verify exact scope
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          new_timer_pattern = re.compile(
              r'(?m)^(?P<indent>[ ]*)tpBootFinishTimer = setTimeout\(\(\) => \{\n'
              r'(?P=indent)  finishMatrixBootNow\(\);\n'
              r'(?P=indent)\}, 180\);$'
          )
          assert len(new_timer_pattern.findall(text)) == 2
          assert "  await new Promise(r => setTimeout(r, 80));" in text
          assert "  await new Promise(r => setTimeout(r, 120));" not in text
          assert "setTimeout(() => splash.remove(), 320);" in text
          PY

          if ! git diff --quiet -- index.html; then
            test "$(git diff --numstat -- index.html)" = $'3\t3\tindex.html'
            git diff --check
            git diff --unified=3 -- index.html
          fi

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten startup animation finish delay"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}