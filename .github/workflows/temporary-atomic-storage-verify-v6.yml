name: Temporary Atomic Storage Verify v6

on:
  push:
    branches:
      - 'fix/atomic-storage-replacement-20260914'
    paths:
      - '.github/workflows/temporary-atomic-storage-verify-v6.yml'

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/atomic-storage-replacement-20260914
          fetch-depth: 0

      - name: Update stale optimizer comment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('settings.html')
          text = path.read_text()
          old = """      // Important: remove-first write. iPhone may not have enough temp room to overwrite
      // a large string with a smaller value. Do not route this manual rescue through
      // the normal app save/merge path; only change the raw storage representation.
"""
          new = """      // Replace in place so a failed iPhone storage write cannot delete the authoritative snapshot first.
      // Keep this manual optimization on the raw representation only; the data-loss guard remains active.
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale remove-first optimizer comment, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Run focused storage safety suite
        run: >-
          node --test
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
          tests/phase2_reset_hook.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase5b_deferred_mirror_contract.test.js

      - name: Commit verified cleanup and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'TaskPoints Storage Safety Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-atomic-storage-verify-v6.yml
          git add settings.html
          git commit -m 'Clarify atomic storage optimizer safety'
          git push origin HEAD:fix/atomic-storage-replacement-20260914
