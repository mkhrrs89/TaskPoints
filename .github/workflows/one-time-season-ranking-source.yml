name: One-time season ranking source selector

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.ref == 'automation/season-ranking-source-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/season-ranking-source-v2
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - run: python3 .github/scripts/one_time_season_ranking_source.py
      - run: |
          set -euo pipefail
          node --check season.js
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          for file in "${changed[@]}"; do
            case "$file" in
              season.js|.github/scripts/one_time_season_ranking_source.py|.github/automation-triggers/season-ranking-source.txt) ;;
              *) echo "Unexpected changed file: $file"; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | grep -qx season.js
          node <<'NODE'
          global.window = global;
          global.TaskPointsCore = {};
          require('./season.js');
          const season = global.TaskPointsSeason;
          const sample = {
            matchups: [
              { dateKey: '2026-06-30', id: 's1' },
              { dateKey: '2026-07-01', id: 's2' }
            ],
            gameHistory: [
              { dateKey: '2026-06-15', id: 'g1' },
              { dateKey: '2026-07-15', id: 'g2' }
            ],
            completions: [
              { completedAtISO: '2026-06-20T12:00:00.000Z', id: 'c1' },
              { completedAtISO: '2026-07-20T12:00:00.000Z', id: 'c2' }
            ]
          };
          const s1 = season.getScopedSeedRankingState(sample, 'season1');
          const s2 = season.getScopedSeedRankingState(sample, 'season2');
          if (s1.matchups.map(x => x.id).join(',') !== 's1') throw new Error('Season 1 matchup scope failed');
          if (s2.matchups.map(x => x.id).join(',') !== 's2') throw new Error('Season 2 matchup scope failed');
          if (s1.gameHistory.map(x => x.id).join(',') !== 'g1') throw new Error('Season 1 history scope failed');
          if (s2.completions.map(x => x.id).join(',') !== 'c2') throw new Error('Season 2 completion scope failed');
          if (season.normalizeSeedRankingScope('', { id: 'season_2_august_2026' }) !== 'season2') throw new Error('Season 2 default failed');
          NODE
          git config user.name "TaskPoints Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- season.js .github/scripts/one_time_season_ranking_source.py .github/automation-triggers/season-ranking-source.txt
          git commit -m "Add season ranking seed source selector"
          git push origin HEAD:automation/season-ranking-source-v2
