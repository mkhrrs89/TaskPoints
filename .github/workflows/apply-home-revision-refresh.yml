name: Apply Home revision-aware refresh

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - fix/home-revision-aware-refresh
    paths:
      - .github/workflows/apply-home-revision-refresh.yml

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Make revision stamping best effort
        shell: python
        run: |
          from pathlib import Path
          toolbar_path = Path('toolbar.js')
          toolbar = toolbar_path.read_text(encoding='utf-8')
          old = '''  const publishRevision = (reason = 'state-write', emitEvent = true) => {
            const revision = createRevision();
            baseSetItem(REVISION_KEY, revision);
            if (emitEvent && typeof global.dispatchEvent === 'function' && typeof global.CustomEvent === 'function') {
              global.dispatchEvent(new CustomEvent('taskpoints:state-revision', {
                detail: { revision, reason }
              }));
            }
            return revision;
          };'''
          new = '''  const publishRevision = (reason = 'state-write', emitEvent = true) => {
            const revision = createRevision();
            try {
              baseSetItem(REVISION_KEY, revision);
            } catch (_) {
              return read();
            }
            if (emitEvent && typeof global.dispatchEvent === 'function' && typeof global.CustomEvent === 'function') {
              global.dispatchEvent(new global.CustomEvent('taskpoints:state-revision', {
                detail: { revision, reason }
              }));
            }
            return revision;
          };'''
          if old in toolbar:
            toolbar_path.write_text(toolbar.replace(old, new, 1), encoding='utf-8')
          elif 'return read();' not in toolbar:
            raise SystemExit('Expected revision publisher block was not found')

          test_path = Path('tests/home_revision_refresh_contract.test.js')
          test = test_path.read_text(encoding='utf-8')
          marker = "  assert.match(toolbar, /taskpoints_state_revision_v1/);\n"
          assertion = "  assert.match(toolbar, /taskpoints_state_revision_v1/);\n  assert.match(toolbar, /try \\{\\s*baseSetItem\\(REVISION_KEY, revision\\);\\s*\\} catch/);\n"
          if 'baseSetItem\\(REVISION_KEY, revision\\)' not in test:
            if test.count(marker) != 1:
              raise SystemExit('Expected revision test marker was not found')
            test_path.write_text(test.replace(marker, assertion, 1), encoding='utf-8')
      - name: Run focused checks
        run: |
          node --check toolbar.js
          node --test tests/home_revision_refresh_contract.test.js
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toolbar.js tests/home_revision_refresh_contract.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep revision stamping non-blocking"
          git push
