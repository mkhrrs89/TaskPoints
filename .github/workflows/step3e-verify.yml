name: Step 3E verification

on:
  push:
    branches:
      - agent/step3e-startup-storage

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript syntax
        run: >-
          node --check phase2_dual_write.js &&
          node --check phase3_read_path.js &&
          node --check phase3_navigation_cache.js &&
          node --check phase4_primary_read_path.js &&
          node --check storage_maintenance_idle.js &&
          node --check you_score_alias_alignment.js &&
          node --check tests/step3e_startup_storage.test.js
      - name: Run Step 3E focused tests
        run: >-
          node --test
          tests/step3e_startup_storage.test.js
          tests/step3d_navigation_maintenance.test.js
          tests/phase2_dual_write.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase3_read_path.test.js
          tests/phase3_navigation_cache.test.js
          tests/phase3_underlying_cache_invalidation.test.js
          tests/phase4_primary_cache_warmup_contract.test.js
          tests/phase4_read_contract.test.js
          tests/phase4_lightweight_read_validation_contract.test.js
          tests/you_score_alias_alignment.test.js
          tests/you_score_alias_sync.test.js
          tests/storage_compression.test.js
          tests/save_pipeline_shared_work_contract.test.js
          tests/step3a_storage_hot_path.test.js

  tests-e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/emergency_recovery_contract.test.js tests/emergency_recovery_lock_authorization_contract.test.js

  tests-f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/faster_mode_reopen_persistence_contract.test.js tests/flex_action_fast_path_contract.test.js tests/flex_action_fast_path_review_contract.test.js

  tests-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/game_history_reconciliation_repair.test.js tests/greed_rating.test.js

  tests-habit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: >-
          node --test
          tests/habit_completion_exact_date_key.test.js
          tests/habit_completion_status_guard.test.js
          tests/habit_fast_path_control.test.js
          tests/habit_interaction_fast_path_contract.test.js
          tests/habit_ledger_completion_backed_repair.test.js
          tests/habit_ledger_consistency_repair.test.js
          tests/habit_ledger_history_preservation.test.js
          tests/habit_ledger_matchup_dateiso.test.js
          tests/habit_ledger_matchup_impact_attestation.test.js
          tests/habit_ledger_matchup_impact_canonical.test.js
          tests/habit_ledger_matchup_impact_guard.test.js
          tests/habit_ledger_matchup_legacy_safety.test.js
          tests/habit_ledger_matchup_restore.test.js
          tests/habit_ledger_score_reconciliation.test.js
          tests/habit_ledger_score_reconciliation_hardening.test.js
          tests/habit_week_plate_fast_restack.test.js

  tests-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: >-
          node --test
          tests/home_export_responsiveness.test.js
          tests/home_featured_matchup_visibility.test.js
          tests/home_first_paint_maintenance.test.js
          tests/home_graph_trendline_layering.test.js
          tests/home_indexeddb_first_boot_contract.test.js
          tests/home_matchup_export_regression.test.js
          tests/home_revision_refresh_contract.test.js
          tests/home_scoreboard_rank_gold.test.js
          tests/home_targeted_render_contract.test.js
          tests/home_targeted_render_control.test.js
          tests/home_yesterday_result_consistency.test.js
