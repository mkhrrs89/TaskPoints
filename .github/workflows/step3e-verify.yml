name: Step 3E verification

on:
  push:
    branches:
      - agent/step3e-startup-storage

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript syntax
        run: >-
          node --check phase2_dual_write.js &&
          node --check phase3_read_path.js &&
          node --check phase3_navigation_cache.js &&
          node --check phase4_primary_read_path.js &&
          node --check storage_maintenance_idle.js &&
          node --check you_score_alias_alignment.js &&
          node --check tests/step3e_startup_storage.test.js
      - name: Run Step 3E focused tests
        run: >-
          node --test
          tests/step3e_startup_storage.test.js
          tests/step3d_navigation_maintenance.test.js
          tests/phase2_dual_write.test.js
          tests/phase2_authoritative_absence.test.js
          tests/phase3_read_path.test.js
          tests/phase3_navigation_cache.test.js
          tests/phase3_underlying_cache_invalidation.test.js
          tests/phase4_primary_cache_warmup_contract.test.js
          tests/phase4_read_contract.test.js
          tests/phase4_lightweight_read_validation_contract.test.js
          tests/you_score_alias_alignment.test.js
          tests/you_score_alias_sync.test.js
          tests/storage_compression.test.js
          tests/save_pipeline_shared_work_contract.test.js
          tests/step3a_storage_hot_path.test.js
      - name: Run full test suite
        run: node --test tests/*.test.js
