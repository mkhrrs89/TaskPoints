name: Run Phase 4 write recovery hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-4-write-recovery-hotfix
          fetch-depth: 0

      - name: Extract and apply robust hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/run-phase4-write-recovery-hotfix-v2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = [line[10:] if line.startswith('          ') else line for line in source[start:end]]
          Path('/tmp/apply_phase4_write_recovery.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_phase4_write_recovery.py

      - name: Validate hotfix
        shell: bash
        run: |
          node --check phase4_storage_coordinator.js
          node --test tests/phase4_storage_contract.test.js tests/phase4_read_contract.test.js tests/phase4_worker_contract.test.js tests/phase4_journal_recovery_contract.test.js tests/phase4_status_recovery_contract.test.js
          npm test

      - name: Commit clean hotfix
        shell: bash
        run: |
          rm -f .github/workflows/apply-phase4-write-recovery-hotfix.yml
          rm -f .github/workflows/run-phase4-write-recovery-hotfix.yml
          rm -f .github/workflows/run-phase4-write-recovery-hotfix-v2.yml
          rm -f .github/phase4-write-recovery-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Phase 4 write recovery and coalescing"
          git push origin HEAD:codex/phase-4-write-recovery-hotfix
