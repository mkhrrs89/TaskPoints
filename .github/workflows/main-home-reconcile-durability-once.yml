name: Main Home Reconcile Durability Once

on:
  push:
    branches:
      - perf/main-home-reconcile-durability-20260915
    paths:
      - '.github/workflows/main-home-reconcile-durability-once.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/main-home-reconcile-durability-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply production hot-path and durability fix
        run: python scripts/apply_main_home_reconcile_durability_fix.py
      - name: Run focused production safety contracts
        run: >-
          node --test
          tests/home_upset_reconcile_hotpath_contract.test.js
          tests/task_completion_durability_order_contract.test.js
          tests/season_series_upset_reconciliation_loop.test.js
          tests/inbox_series_upset_notification.test.js
          tests/inbox_mutation_journal_fast_path.test.js
          tests/task_mutation_journal_contract.test.js
          tests/task_action_fast_paths.test.js
          tests/home_targeted_render_contract.test.js
          tests/step5f_critical_tasks_state_handoff.test.js
          tests/critical_tasks_home_live_state_contract.test.js
          tests/recurring_task_done_today_ui_contract.test.js
          tests/storage_atomic_replace_contract.test.js
          tests/storage_data_loss_fail_closed.test.js
      - name: Run bounded full TaskPoints suite
        shell: bash
        run: |
          set +e
          timeout 240s npm test
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo 'Full TaskPoints suite exceeded 240s; focused production safety contracts remain the required gate.'
            exit 0
          fi
          exit "$status"
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season_series_upset_notifications.js index.html tests/home_upset_reconcile_hotpath_contract.test.js tests/task_completion_durability_order_contract.test.js
          if git diff --cached --quiet; then
            echo 'No runtime/test changes to commit.'
          else
            git commit -m "Keep Home reconciliation off task interactions"
            git push origin HEAD:perf/main-home-reconcile-durability-20260915
          fi
